<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events — Sevenday Bike</title>
<meta name="description" content="ງານແຂ່ງຂັນ ແລະ ກິດຈະກຳປັ່ນລົດຖີບ ຂອງ Sevenday Bike ວຽງຈັນ — ສະໝັກອອນລາຍ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Sevenday.css">
<style>
.ev-hero{background:var(--black);color:var(--white);padding:48px 0 40px}
.ev-hero h1{font-size:clamp(30px,5vw,48px);font-weight:900;letter-spacing:-1px;line-height:1.05;text-wrap:balance}
.ev-hero p{color:var(--grey-300);margin-top:10px;max-width:56ch}
.ev-hero .mine{display:inline-flex;margin-top:18px;font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:4px}

.ev-tabs{border-bottom:1px solid var(--grey-300);background:var(--white);position:sticky;top:76px;z-index:20}
.ev-tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.ev-tabs .wrap::-webkit-scrollbar{display:none}
.ev-tab{flex-shrink:0;padding:14px 16px;font-weight:700;font-size:14px;color:var(--grey-600);border-bottom:3px solid transparent}
.ev-tab[aria-pressed="true"]{color:var(--black);border-bottom-color:var(--black)}

.ev-list{padding:32px 0 72px}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.ev-card{display:flex;flex-direction:column;border:1px solid var(--grey-300);background:var(--white);transition:border-color .15s}
.ev-card:hover{border-color:var(--black)}
.ev-cover{aspect-ratio:16/9;background:var(--grey-100);position:relative;overflow:hidden;display:grid;place-items:center}
.ev-cover img{width:100%;height:100%;object-fit:cover}
.ev-cover svg{width:96px;height:56px;color:var(--grey-300)}
.ev-state{position:absolute;top:12px;left:12px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--white);color:var(--black)}
.ev-state.OPEN{background:var(--black);color:var(--white)}
.ev-body{padding:18px 18px 0;display:flex;flex-direction:column;gap:6px;flex:1}
.ev-type{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--grey-600)}
.ev-name{font-size:19px;font-weight:900;line-height:1.25;letter-spacing:-.3px;text-wrap:balance}
.ev-meta{font-size:14px;color:var(--grey-600);display:flex;flex-direction:column;gap:2px}
.ev-foot{display:flex;align-items:end;justify-content:space-between;gap:12px;padding:16px 18px 18px;margin-top:auto}
.ev-price small{display:block;font-size:12px!important;color:var(--grey-600);font-weight:600}
.ev-price b{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.ev-left{font-size:12px;color:var(--grey-600);text-align:right}
.ev-card .btn{height:44px;margin:0 18px 18px}
.ev-card .btn-line{border:2px solid var(--black)}

.ev-empty{grid-column:1/-1;text-align:center;padding:64px 16px;color:var(--grey-600)}
.ev-empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.sk{background:var(--grey-100);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media(max-width:900px){.ev-tabs{top:64px}}
</style>
</head>
<body>

<section class="ev-hero">
  <div class="wrap">
    <h1>Events &amp; Rides</h1>
    <p>ງານແຂ່ງຂັນ, ປັ່ນກຸ່ມ ແລະ ກິດຈະກຳຂອງ Sevenday Bike — ສະໝັກ ແລະ ຊຳລະອອນລາຍໄດ້ເລີຍ.</p>
    <a class="mine" href="my-registrations.html">ເບິ່ງການສະໝັກຂອງຂ້ອຍ →</a>
  </div>
</section>

<nav class="ev-tabs" aria-label="ປະເພດງານ">
  <div class="wrap" id="tabs"></div>
</nav>

<main class="ev-list">
  <div class="wrap">
    <div class="ev-grid" id="grid">
      <div class="ev-card"><div class="ev-cover sk"></div><div class="ev-body"><div class="sk" style="height:14px;width:40%"></div><div class="sk" style="height:22px;width:85%"></div><div class="sk" style="height:14px;width:60%"></div></div><div class="ev-foot"></div></div>
      <div class="ev-card"><div class="ev-cover sk"></div><div class="ev-body"><div class="sk" style="height:14px;width:40%"></div><div class="sk" style="height:22px;width:85%"></div><div class="sk" style="height:14px;width:60%"></div></div><div class="ev-foot"></div></div>
      <div class="ev-card"><div class="ev-cover sk"></div><div class="ev-body"><div class="sk" style="height:14px;width:40%"></div><div class="sk" style="height:22px;width:85%"></div><div class="sk" style="height:14px;width:60%"></div></div><div class="ev-foot"></div></div>
    </div>
  </div>
</main>

<script>
/* Events API — names prefixed EVT_ so they don't clash with layout.js */
const EVT_API = 'https://script.google.com/macros/s/AKfycbyOcu6vlWUnvzRb4GTjEpxz5Amre1KhTYa7wU9PPjVlBd79B8XMzeJER_h-OLrHnxBboA/exec';
const EVT_KEY = 'SDdMc3wNjJEevs60n2oMQeGnuI';
async function evtGet(params){
  const r = await fetch(EVT_API + '?' + new URLSearchParams({ secret: EVT_KEY, ...params }));
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'API error');
  return j.data;
}
const evtEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const evtKip = n => '₭' + Math.round(Number(n) || 0).toLocaleString('en-US');
const EVT_MONTHS = ['ມັງກອນ','ກຸມພາ','ມີນາ','ເມສາ','ພຶດສະພາ','ມິຖຸນາ','ກໍລະກົດ','ສິງຫາ','ກັນຍາ','ຕຸລາ','ພະຈິກ','ທັນວາ'];
const evtDate = ymd => { if (!ymd) return ''; const [y,m,d] = ymd.split('-').map(Number); return `${d} ${EVT_MONTHS[m-1]} ${y}`; };
const EVT_TYPES = { CYCLING:'ປັ່ນລົດຖີບ', RUNNING:'ແລ່ນ', COMMUNITY:'ກິດຈະກຳ', WORKSHOP:'Workshop', OTHER:'ອື່ນໆ' };
const STATE = { OPEN:'ເປີດຮັບສະໝັກ', SOON:'ໄວໆນີ້', CLOSED:'ປິດຮັບສະໝັກ' };

let events = [], type = new URLSearchParams(location.search).get('type') || '';

function renderTabs(){
  const types = ['', ...Object.keys(EVT_TYPES).filter(t => events.some(e => String(e.event_type).toUpperCase() === t))];
  document.getElementById('tabs').innerHTML = types.map(t =>
    `<button class="ev-tab" type="button" data-t="${t}" aria-pressed="${t === type}">${t ? EVT_TYPES[t] : 'ທັງໝົດ'}</button>`).join('');
  document.querySelectorAll('.ev-tab').forEach(b => b.onclick = () => { type = b.dataset.t; renderTabs(); renderGrid(); });
}

function evCard(e){
  const finished = e.status === 'EVENT_FINISHED';
  const state = finished ? 'CLOSED' : e.registration_state;
  const full = e.remaining === 0;
  const canReg = state === 'OPEN' && !full;
  const label = finished ? 'ງານຈົບແລ້ວ' : full ? 'ເຕັມແລ້ວ' : STATE[state] || state;
  const price = e.price_from === null ? '' : e.price_from === e.price_to
    ? (e.price_from ? evtKip(e.price_from) : 'ຟຣີ')
    : `${e.price_from ? evtKip(e.price_from) : 'ຟຣີ'} – ${evtKip(e.price_to)}`;
  const href = 'events-register.html?event_id=' + encodeURIComponent(e.event_id);
  return `<article class="ev-card">
    <a class="ev-cover" href="${href}">
      ${e.cover_image ? `<img src="${evtEsc(e.cover_image)}" alt="" loading="lazy">` : '<svg viewBox="0 0 120 70" fill="none" stroke="currentColor" stroke-width="4"><use href="#i-bike"/></svg>'}
      <span class="ev-state ${canReg ? 'OPEN' : ''}">${evtEsc(label)}</span>
    </a>
    <div class="ev-body">
      <span class="ev-type">${evtEsc(EVT_TYPES[String(e.event_type).toUpperCase()] || e.event_type || '')}</span>
      <a class="ev-name" href="${href}">${evtEsc(e.event_name)}</a>
      <div class="ev-meta">
        <span>${evtEsc(evtDate(e.event_date))}${e.start_time ? ' · ' + evtEsc(e.start_time) : ''}</span>
        ${e.location ? `<span>${evtEsc(e.location)}</span>` : ''}
        ${canReg && e.registration_close ? `<span>ປິດຮັບສະໝັກ ${evtEsc(evtDate(e.registration_close))}</span>` : ''}
      </div>
    </div>
    <div class="ev-foot">
      <div class="ev-price">${price ? `<small>ຄ່າສະໝັກ</small><b>${price}</b>` : ''}</div>
      ${canReg && e.remaining !== null ? `<div class="ev-left">ເຫຼືອ ${e.remaining} ບ່ອນ</div>` : ''}
    </div>
    <a class="btn ${canReg ? 'btn-black' : 'btn-line'}" href="${href}">${canReg ? 'ສະໝັກເລີຍ' : 'ເບິ່ງລາຍລະອຽດ'}</a>
  </article>`;
}

function renderGrid(){
  const list = events.filter(e => !type || String(e.event_type).toUpperCase() === type);
  // upcoming first, finished last
  list.sort((a,b) => (a.status === 'EVENT_FINISHED') - (b.status === 'EVENT_FINISHED') || String(a.event_date).localeCompare(String(b.event_date)));
  document.getElementById('grid').innerHTML = list.length ? list.map(evCard).join('')
    : '<div class="ev-empty"><b>ຍັງບໍ່ມີງານໃນຕອນນີ້</b>ຕິດຕາມງານໃໝ່ໄດ້ທີ່ໜ້າ Facebook ຂອງຮ້ານ</div>';
}

(async function(){
  try {
    events = (await evtGet({ action: 'evt.getEvents' })).events || [];
    renderTabs(); renderGrid();
  } catch (err) {
    document.getElementById('grid').innerHTML = `<div class="ev-empty"><b>ໂຫຼດຂໍ້ມູນບໍ່ໄດ້</b>${evtEsc(err.message)}<br><br><button class="btn btn-black" type="button" onclick="location.reload()">ລອງໃໝ່</button></div>`;
  }
})();
</script>
<script src="layout.js"></script>
</body>
</html>
