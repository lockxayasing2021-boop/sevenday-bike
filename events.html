<title>Events — Sevenday Bike</title>
<link rel="stylesheet" href="Sevenday.css">
<style>
:root {
  --accent: #FF3B00;
}

.evt-hero {
  background: var(--grey-900);
  color: var(--white);
  padding: 56px 0 40px;
  text-align: center;
}
.evt-hero h1 { font-size: clamp(1.8rem,4vw,2.8rem); font-weight: 900; margin: 0 0 8px; }
.evt-hero p  { color: var(--grey-300); margin: 0; font-size: 1.05rem; }

.evt-filters {
  background: var(--grey-100);
  border-bottom: 1px solid var(--grey-300);
  position: sticky;
  top: 0;
  z-index: 10;
}
.evt-filter-inner {
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 0 16px;
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
}
.evt-filter-inner::-webkit-scrollbar { display: none; }
.evt-filter-btn {
  flex-shrink: 0;
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  padding: 14px 18px;
  font-family: var(--font);
  font-size: .9rem;
  font-weight: 600;
  color: var(--grey-600);
  cursor: pointer;
  white-space: nowrap;
  transition: color .15s, border-color .15s;
}
.evt-filter-btn.active, .evt-filter-btn:hover { color: var(--accent); border-bottom-color: var(--accent); }

.evt-section { max-width: var(--wrap); margin: 0 auto; padding: 40px 16px 64px; }
.evt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap: 24px; }

.evt-card {
  border: 1px solid var(--grey-300);
  border-radius: 12px;
  overflow: hidden;
  background: var(--white);
  display: flex;
  flex-direction: column;
  transition: box-shadow .2s, transform .2s;
}
.evt-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,.1); transform: translateY(-2px); }
.evt-card-img {
  aspect-ratio: 16/9;
  background: var(--grey-100);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.evt-card-img img { width: 100%; height: 100%; object-fit: cover; }
.evt-card-img svg { width: 80px; height: 80px; color: var(--grey-300); }
.evt-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.evt-badge.open   { background: #00C853; color: #fff; }
.evt-badge.soon   { background: var(--accent); color: #fff; }
.evt-badge.full   { background: var(--grey-600); color: #fff; }
.evt-badge.closed { background: var(--grey-300); color: var(--grey-900); }

.evt-card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
.evt-card-cat  { font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.evt-card-name { font-size: 1.1rem; font-weight: 800; color: var(--grey-900); line-height: 1.3; text-wrap: balance; }
.evt-meta { display: flex; flex-direction: column; gap: 5px; }
.evt-meta-row { display: flex; align-items: flex-start; gap: 8px; font-size: .85rem; color: var(--grey-600); }
.evt-meta-row svg { flex-shrink: 0; width: 15px; height: 15px; margin-top: 1px; }
.evt-price { font-size: 1.1rem; font-weight: 800; color: var(--grey-900); }
.evt-price .free { color: #00C853; }
.evt-spots { font-size: .8rem; color: var(--grey-600); }
.evt-card-foot { padding: 0 20px 20px; }
.evt-btn {
  display: block;
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: var(--font);
  font-size: .95rem;
  font-weight: 700;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  transition: opacity .15s;
}
.evt-btn:hover { opacity: .88; }
.evt-btn.disabled { background: var(--grey-300); color: var(--grey-600); cursor: not-allowed; pointer-events: none; }

.evt-empty { text-align: center; padding: 80px 16px; color: var(--grey-600); }
.evt-empty svg { width: 64px; height: 64px; margin-bottom: 16px; color: var(--grey-300); }
.evt-empty h3 { margin: 0 0 8px; color: var(--grey-900); }
.evt-skeleton { animation: sk 1.4s infinite ease-in-out; background: var(--grey-100); border-radius: 6px; }
@keyframes sk { 0%,100%{opacity:.6} 50%{opacity:1} }
</style>

<section class="evt-hero">
  <div style="max-width:var(--wrap);margin:0 auto;padding:0 16px">
    <h1>Events &amp; Rides</h1>
    <p>ກິດຈະກໍາຈັກຍານ, ແຂ່ງຂັນ, ແລະ ສໍາຮ່ວງກຸ່ມ ຢູ່ Sevenday Bike</p>
  </div>
</section>

<div class="evt-filters">
  <div class="evt-filter-inner">
    <button class="evt-filter-btn active" data-cat="">ທັງໝົດ</button>
    <button class="evt-filter-btn" data-cat="race">ແຂ່ງຂັນ</button>
    <button class="evt-filter-btn" data-cat="ride">ຂີ່ກຸ່ມ</button>
    <button class="evt-filter-btn" data-cat="clinic">Clinic</button>
    <button class="evt-filter-btn" data-cat="mtb">MTB</button>
    <button class="evt-filter-btn" data-cat="road">Road</button>
  </div>
</div>

<section class="evt-section">
  <div id="evtGrid" class="evt-grid">
    <div style="border:1px solid var(--grey-300);border-radius:12px;overflow:hidden">
      <div class="evt-skeleton" style="aspect-ratio:16/9"></div>
      <div style="padding:20px;display:flex;flex-direction:column;gap:10px">
        <div class="evt-skeleton" style="height:14px;width:60%;border-radius:4px"></div>
        <div class="evt-skeleton" style="height:20px;width:90%;border-radius:4px"></div>
        <div class="evt-skeleton" style="height:14px;width:75%;border-radius:4px"></div>
        <div class="evt-skeleton" style="height:40px;border-radius:8px;margin-top:8px"></div>
      </div>
    </div>
    <div style="border:1px solid var(--grey-300);border-radius:12px;overflow:hidden">
      <div class="evt-skeleton" style="aspect-ratio:16/9"></div>
      <div style="padding:20px;display:flex;flex-direction:column;gap:10px">
        <div class="evt-skeleton" style="height:14px;width:50%;border-radius:4px"></div>
        <div class="evt-skeleton" style="height:20px;width:85%;border-radius:4px"></div>
        <div class="evt-skeleton" style="height:14px;width:70%;border-radius:4px"></div>
        <div class="evt-skeleton" style="height:40px;border-radius:8px;margin-top:8px"></div>
      </div>
    </div>
    <div style="border:1px solid var(--grey-300);border-radius:12px;overflow:hidden">
      <div class="evt-skeleton" style="aspect-ratio:16/9"></div>
      <div style="padding:20px;display:flex;flex-direction:column;gap:10px">
        <div class="evt-skeleton" style="height:14px;width:55%;border-radius:4px"></div>
        <div class="evt-skeleton" style="height:20px;width:80%;border-radius:4px"></div>
        <div class="evt-skeleton" style="height:14px;width:65%;border-radius:4px"></div>
        <div class="evt-skeleton" style="height:40px;border-radius:8px;margin-top:8px"></div>
      </div>
    </div>
  </div>
</section>

<script>
const API_URL_EVT = 'https://script.google.com/macros/s/AKfycbyOcu6vlWUnvzRb4GTjEpxz5Amre1KhTYa7wU9PPjVlBd79B8XMzeJER_h-OLrHnxBboA/exec';
const EVT_SECRET  = 'SDdMc3wNjJEevs60n2oMQeGnuI';

async function hmacSign(body){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(EVT_SECRET), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(body));
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function evtGet(params){
  const qs = Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  const sig = await hmacSign(qs);
  const res = await fetch(API_URL_EVT+'?'+qs+'&sig='+sig);
  return JSON.parse(await res.text());
}

let allEvents = [];
let activeCat = '';

function statusOf(e){
  const now = Date.now();
  const regStart = e.registrationStart ? new Date(e.registrationStart).getTime() : 0;
  const regEnd   = e.registrationEnd   ? new Date(e.registrationEnd).getTime()   : Infinity;
  const spots = e.availableSpots ?? ((e.maxParticipants||0) - (e.registeredCount||0));
  if(e.maxParticipants && spots <= 0) return 'full';
  if(now < regStart) return 'soon';
  if(now > regEnd)   return 'closed';
  return 'open';
}

function badgeFor(e){
  const s = statusOf(e);
  const labels = { open:'ເປີດຮັບ', soon:'ໄວໆນີ້', full:'ເຕັມ', closed:'ປິດ' };
  return `<span class="evt-badge ${s}">${labels[s]||s}</span>`;
}

function fmtDate(d){
  if(!d) return '';
  try{ return new Date(d).toLocaleDateString('lo-LA',{day:'numeric',month:'short',year:'numeric'}); }
  catch(_){ return d; }
}

function renderCard(e){
  const status = statusOf(e);
  const canReg = status === 'open';
  const img = e.imageUrl
    ? `<img src="${e.imageUrl}" alt="${e.name}" loading="lazy">`
    : `<svg viewBox="0 0 80 70" fill="none" stroke="currentColor" stroke-width="3" style="width:80px;height:80px;color:var(--grey-300)"><use href="#i-flag"/></svg>`;
  const spots = e.availableSpots ?? ((e.maxParticipants||0) - (e.registeredCount||0));
  const spotsText = e.maxParticipants
    ? `<span class="evt-spots">ທີ່ຫວ່າງ: ${Math.max(0,spots)} / ${e.maxParticipants}</span>` : '';
  const priceText = !e.fee || e.fee == 0
    ? `<span class="free">ຟຣີ</span>`
    : `<span>₭${Math.round((e.fee||0)*698).toLocaleString()}</span>`;

  const btnLabel = {open:'ສະໝັກເລີຍ', soon:'ໄວໆນີ້', full:'ເຕັມແລ້ວ', closed:'ປິດຮັບ'}[status]||'ສະໝັກ';
  const href = canReg ? `events-register.html?id=${encodeURIComponent(e.id)}` : '#';

  return `<div class="evt-card">
  <div class="evt-card-img">${img}${badgeFor(e)}</div>
  <div class="evt-card-body">
    <span class="evt-card-cat">${e.category||'Event'}</span>
    <div class="evt-card-name">${e.name}</div>
    <div class="evt-meta">
      <div class="evt-meta-row">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span>${fmtDate(e.eventDate||e.startDate)}</span>
      </div>
      ${e.location?`<div class="evt-meta-row"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span>${e.location}</span></div>`:''}
      ${e.distance?`<div class="evt-meta-row"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12h18M15 6l6 6-6 6"/></svg><span>${e.distance}</span></div>`:''}
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px">
      <div class="evt-price">${priceText}</div>${spotsText}
    </div>
  </div>
  <div class="evt-card-foot">
    <a class="evt-btn${canReg?'':' disabled'}" href="${href}">${btnLabel}</a>
  </div>
</div>`;
}

function renderGrid(events){
  const grid = document.getElementById('evtGrid');
  if(!events.length){
    grid.innerHTML = `<div class="evt-empty" style="grid-column:1/-1">
      <svg viewBox="0 0 80 70" fill="none" stroke="currentColor" stroke-width="2" style="display:block;margin:0 auto 16px"><use href="#i-flag"/></svg>
      <h3>ບໍ່ມີ Events ໃນຂະນະນີ້</h3>
      <p>ກວດໃໝ່ໄວໆ ຫຼື ຕິດຕາມ Facebook ຂອງເຮົາ</p>
    </div>`;
    return;
  }
  grid.innerHTML = events.map(renderCard).join('');
}

async function loadEvents(){
  try{
    const res = await evtGet({ action:'evt.getEvents', status:'published' });
    allEvents = Array.isArray(res) ? res : (res.data || res.events || []);
    filterEvents();
  }catch(err){
    document.getElementById('evtGrid').innerHTML = `<div class="evt-empty" style="grid-column:1/-1">
      <svg viewBox="0 0 80 70" fill="none" stroke="currentColor" stroke-width="2" style="display:block;margin:0 auto 16px"><use href="#i-flag"/></svg>
      <h3>ໂຫຼດ Events ບໍ່ໄດ້</h3>
      <p>ກວດ connection ແລ້ວລອງໃໝ່</p>
    </div>`;
  }
}

function filterEvents(){
  const filtered = activeCat
    ? allEvents.filter(e => (e.category||'').toLowerCase().includes(activeCat))
    : allEvents;
  renderGrid(filtered);
}

document.querySelectorAll('.evt-filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.evt-filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    filterEvents();
  });
});

const urlCat = new URLSearchParams(location.search).get('cat');
if(urlCat){
  activeCat = urlCat;
  document.querySelectorAll('.evt-filter-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.cat===urlCat);
  });
}

loadEvents();
</script>
<script src="Layout.js"></script>
