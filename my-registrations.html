<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ການສະໝັກຂອງຂ້ອຍ — Sevenday Bike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Sevenday.css">
<style>
.mr{max-width:820px;margin:0 auto;padding:28px 20px 80px}
.mr h1{font-size:clamp(26px,4vw,34px);font-weight:900;letter-spacing:-.5px}
.mr .lead{color:var(--grey-600);margin:4px 0 22px}
.mr h2{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--grey-600);margin:26px 0 10px}
.rl{display:flex;flex-direction:column;gap:10px}
.ri{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;border:1px solid var(--grey-300);padding:14px 16px;transition:border-color .15s}
.ri:hover{border-color:var(--black)}
.ri .bib{text-align:center;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.ri .bib small{display:block;font-size:10px!important;letter-spacing:.1em;color:var(--grey-600);font-weight:800}
.ri .bib.none{font-size:13px;color:var(--grey-600)}
.ri b{display:block;font-weight:800;line-height:1.3}
.ri span{font-size:13px;color:var(--grey-600)}
.ri .go{font-weight:700;font-size:14px;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;border:1.5px solid currentColor;margin-top:4px}
.pill.ok{color:#0F7A43}.pill.wait{color:#9A5B00}.pill.bad{color:#B3141A}.pill.mute{color:var(--grey-600)}
.ri.past{opacity:.7}
.mr-card{border:1px solid var(--grey-300);padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.mr-card h3{font-size:17px;font-weight:900;margin-bottom:6px}
.mr-card p{font-size:14px;color:var(--grey-600);margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.f label{font-size:14px;font-weight:700}
.f input{height:44px;border:1.5px solid var(--grey-300);border-radius:8px;padding:0 12px;font:inherit;font-size:16px;background:var(--white);color:var(--ink)}
.f input:focus{outline:none;border-color:var(--black)}
.mr-card .btn{height:44px;width:100%}
.msg{padding:10px 12px;border-left:4px solid #B3141A;background:#FDECEC;color:#8A1014;margin:8px 0;font-size:14px}
.empty{border:1px dashed var(--grey-300);padding:28px;text-align:center;color:var(--grey-600)}
.empty a{text-decoration:underline;color:var(--ink);font-weight:700}
.sk{background:var(--grey-100);height:76px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media(max-width:620px){
  .mr-card{grid-template-columns:1fr}
  .ri{grid-template-columns:56px minmax(0,1fr)}
  .ri .go{grid-column:2}
}
</style>
</head>
<body>

<main class="mr">
  <h1>ການສະໝັກຂອງຂ້ອຍ</h1>
  <p class="lead" id="lead">ງານທີ່ທ່ານສະໝັກ, ສະຖານະການຊຳລະ ແລະ QR ສຳລັບ Check-in</p>

  <section id="acct"></section>
  <section id="device"></section>

  <h2>ຊອກການສະໝັກ</h2>
  <div class="mr-card">
    <form id="findForm">
      <h3>ໃຊ້ເລກລົງທະບຽນ</h3>
      <p>ເລກລົງທະບຽນຢູ່ໃນອີເມວ ຫຼື ໜ້າຈໍຫຼັງສະໝັກ (ເຊັ່ນ SD-GR26-000001)</p>
      <div class="f"><label for="fn">ເລກລົງທະບຽນ</label><input id="fn" required autocomplete="off" autocapitalize="characters"></div>
      <div class="f"><label for="fp">ເບີໂທທີ່ໃຊ້ສະໝັກ</label><input id="fp" type="tel" inputmode="tel" required></div>
      <div id="findErr" class="msg" hidden role="alert"></div>
      <button class="btn btn-black" type="submit">ເປີດການສະໝັກ</button>
    </form>
    <div id="loginBox">
      <h3>ມີບັນຊີ Sevenday?</h3>
      <p>ເຂົ້າສູ່ລະບົບ ເພື່ອເຫັນທຸກການສະໝັກທີ່ເຮັດຕອນເຂົ້າສູ່ລະບົບຢູ່ — ທຸກອຸປະກອນ.</p>
      <a class="btn btn-line" href="login.html" style="border:2px solid var(--black)">ເຂົ້າສູ່ລະບົບ</a>
    </div>
  </div>
</main>

<script>
const EVT_API = 'https://script.google.com/macros/s/AKfycbyOcu6vlWUnvzRb4GTjEpxz5Amre1KhTYa7wU9PPjVlBd79B8XMzeJER_h-OLrHnxBboA/exec';
const EVT_KEY = 'SDdMc3wNjJEevs60n2oMQeGnuI';
async function evtPost(action, data){
  const r = await fetch(EVT_API, { method: 'POST', body: JSON.stringify({ action, secret: EVT_KEY, ...data }) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'API error'); return j.data;
}
const $ = id => document.getElementById(id);
const evtEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EVT_MONTHS = ['ມັງກອນ','ກຸມພາ','ມີນາ','ເມສາ','ພຶດສະພາ','ມິຖຸນາ','ກໍລະກົດ','ສິງຫາ','ກັນຍາ','ຕຸລາ','ພະຈິກ','ທັນວາ'];
const evtDate = ymd => { if (!ymd) return ''; const [y,m,d] = String(ymd).slice(0,10).split('-').map(Number); return `${d} ${EVT_MONTHS[m-1]} ${y}`; };
const link = t => 'events-registration.html?t=' + encodeURIComponent(t);
const today = new Date().toISOString().slice(0, 10);

function pill(r){
  if (String(r.reg_status).toUpperCase() === 'CANCELLED') return '<span class="pill mute">ຍົກເລີກ</span>';
  if (r.checkin_status === 'CHECKED_IN') return '<span class="pill ok">ເຂົ້າງານແລ້ວ</span>';
  return { PAID:'<span class="pill ok">ຊຳລະແລ້ວ</span>', PENDING_VERIFICATION:'<span class="pill wait">ລໍກວດສະລິບ</span>',
    REJECTED:'<span class="pill bad">ສະລິບບໍ່ຜ່ານ</span>' }[String(r.payment_status).toUpperCase()] || '<span class="pill bad">ຍັງບໍ່ຊຳລະ</span>';
}
function item(r){
  const past = r.event_date && r.event_date < today;
  return `<a class="ri ${past ? 'past' : ''}" href="${link(r.qr_token)}">
    <div class="bib ${r.bib_number ? '' : 'none'}">${r.bib_number ? `<small>BIB</small>${evtEsc(r.bib_number)}` : 'ລໍ BIB'}</div>
    <div><b>${evtEsc(r.event_name)}</b><span>${evtEsc(r.participant_name)} · ${evtEsc(r.category_name)} · ${evtEsc(evtDate(r.event_date))}</span><br>${pill(r)}</div>
    <span class="go">ເບິ່ງ QR →</span></a>`;
}

const user = (() => { try { return JSON.parse(sessionStorage.getItem('sd_user') || 'null'); } catch(_) { return null; } })();
let fromAccount = [];

async function loadAccount(){
  if (!user || !user.token) return;
  $('loginBox').hidden = true;
  $('lead').textContent = 'ສະບາຍດີ ' + (user.name || '') + ' — ງານທີ່ສະໝັກຜ່ານບັນຊີຂອງທ່ານ';
  $('acct').innerHTML = '<div class="rl"><div class="sk"></div><div class="sk"></div></div>';
  try {
    fromAccount = (await evtPost('evt.getMyEvents', { token: user.token })).registrations || [];
    fromAccount.sort((a, b) => (a.event_date < today) - (b.event_date < today) || String(a.event_date).localeCompare(String(b.event_date)));
    $('acct').innerHTML = fromAccount.length ? `<div class="rl">${fromAccount.map(item).join('')}</div>`
      : '<div class="empty">ຍັງບໍ່ມີການສະໝັກໃນບັນຊີນີ້ — <a href="events.html">ເບິ່ງງານທີ່ເປີດຮັບສະໝັກ</a></div>';
  } catch (err) {
    if (/SESSION_EXPIRED/.test(err.message)) {
      try { sessionStorage.removeItem('sd_user'); } catch(_) {}
      $('acct').innerHTML = '<div class="msg">ໝົດເວລາເຂົ້າສູ່ລະບົບ — <a href="login.html" style="text-decoration:underline">ເຂົ້າສູ່ລະບົບໃໝ່</a></div>';
      $('loginBox').hidden = false;
    } else $('acct').innerHTML = `<div class="msg">ໂຫຼດບໍ່ໄດ້: ${evtEsc(err.message)}</div>`;
  }
  renderDevice();
}

function renderDevice(){
  let list = [];
  try { list = JSON.parse(localStorage.getItem('sd_evt_regs') || '[]'); } catch(_) {}
  const known = new Set(fromAccount.map(r => r.qr_token));
  list = list.filter(x => x.t && !known.has(x.t));
  if (!list.length) {
    if (!user) $('device').innerHTML = '<div class="empty">ຍັງບໍ່ມີການສະໝັກໃນອຸປະກອນນີ້ — <a href="events.html">ເບິ່ງງານທີ່ເປີດຮັບສະໝັກ</a></div>';
    else $('device').innerHTML = '';
    return;
  }
  $('device').innerHTML = `<h2>ເປີດໃນອຸປະກອນນີ້</h2><div class="rl">${list.map(x => `
    <a class="ri" href="${link(x.t)}">
      <div class="bib none">${evtEsc(x.n.split('-').pop())}</div>
      <div><b>${evtEsc(x.e)}</b><span>${evtEsc(x.p)} · ${evtEsc(x.n)} · ${evtEsc(evtDate(x.d))}</span></div>
      <span class="go">ເບິ່ງ QR →</span></a>`).join('')}</div>`;
}

$('findForm').onsubmit = async e => {
  e.preventDefault();
  const b = e.target.querySelector('button'); b.disabled = true; $('findErr').hidden = true;
  try {
    const r = await evtPost('evt.findRegistration', { reg_number: $('fn').value.trim(), phone: $('fp').value.trim() });
    location.href = link(r.qr_token);
  } catch (err) { $('findErr').textContent = err.message; $('findErr').hidden = false; b.disabled = false; }
};

if (user && user.token) loadAccount(); else renderDevice();
</script>
<script src="i18n.js"></script>
<script src="layout.js"></script>
</body>
</html>
