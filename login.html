<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ເຂົ້າສູ່ລະບົບ — Sevenday Bike</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sevenday.css">
<style>
.crumbs{font-size:13px;color:var(--grey-600);padding:18px 0 6px}
.crumbs a:hover{text-decoration:underline}
.page-title{font-size:clamp(28px,3.4vw,44px);font-weight:900;letter-spacing:-1px;line-height:1.05}
.page-sub{color:var(--grey-600);margin:8px 0 0;max-width:62ch}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input,.field select,.field textarea{height:48px;border:1px solid var(--grey-300);padding:0 14px;font:inherit;background:#fff;border-radius:0}
.field textarea{height:96px;padding:12px 14px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#000;box-shadow:0 0 0 1px #000}
.field .err{font-size:13px;font-weight:600;display:none}
.field.invalid input,.field.invalid select{border-color:#000;border-width:2px}
.field.invalid .err{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--grey-300);padding:16px;cursor:pointer}
.choice:has(input:checked){border:2px solid #000;padding:15px}
.choice input{width:20px;height:20px;accent-color:#000;margin-top:2px}
.choice b{display:block}.choice small{color:var(--grey-600)}
.alert{background:var(--grey-100);border-left:4px solid #000;padding:14px 16px;font-size:14px}
@media (max-width:860px){.row2{grid-template-columns:1fr}}

.auth{display:grid;grid-template-columns:1fr 1fr;gap:56px;padding:40px 0 80px;align-items:start}
.panel h2{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-bottom:6px}
.panel>p{color:var(--grey-600);margin-bottom:22px}
.stack{display:flex;flex-direction:column;gap:14px}
.panel .btn{width:100%;height:52px;border-radius:0;margin-top:6px}
.side{background:#000;color:#fff;padding:36px}
.side h2{color:#fff}
.side ul{list-style:none;margin:20px 0 28px}
.side li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #333}
.side li::before{content:'✓';font-weight:900}
.msg{padding:12px 14px;font-size:14px;margin-bottom:14px;border-left:4px solid #000;background:var(--grey-100)}
.reg{display:none}.reg.on{display:block}
@media (max-width:860px){.auth{grid-template-columns:1fr;gap:28px}}

</style>
</head>
<body>

<main class="wrap">
  <div class="auth">
    <section class="panel" id="loginP">
      <h2>ເຂົ້າສູ່ລະບົບ</h2><p>ເບິ່ງປະຫວັດການສັ່ງຊື້, ການສ້ອມ ແລະ ແຕ້ມສະສົມ</p>
      <div class="msg" id="lMsg" hidden></div>
      <form class="stack" onsubmit="doLogin(event)">
        <div class="field"><label for="lEmail">ອີເມວ</label><input id="lEmail" type="email" autocomplete="email" required></div>
        <div class="field"><label for="lPass">ລະຫັດຜ່ານ</label><input id="lPass" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-black" id="lBtn">ເຂົ້າສູ່ລະບົບ</button>
      </form>
      <p style="font-size:14px;margin-top:14px">ລືມລະຫັດຜ່ານ? ຕິດຕໍ່ຮ້ານທາງ <a data-shop="whatsapp" style="text-decoration:underline;font-weight:700">WhatsApp</a></p>
    </section>
    <section class="panel side" id="regP">
      <div id="regIntro">
        <h2>ຍັງບໍ່ມີບັນຊີ?</h2>
        <ul><li>ສະສົມແຕ້ມທຸກການຊື້ ແລະ ການສ້ອມ</li><li>ຕິດຕາມສະຖານະຈັກຍານທີ່ສົ່ງສ້ອມ</li><li>ສັ່ງຊື້ໄວຂຶ້ນ ບໍ່ຕ້ອງໃສ່ຂໍ້ມູນຊ້ຳ</li></ul>
        <button class="btn btn-white" style="width:100%;border-radius:0" onclick="showReg()">ສ້າງບັນຊີໃໝ່</button>
      </div>
      <div class="reg" id="regForm">
        <h2>ສ້າງບັນຊີໃໝ່</h2><p style="color:#BDBDBD;margin-bottom:18px">ຖ້າເຄີຍຊື້ທີ່ຮ້ານ ໃຊ້ເບີໂທເກົ່າ ແຕ້ມຈະຖືກລວມໃຫ້</p>
        <div class="msg" id="rMsg" hidden style="color:#000"></div>
        <form class="stack" onsubmit="doReg(event)">
          <div class="field"><label for="rName">ຊື່ ແລະ ນາມສະກຸນ</label><input id="rName" autocomplete="name" required></div>
          <div class="field"><label for="rPhone">ເບີໂທ</label><input id="rPhone" type="tel" autocomplete="tel" placeholder="020XXXXXXXX" required></div>
          <div class="field"><label for="rEmail">ອີເມວ</label><input id="rEmail" type="email" autocomplete="email" required></div>
          <div class="field"><label for="rPass">ລະຫັດຜ່ານ (6 ໂຕຂຶ້ນໄປ)</label><input id="rPass" type="password" minlength="6" autocomplete="new-password" required></div>
          <button class="btn btn-white" style="border-radius:0;height:52px" id="rBtn">ສ້າງບັນຊີ</button>
        </form>
      </div>
    </section>
  </div>
</main>

<script src="layout.js"></script>
<script>

const $=id=>document.getElementById(id);
if(sessionStorage.getItem('sd_user')) location.replace('account.html');
function showReg(){ $('regIntro').hidden=true; $('regForm').classList.add('on'); $('rName').focus(); }
if(location.hash==='#register') showReg();
function say(id,t){ $(id).hidden=false; $(id).textContent=t; }
async function doLogin(e){
  e.preventDefault(); $('lMsg').hidden=true; const b=$('lBtn'); b.disabled=true; b.textContent='ກຳລັງກວດສອບ...';
  try{
    const r=await fetch(`${API_URL}?action=loginCustomer&secret=${API_SECRET}&email=${encodeURIComponent($('lEmail').value.trim())}&password=${encodeURIComponent($('lPass').value)}`);
    const j=await r.json(); const d=j.data||j;
    if(!d.ok) throw new Error(d.error==='ไม่พบบัญชีนี้'?'ບໍ່ພົບບັນຊີທີ່ໃຊ້ອີເມວນີ້':d.error==='รหัสผ่านไม่ถูกต้อง'?'ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ':(d.error||j.error||'ເຂົ້າສູ່ລະບົບບໍ່ສຳເລັດ'));
    sessionStorage.setItem('sd_user',JSON.stringify(d)); location.href='account.html';
  }catch(err){ say('lMsg',err.message); b.disabled=false; b.textContent='ເຂົ້າສູ່ລະບົບ'; }
}
async function doReg(e){
  e.preventDefault(); $('rMsg').hidden=true; const b=$('rBtn'); b.disabled=true; b.textContent='ກຳລັງສ້າງບັນຊີ...';
  try{
    const d=await apiPost('registerCustomer',{name:$('rName').value.trim(),phone:$('rPhone').value.trim(),email:$('rEmail').value.trim(),password:$('rPass').value});
    if(!d.ok) throw new Error(d.error==='Email นี้ถูกใช้แล้ว'?'ອີເມວນີ້ມີບັນຊີແລ້ວ — ລອງເຂົ້າສູ່ລະບົບ':d.error==='เบอร์โทรนี้ถูกใช้แล้ว'?'ເບີໂທນີ້ມີບັນຊີແລ້ວ':d.error);
    sessionStorage.setItem('sd_user',JSON.stringify(d)); location.href='account.html';
  }catch(err){ say('rMsg',err.message); b.disabled=false; b.textContent='ສ້າງບັນຊີ'; }
}

</script>
</body>
</html>
