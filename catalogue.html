<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ສິນຄ້າທັງໝົດ — Sevenday Bike</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sevenday.css">
<style>
.crumbs{font-size:13px;color:var(--grey-600);padding:18px 0 6px}
.crumbs a:hover{text-decoration:underline}
.page-title{font-size:clamp(28px,3.4vw,42px);font-weight:800;letter-spacing:-.01em;line-height:1.05}
.page-sub{color:var(--grey-600);margin:6px 0 20px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:16px;border-bottom:1px solid var(--grey-300)}
.chips button{border:1px solid var(--grey-300);border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;white-space:nowrap}
.chips button.on{background:var(--black);color:var(--white);border-color:var(--black)}
.layout{display:grid;grid-template-columns:260px 1fr;gap:32px;padding:24px 0 64px}
.filters{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 110px);overflow-y:auto}
.f-group{border-bottom:1px solid var(--grey-300)}
.f-group summary{font-weight:800;padding:14px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.f-group summary::after{content:'+'}.f-group[open] summary::after{content:'–'}
.f-body{padding-bottom:14px;display:flex;flex-direction:column;gap:8px}
.f-body label{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.f-body input[type=checkbox]{width:18px;height:18px;accent-color:#000}
.f-body .count{margin-left:auto;color:var(--grey-600);font-size:12px}
.range{display:flex;gap:8px}
.range input{width:100%;height:40px;border:1px solid var(--grey-300);padding:0 10px;font:inherit}
.f-clear{margin-top:16px;font-weight:700;text-decoration:underline;font-size:14px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.toolbar .n{font-weight:700}
.toolbar select{height:42px;border:1px solid var(--black);padding:0 12px;font:inherit;font-weight:600;background:#fff}
.filter-btn{display:none;height:42px;padding:0 18px;border:1px solid var(--black);font-weight:700}
.active-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.active-tags button{background:var(--grey-100);padding:6px 12px;font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 18px}
.empty{text-align:center;padding:64px 20px;border:1px dashed var(--grey-300)}
.empty b{display:block;font-size:20px;margin-bottom:8px}
.more{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:40px}
.more small{color:var(--grey-600)}
.bar{width:220px;height:3px;background:var(--grey-300)}.bar i{display:block;height:100%;background:#000}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .filters{position:fixed;inset:0;z-index:120;background:#fff;padding:0 20px 90px;max-height:none;display:none;top:0}
  .filters.open{display:block}
  .f-head{display:flex!important}
  .filter-btn{display:block}
  .grid{grid-template-columns:repeat(2,1fr);gap:22px 12px}
}
.f-head{display:none;justify-content:space-between;align-items:center;padding:16px 0;font-weight:800;font-size:18px;border-bottom:2px solid #000}
.f-apply{position:fixed;left:0;right:0;bottom:0;padding:12px 20px;background:#fff;border-top:1px solid var(--grey-300);display:none}
.filters.open .f-apply{display:block}
</style>
</head>
<body>
<main class="wrap">
  <nav class="crumbs" aria-label="breadcrumb"><a href="index.html">ໜ້າຫຼັກ</a> / <span id="crumbCat">ສິນຄ້າທັງໝົດ</span></nav>
  <h1 class="page-title" id="title">ສິນຄ້າທັງໝົດ</h1>
  <p class="page-sub">ສະຕັອກອັບເດດຕາມຮ້ານຈິງ</p>
  <div class="chips" id="chips"></div>

  <div class="layout">
    <aside class="filters" id="filters" aria-label="ຕົວກອງ">
      <div class="f-head">ຕົວກອງ<button onclick="openFilters(false)" aria-label="ປິດ">✕</button></div>
      <details class="f-group" open><summary>ໝວດໝູ່</summary><div class="f-body" id="fCat"></div></details>
      <details class="f-group" open><summary>ຍີ່ຫໍ້</summary><div class="f-body" id="fBrand"></div></details>
      <details class="f-group" open><summary>ລາຄາ (<span class="curLbl">₭</span>)</summary><div class="f-body">
        <div class="range"><input id="pMin" type="number" inputmode="numeric" placeholder="ຕໍ່າສຸດ"><input id="pMax" type="number" inputmode="numeric" placeholder="ສູງສຸດ"></div></div></details>
      <details class="f-group" open><summary>ສະຖານະສິນຄ້າ</summary><div class="f-body">
        <label><input type="checkbox" id="fInStock"> ມີສິນຄ້າພ້ອມຂາຍ</label>
        <label><input type="checkbox" id="fSale"> ລາຄາພິເສດ</label></div></details>
      <button class="f-clear" onclick="clearFilters()">ລ້າງຕົວກອງທັງໝົດ</button>
      <div class="f-apply"><button class="btn btn-black" style="width:100%" onclick="openFilters(false)">ເບິ່ງ <span id="applyN">0</span> ລາຍການ</button></div>
    </aside>

    <section>
      <div class="toolbar">
        <button class="filter-btn" onclick="openFilters(true)">ຕົວກອງ</button>
        <span class="n" id="count">ກຳລັງໂຫຼດ...</span>
        <label>ຮຽງຕາມ <select id="sort">
          <option value="rel">ແນະນຳ</option><option value="low">ລາຄາ ຕໍ່າ → ສູງ</option>
          <option value="high">ລາຄາ ສູງ → ຕໍ່າ</option><option value="name">ຊື່ A–Z</option><option value="stock">ສະຕັອກຫຼາຍສຸດ</option>
        </select></label>
      </div>
      <div class="active-tags" id="tags"></div>
      <div class="grid" id="grid"></div>
      <div class="more" id="more"></div>
    </section>
  </div>
</main>

<script src="layout.js"></script>
<script>
const PAGE = 24;
const params = new URLSearchParams(location.search);
const state = { cats:new Set(), brands:new Set(), min:null, max:null, inStock:false, sale:params.get('sale')==='1', q:params.get('q')||'', sort:'rel', shown:PAGE };
let ALL = [];

// แผนที่ ?cat= จากเมนู → คำค้นในหมวดหมู่ POS
const CAT_HINT = { bikes:'ຈັກ|จักร|bike', mtb:'mtb|mountain|ພູ|ภูเขา', road:'road|ຖະໜົນ|ถนน', kids:'kid|ເດັກ|เด็ก', ebike:'ไฟฟ้า|ໄຟຟ້າ|e-bike|ebike',
  parts:'ອາໄຫຼ່|อะไหล่|part', accessories:'ອຸປະກອນ|อุปกรณ์|acc', helmet:'helmet|ໝວກ|หมวก', lights:'light|ໄຟ|ไฟ', locks:'lock|ລັອກ|ล็อค',
  used:'used|ມືສອງ|มือสอง', tyre:'ຢາງ|ยาง|tyre|tire', brake:'ເບຣກ|เบรก|brake', chain:'ໂສ້|โซ่|chain', gear:'ເສື້ອ|เสื้อ|glove|ຖົງມື|ถุงมือ' };
const catParam = params.get('cat');

async function load(){
  document.getElementById('grid').innerHTML = Array.from({length:8},()=>`<article class="card skeleton"><div class="card-img"></div><span class="card-name">.</span><div class="price">.</div></article>`).join('');
  try{
    const r = await fetch(`${API_URL}?action=getProducts&secret=${API_SECRET}&limit=1000`);
    ALL = apiList(await r.json()).map(mapP).filter(p=>p.sku && !isService(p));
  }catch(e){ console.warn(e); }
  if(!ALL.length){ document.getElementById('grid').innerHTML=''; document.getElementById('count').textContent='ໂຫຼດສິນຄ້າບໍ່ໄດ້'; 
    document.getElementById('more').innerHTML='<div class="empty"><b>ເຊື່ອມຕໍ່ລະບົບສະຕັອກບໍ່ໄດ້</b>ກວດອິນເຕີເນັດ ແລ້ວ <a href="" style="text-decoration:underline">ໂຫຼດໜ້າໃໝ່</a></div>'; return; }
  window._catalog = ALL;
  if(catParam && CAT_HINT[catParam]){
    const re=new RegExp(CAT_HINT[catParam],'i');
    [...new Set(ALL.map(p=>p.category))].filter(c=>re.test(c)).forEach(c=>state.cats.add(c));
    const lbl = document.querySelector(`.nav a[href*="cat=${catParam}"]`)?.textContent || catParam;
    document.getElementById('title').textContent = lbl; document.getElementById('crumbCat').textContent = lbl;
  }
  if(state.q){ document.getElementById('title').textContent = `ຜົນຄົ້ນຫາ "${state.q}"`; document.getElementById('crumbCat').textContent='ຄົ້ນຫາ'; }
  if(state.sale){ document.getElementById('fSale').checked=true; document.getElementById('title').textContent='Sale'; }
  buildFacets(); render();
}

function countBy(key){ const m={}; ALL.forEach(p=>{ const k=p[key]||'ອື່ນໆ'; m[k]=(m[k]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function buildFacets(){
  const cats=countBy('category'), brands=countBy('brand').slice(0,15);
  document.getElementById('fCat').innerHTML = cats.map(([c,n])=>`<label><input type="checkbox" data-f="cats" value="${c}" ${state.cats.has(c)?'checked':''}> ${c}<span class="count">${n}</span></label>`).join('');
  document.getElementById('fBrand').innerHTML = brands.map(([b,n])=>`<label><input type="checkbox" data-f="brands" value="${b}"> ${b}<span class="count">${n}</span></label>`).join('');
  document.getElementById('chips').innerHTML = `<button class="${state.cats.size?'':'on'}" data-chip="">ທັງໝົດ</button>` + cats.slice(0,8).map(([c])=>`<button data-chip="${c}" class="${state.cats.size===1&&state.cats.has(c)?'on':''}">${c}</button>`).join('');
  document.querySelectorAll('[data-f]').forEach(i=>i.onchange=()=>{ state[i.dataset.f][i.checked?'add':'delete'](i.value); state.shown=PAGE; render(); });
  document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{ state.cats.clear(); if(b.dataset.chip) state.cats.add(b.dataset.chip); syncChecks(); state.shown=PAGE; render(); });
}
function syncChecks(){ document.querySelectorAll('[data-f]').forEach(i=>i.checked=state[i.dataset.f].has(i.value)); document.querySelectorAll('[data-chip]').forEach(b=>b.classList.toggle('on', b.dataset.chip? (state.cats.size===1&&state.cats.has(b.dataset.chip)) : !state.cats.size)); }
function toTHB(v){ if(v===''||v==null) return null; return currency==='THB'? +v : +v/THB_TO_LAK; }

function filtered(){
  const q=state.q.toLowerCase();
  let list = ALL.filter(p =>
    (!state.cats.size || state.cats.has(p.category)) &&
    (!state.brands.size || state.brands.has(p.brand)) &&
    (state.min==null || p.price>=state.min) && (state.max==null || p.price<=state.max) &&
    (!state.inStock || p.stock>0) && (!state.sale || (p.was && p.was>p.price)) &&
    (!q || (p.name+' '+p.sku+' '+p.category).toLowerCase().includes(q)));
  const s={low:(a,b)=>a.price-b.price, high:(a,b)=>b.price-a.price, name:(a,b)=>a.name.localeCompare(b.name), stock:(a,b)=>b.stock-a.stock,
    rel:(a,b)=>(b.stock>0)-(a.stock>0) || (!!b.image)-(!!a.image)}[state.sort];
  return list.sort(s);
}
function render(){
  const list=filtered(), shown=list.slice(0,state.shown);
  document.getElementById('count').textContent = `${list.length} ລາຍການ`;
  document.getElementById('applyN').textContent = list.length;
  document.querySelectorAll('.curLbl').forEach(e=>e.textContent=currency==='THB'?'฿':'₭');
  document.getElementById('grid').innerHTML = shown.length ? shown.map(card).join('')
    : `<div class="empty" style="grid-column:1/-1"><b>ບໍ່ພົບສິນຄ້າທີ່ກົງກັບຕົວກອງ</b>ລອງລຶບບາງຕົວກອງອອກ ຫຼື <button style="text-decoration:underline;font-weight:700" onclick="clearFilters()">ລ້າງຕົວກອງທັງໝົດ</button></div>`;
  const pct = list.length? Math.round(shown.length/list.length*100):0;
  document.getElementById('more').innerHTML = list.length>shown.length
    ? `<small>ສະແດງ ${shown.length} ຈາກ ${list.length} ລາຍການ</small><div class="bar"><i style="width:${pct}%"></i></div><button class="btn btn-black" onclick="state.shown+=${PAGE};render()">ໂຫຼດເພີ່ມ</button>` : '';
  const tags=[...state.cats].map(c=>['cats',c]).concat([...state.brands].map(b=>['brands',b]));
  if(state.q) tags.push(['q',state.q]);
  document.getElementById('tags').innerHTML = tags.map(([k,v])=>`<button onclick="removeTag('${k}','${v.replace(/'/g,"\\'")}')">${v} ✕</button>`).join('');
}
function removeTag(k,v){ if(k==='q'){ state.q=''; document.getElementById('q').value=''; } else state[k].delete(v); syncChecks(); render(); }
function clearFilters(){ state.cats.clear(); state.brands.clear(); state.min=state.max=null; state.inStock=state.sale=false; state.q='';
  ['pMin','pMax'].forEach(i=>document.getElementById(i).value=''); ['fInStock','fSale'].forEach(i=>document.getElementById(i).checked=false); syncChecks(); render(); }
function openFilters(o){ document.getElementById('filters').classList.toggle('open',o); document.body.style.overflow=o?'hidden':''; }

document.getElementById('sort').onchange=e=>{ state.sort=e.target.value; render(); };
document.getElementById('fInStock').onchange=e=>{ state.inStock=e.target.checked; render(); };
document.getElementById('fSale').onchange=e=>{ state.sale=e.target.checked; render(); };
['pMin','pMax'].forEach(id=>document.getElementById(id).oninput=()=>{ state.min=toTHB(document.getElementById('pMin').value); state.max=toTHB(document.getElementById('pMax').value); render(); });
document.addEventListener('currencychange', render);
load();
</script>
</body>
</html>
