<title>Sevenday — My Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- QR Code library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --black:#000;--ink:#1C1C1C;--g9:#2B2B2B;--g6:#6E6E6E;--g3:#D4D4D4;
  --g1:#F3F3F3;--white:#fff;--accent:#FF3B00;
  --font:'Archivo','Noto Sans Lao',system-ui,sans-serif;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --black:#fff;--ink:#ECECEC;--g9:#D0D0D0;--g6:#909090;--g3:#3A3A3A;
    --g1:#1E1E1E;--white:#111;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --black:#fff;--ink:#ECECEC;--g9:#D0D0D0;--g6:#909090;--g3:#3A3A3A;
  --g1:#1E1E1E;--white:#111;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--g1);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
img{max-width:100%}
:focus-visible{outline:2px solid var(--black);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--white);border:1.5px solid var(--g3);padding:9px 12px;width:100%;font-size:14px}
input:focus{outline:none;border-color:var(--black)}

/* ── Top nav ── */
.top{background:var(--black);color:var(--white);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .in{max-width:600px;margin:0 auto;padding:0 20px;height:58px;display:flex;align-items:center;gap:12px}
.top .mark{width:34px;height:34px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px;flex-shrink:0}
.top .title{font-size:15px;font-weight:800;color:var(--white);flex:1}
.top .btn-back{font-size:13px;font-weight:600;color:rgba(255,255,255,.65);flex-shrink:0}
.top .btn-back:hover{color:#fff}

/* ── Wrap ── */
.wrap{max-width:600px;margin:0 auto;padding:24px 20px 60px}

/* ── Lookup box ── */
.lookup{background:var(--white);border:1.5px solid var(--g3);padding:32px 28px;text-align:center}
.lookup h2{font-size:20px;font-weight:900;margin-bottom:8px}
.lookup p{font-size:14px;color:var(--g6);margin-bottom:24px}
.lookup-row{display:flex;gap:0;max-width:400px;margin:0 auto}
.lookup-row input{border-right:none;font-size:14px}
.lookup-row button{height:44px;padding:0 20px;background:var(--black);color:var(--white);font-weight:800;font-size:13px;border:1.5px solid var(--black);white-space:nowrap;flex-shrink:0}
.lookup-err{color:#c00;font-size:13px;margin-top:10px;font-weight:600;display:none}
.lookup-err.show{display:block}

/* ── Registration card ── */
.reg-card{background:var(--white);border:2px solid var(--black);overflow:hidden;margin-bottom:16px}
.reg-card-top{background:var(--black);color:var(--white);padding:20px 22px}
.reg-event-name{font-size:18px;font-weight:900;letter-spacing:-.2px;margin-bottom:4px}
.reg-event-meta{font-size:13px;opacity:.65;display:flex;gap:12px;flex-wrap:wrap}
.reg-card-body{padding:22px}

/* ── Status badge ── */
.status-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;font-size:13px;font-weight:800;letter-spacing:.3px;border:2px solid currentColor}
.status-badge.pending{color:#e65100;border-color:#e65100;background:rgba(230,81,0,.06)}
.status-badge.paid{color:#1b5e20;border-color:#1b5e20;background:rgba(27,94,32,.06)}
.status-badge.approved{color:#0055cc;border-color:#0055cc;background:rgba(0,85,204,.06)}
.status-badge.rejected{color:#c00;border-color:#c00;background:rgba(204,0,0,.06)}
.status-badge.cancelled{color:var(--g6);border-color:var(--g3)}
.status-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}

/* ── Info rows ── */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--g3)}
.info-cell{padding:12px 14px;border-bottom:1px solid var(--g3);border-right:1px solid var(--g3)}
.info-cell:nth-child(even){border-right:none}
.info-cell:nth-last-child(-n+2){border-bottom:none}
@media(max-width:420px){.info-grid{grid-template-columns:1fr}.info-cell{border-right:none}.info-cell:nth-last-child(-n+2){border-bottom:1px solid var(--g3)}.info-cell:last-child{border-bottom:none}}
.info-label{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--g6);margin-bottom:3px}
.info-val{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.info-val.big{font-size:22px;font-weight:900;letter-spacing:-0.5px}
.info-val.accent{color:var(--accent)}

/* ── Participants table ── */
.pts-title{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--g6);margin:20px 0 10px}
.pts-table{width:100%;border-collapse:collapse;font-size:13px}
.pts-table th{text-align:left;padding:7px 10px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--g6);border-bottom:2px solid var(--g3)}
.pts-table td{padding:9px 10px;border-bottom:1px solid var(--g3);vertical-align:middle}
.pts-table tr:last-child td{border-bottom:none}
.bib-badge{display:inline-block;background:var(--black);color:var(--white);font-weight:900;font-size:15px;padding:2px 10px;letter-spacing:1px;font-variant-numeric:tabular-nums;min-width:48px;text-align:center}
.bib-pending{display:inline-block;background:var(--g3);color:var(--g6);font-size:12px;font-weight:700;padding:2px 8px}

/* ── QR section ── */
.qr-section{margin-top:24px;padding-top:20px;border-top:1.5px solid var(--g3)}
.qr-title{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--g6);margin-bottom:16px;text-align:center}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:0}
.qr-box{background:#fff;border:2px solid var(--black);padding:16px;display:inline-block}
/* force QR canvas/img to be white bg always */
.qr-box canvas,.qr-box img{display:block}
.qr-label{margin-top:12px;text-align:center}
.qr-reg-id{font-size:13px;font-weight:800;letter-spacing:1.5px;font-variant-numeric:tabular-nums;color:var(--ink)}
.qr-hint{font-size:11px;color:var(--g6);margin-top:4px}
.qr-locked{padding:24px;background:var(--g1);border:1.5px dashed var(--g3);text-align:center;color:var(--g6);font-size:13px;font-weight:600}

/* ── Payment status block ── */
.pay-block{margin-top:20px;padding:16px;border:1.5px solid var(--g3)}
.pay-block-title{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--g6);margin-bottom:12px}
.pay-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--g3)}
.pay-row:last-child{border-bottom:none;font-weight:800;font-size:15px}
.pay-row .val{font-variant-numeric:tabular-nums}

/* ── Timeline ── */
.timeline{margin-top:20px}
.tl-title{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--g6);margin-bottom:14px}
.tl-item{display:flex;gap:12px;margin-bottom:0}
.tl-left{display:flex;flex-direction:column;align-items:center;gap:0}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--g3);border:2px solid var(--g3);flex-shrink:0;margin-top:3px}
.tl-dot.done{background:var(--black);border-color:var(--black)}
.tl-dot.active{background:var(--accent);border-color:var(--accent)}
.tl-line{width:2px;flex:1;background:var(--g3);min-height:24px}
.tl-line.done{background:var(--black)}
.tl-item:last-child .tl-line{display:none}
.tl-body{padding-bottom:20px;min-width:0}
.tl-label{font-size:13px;font-weight:700;margin-bottom:1px}
.tl-date{font-size:11px;color:var(--g6)}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 18px;font-weight:700;font-size:13px;border:2px solid var(--black);background:var(--white);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--black);color:var(--white)}
.btn.sm{height:34px;padding:0 12px;font-size:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--g3)}

/* ── Spinner / loading ── */
.spin{display:inline-block;width:20px;height:20px;border:2.5px solid var(--g3);border-top-color:var(--black);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-state{padding:60px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--g6);font-weight:600}

/* ── Copy button ── */
.copy-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--g6);cursor:pointer;border:1px solid var(--g3);padding:2px 8px;background:var(--white)}
.copy-btn:hover{color:var(--ink);border-color:var(--g9)}
.copy-btn.copied{color:#1a7d3a;border-color:#1a7d3a}

/* ── Notice ── */
.notice{padding:14px 16px;border-left:3px solid var(--accent);background:rgba(255,59,0,.05);font-size:13px;margin-bottom:16px}
.notice strong{font-weight:800;color:var(--accent)}
</style>

<!-- Top nav -->
<nav class="top">
  <div class="in">
    <div class="mark">S</div>
    <div class="title">ข้อมูลการสมัคร</div>
    <a href="events.html" class="btn-back">← Events</a>
  </div>
</nav>

<div class="wrap">

  <!-- Lookup form (shown when no reg_id in URL) -->
  <div id="lookupBox" class="lookup" hidden>
    <h2>ค้นหาการสมัครของคุณ</h2>
    <p>กรอก Registration ID ที่ได้รับทางอีเมลหลังสมัคร</p>
    <div class="lookup-row">
      <input id="lookupInput" type="text" placeholder="REG-XXXXXXXX" autocomplete="off"
             onkeydown="if(event.key==='Enter')doLookup()">
      <button onclick="doLookup()">ค้นหา</button>
    </div>
    <div class="lookup-err" id="lookupErr">ไม่พบ Registration ID นี้</div>
  </div>

  <!-- Loading state -->
  <div id="loadingState" class="loading-state" hidden>
    <div class="spin"></div>
    <div>กำลังโหลดข้อมูลการสมัคร...</div>
  </div>

  <!-- Registration content -->
  <div id="regContent" hidden></div>

</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyOcu6vlWUnvzRb4GTjEpxz5Amre1KhTYa7wU9PPjVlBd79B8XMzeJER_h-OLrHnxBboA/exec';
const API_SECRET = 'SDdMc3wNjJEevs60n2oMQeGnuI';

let regData = null;

// ── Init ──
(function(){
  const params = new URLSearchParams(location.search);
  const regId = params.get('reg_id');
  if (regId) {
    loadRegistration(regId);
  } else {
    document.getElementById('lookupBox').hidden = false;
    document.getElementById('lookupInput').focus();
  }
})();

function doLookup(){
  const val = document.getElementById('lookupInput').value.trim();
  if (!val) return;
  document.getElementById('lookupErr').classList.remove('show');
  loadRegistration(val);
}

async function loadRegistration(regId){
  document.getElementById('lookupBox').hidden = true;
  document.getElementById('loadingState').hidden = false;
  document.getElementById('regContent').hidden = true;
  try {
    const res = await get({ action:'evt.getRegistration', registration_id: regId });
    document.getElementById('loadingState').hidden = true;
    if (res.error || !res.registration) {
      document.getElementById('lookupBox').hidden = false;
      document.getElementById('lookupErr').textContent = res.error || 'ไม่พบ Registration ID นี้';
      document.getElementById('lookupErr').classList.add('show');
      return;
    }
    regData = res;
    renderRegistration(res);
  } catch(e) {
    document.getElementById('loadingState').hidden = true;
    document.getElementById('lookupBox').hidden = false;
    document.getElementById('lookupErr').textContent = 'เชื่อมต่อ API ล้มเหลว';
    document.getElementById('lookupErr').classList.add('show');
  }
}

// ── Main render ──
function renderRegistration(data){
  const reg   = data.registration;
  const event = data.event || {};
  const items = data.items || [];        // [{category_name, bib_number, ...}]
  const pts   = data.participants || []; // [{first_name, last_name, bib_number, qr_token, ...}]
  const pay   = data.payment || {};

  const content = document.getElementById('regContent');
  content.hidden = false;

  // Status
  const statusMap = {
    pending:   { label:'รอตรวจสอบการชำระ', cls:'pending' },
    paid:      { label:'ชำระเงินแล้ว', cls:'paid' },
    approved:  { label:'อนุมัติแล้ว ✓', cls:'approved' },
    rejected:  { label:'ถูกปฏิเสธ', cls:'rejected' },
    cancelled: { label:'ยกเลิก', cls:'cancelled' },
  };
  const st = statusMap[reg.status] || { label: reg.status, cls:'pending' };

  // Notice for pending
  const pendingNotice = reg.status === 'pending'
    ? `<div class="notice"><strong>รอตรวจสอบ</strong> — ทีมงานจะยืนยันการชำระเงินและส่ง BIB ให้ภายใน 1–2 วันทำการ</div>`
    : reg.status === 'rejected'
    ? `<div class="notice" style="border-color:#c00;background:rgba(204,0,0,.05)"><strong>ถูกปฏิเสธ</strong> — กรุณาติดต่อ ${esc(event.contact_email||event.contact_phone||'ทีมงาน')} เพื่อสอบถาม</div>`
    : '';

  // Participants rows
  const ptRows = pts.map((p, i) => {
    const bib = p.bib_number
      ? `<span class="bib-badge">#${p.bib_number}</span>`
      : `<span class="bib-pending">รอ BIB</span>`;
    const item = items[i] || {};
    return `<tr>
      <td><strong>${esc(p.first_name)} ${esc(p.last_name)}</strong></td>
      <td>${esc(item.category_name||'—')}</td>
      <td>${bib}</td>
      <td>${p.shirt_size||'—'}</td>
    </tr>`;
  }).join('');

  // QR codes — one per participant, shown only if approved
  const qrSection = renderQrSection(pts, reg, event);

  // Payment block
  const payBlock = `
    <div class="pay-block">
      <div class="pay-block-title">สรุปการชำระเงิน</div>
      ${items.map(it => `<div class="pay-row"><span>${esc(it.category_name||'—')} × ${it.quantity||1}</span><span class="val">${fmtNum(it.subtotal||it.price)} LAK</span></div>`).join('')}
      <div class="pay-row"><span>รวมทั้งหมด</span><span class="val">${fmtNum(pay.amount||reg.total_amount)} LAK</span></div>
    </div>`;

  // Timeline
  const tlSteps = [
    { label:'ส่งใบสมัคร', date: reg.created_at, done: true },
    { label:'ชำระเงิน / อัปโหลดสลิป', date: pay.submitted_at||reg.created_at, done: !!pay.amount },
    { label:'ทีมงานตรวจสอบ', date: pay.verified_at||null, done: reg.status==='approved'||reg.status==='paid' },
    { label:'อนุมัติ + ออก BIB', date: reg.approved_at||null, done: reg.status==='approved' },
  ];
  const tlHtml = tlSteps.map((s, i) => {
    const dotCls = s.done ? (i===tlSteps.filter(x=>x.done).length-1?'active':'done') : '';
    const lineDone = i < tlSteps.filter(x=>x.done).length-1 ? 'done' : '';
    return `<div class="tl-item">
      <div class="tl-left">
        <div class="tl-dot ${dotCls}"></div>
        <div class="tl-line ${lineDone}"></div>
      </div>
      <div class="tl-body">
        <div class="tl-label" style="${!s.done?'color:var(--g6)':''}">${s.label}</div>
        <div class="tl-date">${s.date?fmtDatetime(s.date):'—'}</div>
      </div>
    </div>`;
  }).join('');

  content.innerHTML = `
    ${pendingNotice}
    <div class="reg-card">
      <div class="reg-card-top">
        <div class="reg-event-name">${esc(event.event_name||'—')}</div>
        <div class="reg-event-meta">
          <span>📅 ${fmtDate(event.event_date)}</span>
          ${event.location?`<span>📍 ${esc(event.location)}</span>`:''}
        </div>
      </div>
      <div class="reg-card-body">
        <div class="status-row">
          <div class="status-badge ${st.cls}"><div class="status-dot"></div>${st.label}</div>
          <div style="flex:1"></div>
          <button class="copy-btn" id="copyRegBtn" onclick="copyRegId('${esc(reg.registration_id)}')">
            📋 ${esc(reg.registration_id)}
          </button>
        </div>

        <div class="info-grid">
          <div class="info-cell">
            <div class="info-label">Registration ID</div>
            <div class="info-val" style="font-size:13px;letter-spacing:.5px">${esc(reg.registration_id)}</div>
          </div>
          <div class="info-cell">
            <div class="info-label">วันที่สมัคร</div>
            <div class="info-val">${fmtDatetime(reg.created_at)}</div>
          </div>
          <div class="info-cell">
            <div class="info-label">จำนวนผู้สมัคร</div>
            <div class="info-val big">${pts.length||1}</div>
          </div>
          <div class="info-cell">
            <div class="info-label">ยอดชำระ</div>
            <div class="info-val big accent">${fmtNum(pay.amount||reg.total_amount)}<span style="font-size:12px;font-weight:600;color:var(--g6)"> LAK</span></div>
          </div>
          <div class="info-cell">
            <div class="info-label">ผู้ติดต่อ</div>
            <div class="info-val" style="font-size:13px">${esc(reg.contact_email||'—')}</div>
          </div>
          <div class="info-cell">
            <div class="info-label">เบอร์โทร</div>
            <div class="info-val" style="font-size:13px">${esc(reg.contact_phone||'—')}</div>
          </div>
        </div>

        <div class="pts-title">รายชื่อผู้สมัคร</div>
        <div style="overflow-x:auto">
          <table class="pts-table">
            <thead>
              <tr>
                <th>ชื่อ-นามสกุล</th>
                <th>ประเภท</th>
                <th>BIB</th>
                <th>เสื้อ</th>
              </tr>
            </thead>
            <tbody>${ptRows||'<tr><td colspan="4" style="text-align:center;color:var(--g6);padding:16px">—</td></tr>'}</tbody>
          </table>
        </div>

        ${qrSection}
        ${payBlock}

        <div class="timeline" style="margin-top:24px">
          <div class="tl-title">ขั้นตอนการดำเนินการ</div>
          ${tlHtml}
        </div>

        <div class="actions">
          <a href="events.html" class="btn">← ดู Events อื่น</a>
          ${reg.status==='approved'?`<button class="btn primary" onclick="window.print()">🖨 พิมพ์บัตร</button>`:''}
          <button class="btn sm" onclick="location.reload()" style="margin-left:auto;border-color:var(--g3);color:var(--g6)">🔄 รีเฟรช</button>
        </div>
      </div>
    </div>`;

  // Generate QR codes after DOM is ready
  if (reg.status === 'approved') {
    pts.forEach((p, i) => {
      if (p.qr_token) {
        try {
          new QRCode(document.getElementById('qr_'+i), {
            text: p.qr_token,
            width: 200, height: 200,
            colorDark: '#000000', colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
          });
        } catch(e){}
      }
    });
  }
}

function renderQrSection(pts, reg, event){
  if (reg.status !== 'approved') {
    return `<div class="qr-section">
      <div class="qr-title">QR Code สำหรับ Check-in</div>
      <div class="qr-locked">🔒 QR Code จะแสดงเมื่อการสมัครได้รับการอนุมัติแล้ว</div>
    </div>`;
  }
  const cards = pts.map((p, i) => `
    <div style="text-align:center;padding:16px 0;${i>0?'border-top:1px solid var(--g3)':''}">
      <div style="font-size:12px;font-weight:700;color:var(--g6);margin-bottom:12px;letter-spacing:.3px">${esc(p.first_name)} ${esc(p.last_name)}</div>
      <div class="qr-wrap">
        <div class="qr-box" id="qr_${i}"></div>
        <div class="qr-label">
          ${p.bib_number?`<div style="font-size:28px;font-weight:900;letter-spacing:2px;margin-top:10px">#${p.bib_number}</div>`:''}
          <div class="qr-hint">แสดง QR Code นี้ที่จุด Check-in วันงาน</div>
        </div>
      </div>
    </div>`).join('');

  return `<div class="qr-section">
    <div class="qr-title">QR Code สำหรับ Check-in</div>
    ${cards}
  </div>`;
}

// ── Copy reg ID ──
function copyRegId(id){
  const btn = document.getElementById('copyRegBtn');
  try {
    navigator.clipboard.writeText(id).then(() => {
      btn.classList.add('copied');
      btn.innerHTML = '✓ คัดลอกแล้ว';
      setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '📋 '+id; }, 2000);
    }).catch(() => selectText(btn));
  } catch(e){ selectText(btn); }
}
function selectText(el){ const r=document.createRange(); r.selectNode(el); window.getSelection().removeAllRanges(); window.getSelection().addRange(r); }

// ── Format ──
function fmtNum(n){ return Number(n||0).toLocaleString('th-TH'); }
function fmtDate(v){
  if(!v) return '—';
  try { return new Date(v).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric',weekday:'short'}); }
  catch(e){ return v; }
}
function fmtDatetime(v){
  if(!v) return '—';
  try { return new Date(v).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return v; }
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── API ──
async function hmacSign(body){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(API_SECRET),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const sig=await crypto.subtle.sign('HMAC',key,enc.encode(body));
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function get(params){
  const qs=Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  const sig=await hmacSign(qs);
  const res=await fetch(API_URL+'?'+qs+'&sig='+sig);
  const text=await res.text();
  try{ return JSON.parse(text); }catch(e){ throw new Error(text.slice(0,200)); }
}
