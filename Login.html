<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ເຂົ້າສູ່ລະບົບ — Sevenday Bike</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#D42B2B;--dark:#1A1A2A;--lime:#5C8A00;
  --card:#242438;--border:#333355;--text:#E8E8F0;--muted:#9090B0;
}
body{background:var(--dark);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column}
/* NAV */
nav{background:#111122;border-bottom:2px solid var(--red);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;color:#fff;text-decoration:none}
.nav-logo span{color:var(--red)}
.nav-back{color:var(--muted);text-decoration:none;font-size:14px;display:flex;align-items:center;gap:6px}
.nav-back:hover{color:#fff}
/* MAIN */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:100%;max-width:420px}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;margin-bottom:8px}
.card-sub{color:var(--muted);font-size:14px;margin-bottom:32px}
/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:28px}
.tab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:.2s}
.tab.active{color:var(--red);border-bottom-color:var(--red)}
/* FORM */
.form-group{margin-bottom:18px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
input{width:100%;background:#1A1A2A;border:1px solid var(--border);border-radius:8px;padding:12px 16px;color:var(--text);font-size:15px;transition:.2s;outline:none}
input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(212,43,43,.15)}
.btn{width:100%;padding:14px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;transition:.2s;margin-top:8px}
.btn:hover{background:#b82424}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error{background:rgba(212,43,43,.15);border:1px solid var(--red);border-radius:8px;padding:12px 16px;font-size:14px;color:#ff8080;margin-bottom:16px;display:none}
.success{background:rgba(92,138,0,.15);border:1px solid var(--lime);border-radius:8px;padding:12px 16px;font-size:14px;color:#90c040;margin-bottom:16px;display:none}
.panel{display:none}
.panel.active{display:block}
footer{text-align:center;padding:20px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">SEVEN<span>DAY</span></a>
  <a href="index.html" class="nav-back">← ກັບໜ້າຫຼັກ</a>
</nav>

<main>
  <div class="card">
    <div class="card-title">👤 ສະມາຊິກ</div>
    <div class="card-sub">ເຂົ້າສູ່ລະບົບ ຫຼື ສະໝັກສະມາຊິກໃໝ່</div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">ເຂົ້າສູ່ລະບົບ</div>
      <div class="tab" onclick="switchTab('register')">ສະໝັກສະມາຊິກ</div>
    </div>

    <!-- LOGIN -->
    <div class="panel active" id="panel-login">
      <div class="error" id="login-error"></div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>ລະຫັດຜ່ານ</label>
        <input type="password" id="login-pass" placeholder="••••••••">
      </div>
      <button class="btn" id="login-btn" onclick="doLogin()">ເຂົ້າສູ່ລະບົບ</button>
    </div>

    <!-- REGISTER -->
    <div class="panel" id="panel-register">
      <div class="error"   id="reg-error"></div>
      <div class="success" id="reg-success"></div>
      <div class="form-group">
        <label>ຊື່ - ນາມສະກຸນ</label>
        <input type="text" id="reg-name" placeholder="ຊື່ຂອງທ່ານ">
      </div>
      <div class="form-group">
        <label>ເບີໂທ</label>
        <input type="tel" id="reg-phone" placeholder="020XXXXXXXX">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>ລະຫັດຜ່ານ</label>
        <input type="password" id="reg-pass" placeholder="ຢ່າງໜ້ອຍ 6 ຕົວອັກສອນ">
      </div>
      <button class="btn" id="reg-btn" onclick="doRegister()">ສ້າງບັນຊີ</button>
    </div>
  </div>
</main>
<footer>© 2024 Sevenday Bike — ວຽງຈັນທ໌, ລາວ</footer>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyOcu6vlWUnvzRb4GTjEpxz5Amre1KhTYa7wU9PPjVlBd79B8XMzeJER_h-OLrHnxBboA/exec';
const SEC = 'open';

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('panel-login').classList.toggle('active', tab==='login');
  document.getElementById('panel-register').classList.toggle('active', tab==='register');
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value.trim();
  const err   = document.getElementById('login-error');
  const btn   = document.getElementById('login-btn');
  err.style.display='none';
  if (!email||!pass){err.textContent='ກະລຸນາໃສ່ Email ແລະ ລະຫັດຜ່ານ';err.style.display='block';return;}
  btn.disabled=true; btn.textContent='ກຳລັງເຂົ້າສູ່ລະບົບ...';
  try {
    const res  = await fetch(`${API}?action=loginCustomer&secret=${SEC}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(pass)}`);
    const json = await res.json();
    if (!json.ok || !json.data?.ok) {
      err.textContent = json.data?.error || 'ເຂົ້າສູ່ລະບົບບໍ່ສຳເລັດ';
      err.style.display='block';
    } else {
      sessionStorage.setItem('sd_user', JSON.stringify(json.data));
      window.location.href = 'account.html';
    }
  } catch(e) {
    err.textContent='ເກີດຂໍ້ຜິດພາດ ກະລຸນາລອງໃໝ່';
    err.style.display='block';
  } finally { btn.disabled=false; btn.textContent='ເຂົ້າສູ່ລະບົບ'; }
}

async function doRegister() {
  const name  = document.getElementById('reg-name').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass  = document.getElementById('reg-pass').value.trim();
  const err   = document.getElementById('reg-error');
  const suc   = document.getElementById('reg-success');
  const btn   = document.getElementById('reg-btn');
  err.style.display='none'; suc.style.display='none';
  if (!name||!phone||!email||!pass){err.textContent='ກະລຸນາໃສ່ຂໍ້ມູນໃຫ້ຄົບ';err.style.display='block';return;}
  if (pass.length<6){err.textContent='ລະຫັດຜ່ານຕ້ອງຢ່າງໜ້ອຍ 6 ຕົວ';err.style.display='block';return;}
  btn.disabled=true; btn.textContent='ກຳລັງສ້າງບັນຊີ...';
  try {
    const res  = await fetch(API, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'registerCustomer', secret:SEC, name, phone, email, password:pass })
    });
    const json = await res.json();
    if (!json.ok || !json.data?.ok) {
      err.textContent = json.data?.error || 'ສ້າງບັນຊີບໍ່ສຳເລັດ';
      err.style.display='block';
    } else {
      sessionStorage.setItem('sd_user', JSON.stringify(json.data));
      suc.textContent='ສ້າງບັນຊີສຳເລັດ! ກຳລັງໄປໜ້າສະມາຊິກ...';
      suc.style.display='block';
      setTimeout(()=>{ window.location.href='account.html'; }, 1200);
    }
  } catch(e) {
    err.textContent='ເກີດຂໍ້ຜິດພາດ ກະລຸນາລອງໃໝ່';
    err.style.display='block';
  } finally { btn.disabled=false; btn.textContent='ສ້າງບັນຊີ'; }
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key==='Enter') {
    const loginActive = document.getElementById('panel-login').classList.contains('active');
    loginActive ? doLogin() : doRegister();
  }
});
// Redirect if already logged in
if (sessionStorage.getItem('sd_user')) window.location.href='account.html';
</script>
</body>
</html>
