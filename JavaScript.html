            ['THB', 'LAK', 'USD'].map(c => '<option value="' + c + '"' + (c === data.currency ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></div>' +
          '<div style="flex:1;" id="aipo-rate-wrap"><label class="small-label">อัตรา (1 บาท = ?)</label><input type="number" id="aipo-rate" value="' + curRate(data.currency) + '" step="0.0001" style="margin:0 0 6px;"></div>' +
        '</div>' +
        '<div id="aipo-items"></div>' +
        '<div style="font-size:13px; font-weight:600; margin:8px 0;">ยอดรวม: <span id="aipo-total">0.00</span> <span id="aipo-total-unit">' + data.currency + '</span></div>' +
        '<label class="small-label">วันที่คาดว่าจะได้รับ</label>' +
        '<input type="date" id="aipo-date" value="' + aiEsc(data.expectedDate) + '" style="margin:0 0 6px;">' +
        '<label class="small-label">หมายเหตุ</label>' +
        '<input type="text" id="aipo-note" value="' + aiEsc(data.note) + '" style="margin:0 0 8px;">' +
        '<button id="aipo-confirm" class="btn-primary" disabled>✅ ยืนยันสร้างใบสั่งซื้อ</button>' +
        '<button id="aipo-cancel" style="margin-top:6px;">❌ ยกเลิก</button>' +
      '</div>';

    const syncCurrencyUI = () => {
      const cur = document.getElementById('aipo-currency').value;
      document.getElementById('aipo-rate-wrap').style.display = cur === 'THB' ? 'none' : 'block';
      document.getElementById('aipo-total-unit').textContent = cur;
    };
    syncCurrencyUI();
    aiItemsRender('aipo');

    document.getElementById('aipo-currency').addEventListener('change', () => {
      const cur = document.getElementById('aipo-currency').value;
      aiItemState['aipo'].rate = curRate(cur);
      document.getElementById('aipo-rate').value = aiItemState['aipo'].rate;
      syncCurrencyUI();
      aiItemsRender('aipo');
    });
    document.getElementById('aipo-rate').addEventListener('change', () => {
      aiItemState['aipo'].rate = Number(document.getElementById('aipo-rate').value) || 1;
      aiItemsRender('aipo');
    });

    document.getElementById('aipo-cancel').addEventListener('click', () => { resultBox.innerHTML = ''; document.getElementById('ai-agent-input').value = ''; });
    document.getElementById('aipo-confirm').addEventListener('click', () => {
      const supplierId = document.getElementById('aipo-supplier').value;
      if (!supplierId) { showToast('กรุณาเลือกซัพพลายเออร์'); return; }
      const valid = aiItemsGetValid('aipo');
      if (valid.length === 0) { showToast('ไม่มีรายการสินค้าในใบสั่งซื้อ'); return; }
      const currency = document.getElementById('aipo-currency').value;
      const rate = currency === 'THB' ? 1 : (Number(document.getElementById('aipo-rate').value) || 0);
      if (currency !== 'THB' && rate <= 0) { showToast('กรุณากรอกอัตราแลกเปลี่ยนให้ถูกต้อง'); return; }
      const items = valid.map(v => ({ sku: v.sku, name: v.name, qty: v.qty, unitCost: v.price }));
      aiSetBusy('aipo-confirm', true);
      google.script.run
        .withSuccessHandler(res => {
          showToast(res.message || (res.success ? 'สร้างใบสั่งซื้อเรียบร้อย' : 'เกิดข้อผิดพลาด'));
          if (res.success) {
            aiResetCard(resultBox, '✅ ' + (res.message || 'สร้างใบสั่งซื้อเรียบร้อย'));
            try { loadPurchasePage(); } catch (e) {}
          } else { aiSetBusy('aipo-confirm', false); aiItemsUpdateTotal('aipo'); }
        })
        .withFailureHandler(err => { aiSetBusy('aipo-confirm', false); aiItemsUpdateTotal('aipo'); onServerError(err); })
        .createPurchaseOrder(items, supplierId, currency, rate, document.getElementById('aipo-date').value,
          document.getElementById('aipo-note').value.trim(), currentStaffId || '', currentStaffName || 'พนักงาน');
    });
  }

  // ---------- สร้างใบสั่งจองสินค้า (Booking) — 1 ใบต่อ 1 สินค้า + มัดจำ (ถ้ามี) ----------
  function renderAIAgentBookingCard(data, confidence) {
    const resultBox = document.getElementById('ai-agent-result');
    const cands = data.candidates || [];
    const prodOpts = cands.map((c, i) => '<option value="' + i + '">' + aiEsc(c.name) + ' (ราคา ' + formatMoney(c.price) + ')</option>').join('');
    const prodBlock = cands.length
      ? '<select id="aibk-product" style="margin:0 0 4px; width:100%;">' + prodOpts + '</select>' +
        (cands.length > 1 ? '<div style="font-size:11px; color:#e65100; margin-bottom:4px;">พบ ' + cands.length + ' รายการที่ใกล้เคียง — เลือกให้ตรงตัวที่ต้องการ</div>' : '')
      : '<div style="color:#c62828; font-size:12px; margin-bottom:4px;">⚠️ ไม่พบสินค้าที่ตรงกับ "' + aiEsc(data.productHint) + '" — กรุณาเพิ่มสินค้านี้ในระบบก่อน (หน้า Inventory) แล้วสั่งใหม่</div>';
    const methods = ['เงินสด', 'โอนเงิน', 'บัตรเครดิต'];
    resultBox.innerHTML =
      '<div style="border:1px solid var(--outline-variant); border-radius:10px; padding:10px;">' +
        '<b style="font-size:13px;">📌 ตรวจสอบข้อมูลก่อนสร้างใบสั่งจอง</b>' + aiConfidenceWarningHtml(confidence) +
        '<label class="small-label" style="margin-top:8px;">ชื่อลูกค้า *</label>' +
        '<input type="text" id="aibk-cus-name" value="' + aiEsc(data.customerName) + '" style="margin:0 0 6px;">' +
        '<label class="small-label">เบอร์โทร *</label>' +
        '<input type="text" id="aibk-cus-phone" value="' + aiEsc(data.customerPhone) + '" style="margin:0 0 6px;">' +
        '<label class="small-label">สินค้าที่จอง *</label>' + prodBlock +
        '<label class="small-label">รายละเอียด/สี/ไซซ์</label>' +
        '<input type="text" id="aibk-detail" value="' + aiEsc(data.modelDetail) + '" style="margin:0 0 6px;">' +
        '<div style="display:flex; gap:6px;">' +
          '<div style="flex:1;"><label class="small-label">จำนวน</label><input type="number" id="aibk-qty" value="' + data.qty + '" min="1" step="1" style="margin:0 0 6px;"></div>' +
          '<div style="flex:1;"><label class="small-label">ราคา/หน่วย</label><input type="number" id="aibk-price" value="' + (data.unitPrice || (cands[0] ? cands[0].price : 0)) + '" min="0" step="0.01" style="margin:0 0 6px;"></div>' +
        '</div>' +
        '<div style="display:flex; gap:6px;">' +
          '<div style="flex:1;"><label class="small-label">ส่วนลด (บาท)</label><input type="number" id="aibk-discount" value="' + data.discount + '" min="0" style="margin:0 0 6px;"></div>' +
          '<div style="flex:1;"><label class="small-label">ของแถม</label><input type="text" id="aibk-gift" value="' + aiEsc(data.freeGift) + '" style="margin:0 0 6px;"></div>' +
        '</div>' +
        '<div style="font-size:13px; font-weight:600; margin:4px 0 8px;">ยอดสุทธิ: <span id="aibk-net">0.00</span> บาท</div>' +
        '<label class="small-label">วันที่คาดว่าสินค้าจะเข้า</label>' +
        '<input type="date" id="aibk-date" value="' + aiEsc(data.expectedArrivalDate) + '" style="margin:0 0 6px;">' +
        '<label class="small-label">หมายเหตุ</label>' +
        '<input type="text" id="aibk-note" value="' + aiEsc(data.note) + '" style="margin:0 0 6px;">' +
        '<label class="small-label">รับมัดจำวันนี้ (บาท, ถ้ามี — สกุลบาทเท่านั้น)</label>' +
        '<div style="display:flex; gap:6px;">' +
          '<input type="number" id="aibk-deposit" value="' + (data.depositAmount || 0) + '" min="0" style="flex:1; margin:0 0 8px;">' +
          '<select id="aibk-deposit-method" style="flex:1; margin:0 0 8px;">' + methods.map(m => '<option value="' + m + '"' + (m === data.depositMethod ? ' selected' : '') + '>' + m + '</option>').join('') + '</select>' +
        '</div>' +
        '<button id="aibk-confirm" class="btn-primary"' + (cands.length ? '' : ' disabled') + '>✅ ยืนยันสร้างใบสั่งจอง</button>' +
        '<button id="aibk-cancel" style="margin-top:6px;">❌ ยกเลิก</button>' +
      '</div>';

    const selectedCand = () => cands[Number((document.getElementById('aibk-product') || {}).value || 0)];
    const calcNet = () => Math.max(0, aiRound2(Number(document.getElementById('aibk-qty').value || 0) * Number(document.getElementById('aibk-price').value || 0) - Number(document.getElementById('aibk-discount').value || 0)));
    const updateNet = () => { document.getElementById('aibk-net').textContent = formatMoney(calcNet()); };
    ['aibk-qty', 'aibk-price', 'aibk-discount'].forEach(id => document.getElementById(id).addEventListener('input', updateNet));
    const prodSel = document.getElementById('aibk-product');
    if (prodSel) prodSel.addEventListener('change', () => { document.getElementById('aibk-price').value = selectedCand().price; updateNet(); });
    updateNet();

    document.getElementById('aibk-cancel').addEventListener('click', () => { resultBox.innerHTML = ''; document.getElementById('ai-agent-input').value = ''; });
    document.getElementById('aibk-confirm').addEventListener('click', () => {
      const name = document.getElementById('aibk-cus-name').value.trim();
      const phone = document.getElementById('aibk-cus-phone').value.trim();
      if (!name || !phone) { showToast('ใบสั่งจองต้องมีชื่อและเบอร์โทรลูกค้า'); return; }
      const cand = selectedCand();
      if (!cand) { showToast('กรุณาเลือกสินค้าที่จอง'); return; }
      const qty = Number(document.getElementById('aibk-qty').value) || 0;
      const unitPrice = Number(document.getElementById('aibk-price').value) || 0;
      if (qty <= 0) { showToast('กรุณากรอกจำนวนให้ถูกต้อง'); return; }
      const net = calcNet();
      const deposit = Number(document.getElementById('aibk-deposit').value) || 0;
      if (deposit > net + 0.01) { showToast('มัดจำมากกว่ายอดสุทธิ (' + formatMoney(net) + ' บาท)'); return; }
      const method = document.getElementById('aibk-deposit-method').value;
      aiSetBusy('aibk-confirm', true);
      aiResolveCustomer(name, phone, (customer, failed) => {
        if (failed || !customer) {
          aiSetBusy('aibk-confirm', false); document.getElementById('aibk-confirm').disabled = false;
          if (!failed) showToast('ไม่สามารถหา/สร้างลูกค้าได้ กรุณาตรวจสอบชื่อ+เบอร์โทร');
          return;
        }
        const bookingData = {
          customerId: customer.id, sku: cand.sku, productName: cand.name,
          modelDetail: document.getElementById('aibk-detail').value.trim(), qty: qty, unitPrice: unitPrice,
          discount: Number(document.getElementById('aibk-discount').value) || 0,
          freeGift: document.getElementById('aibk-gift').value.trim(),
          expectedArrivalDate: document.getElementById('aibk-date').value, note: document.getElementById('aibk-note').value.trim()
        };
        const unlock = () => { aiSetBusy('aibk-confirm', false); document.getElementById('aibk-confirm').disabled = false; };
        google.script.run
          .withSuccessHandler(res => {
            if (!res.success) { showToast(res.message || 'เกิดข้อผิดพลาด'); unlock(); return; }
            const finish = msg => { showToast(msg); aiResetCard(resultBox, '✅ ' + msg); try { loadBookingPage(); } catch (e) {} };
            if (deposit <= 0) { finish(res.message); return; }
            google.script.run
              .withSuccessHandler(dep => {
                if (dep.success) finish(res.message + ' และรับมัดจำ ' + formatMoney(deposit) + ' บาทแล้ว');
                else { showToast('สร้างใบสั่งจองแล้ว (' + res.bookingId + ') แต่บันทึกมัดจำไม่สำเร็จ: ' + dep.message); resultBox.innerHTML = '<p style="font-size:13px; color:#e65100;">⚠️ สร้างใบสั่งจอง ' + res.bookingId + ' แล้ว แต่บันทึกมัดจำไม่สำเร็จ — ไปบันทึกมัดจำที่หน้า Sale > Booking ด้วยตนเอง<br>' + aiEsc(dep.message) + '</p>'; try { loadBookingPage(); } catch (e) {} }
              })
              .withFailureHandler(err => { showToast('สร้างใบสั่งจอง ' + res.bookingId + ' แล้ว แต่บันทึกมัดจำไม่สำเร็จ กรุณาบันทึกที่หน้า Booking'); onServerError(err); })
              .recordBookingDeposit(res.bookingId, [{ method: method, currency: 'THB', amount: deposit, exchangeRate: 1 }], currentStaffName || 'พนักงาน');
          })
          .withFailureHandler(err => { unlock(); onServerError(err); })
          .createBooking(bookingData, currentStaffId || '', currentStaffName || 'พนักงาน');
      });
    });
  }


  // ================================================================

  // ================================================================
  function aiRenderTemplates() {
    const box = document.getElementById('ai-templates');
    if (!box) return;
    const TPL = {

  function aiUsageStats() {
    const today = new Date().toISOString().slice(0, 10);
    let st = { date: today, rules: 0, ai: 0 };
    try { const s = JSON.parse(localStorage.getItem('sevenday_ai_stats') || 'null'); if (s && s.date === today) st = s; } catch (e) {}
    return st;
  }
  function aiUsageShow() {
    const el = document.getElementById('ai-usage-note');
    if (!el) return;
    const st = aiUsageStats();
    el.textContent = 'วันนี้ (เครื่องนี้): ใช้ทางลัด ' + st.rules + ' ครั้ง (ไม่เสียโควตา) • เรียก AI ' + st.ai + ' ครั้ง';
  }
  function aiPostRenderNote(res) {
    if (!res || !res.success || !res.via) return;
    const st = aiUsageStats();
    if (res.via === 'rules') st.rules++; else st.ai++;
    try { localStorage.setItem('sevenday_ai_stats', JSON.stringify(st)); } catch (e) {}
    aiUsageShow();
    const box = document.getElementById('ai-agent-result');
    if (box && box.firstElementChild) {
      box.insertAdjacentHTML('afterbegin', res.via === 'rules'
        ? '<div style="font-size:11px; color:green; margin-bottom:4px;">⚡ ตีความด้วยทางลัด (ไม่ใช้โควตา AI) — ตรวจสอบก่อนยืนยัน</div>'
        : '<div style="font-size:11px; color:var(--on-surface-variant); margin-bottom:4px;">🤖 ตีความด้วย AI — ตรวจสอบก่อนยืนยัน</div>');
    }
  }

  const uiNodeStore = new WeakMap();   // ข้อความไทยต้นฉบับของ text node ที่ถูกแปล (ไว้กดกลับไทย)

  const uiQueue = new Set();

  function uiInit() {

  function uiMissingPhrases() { return UI_SEED.filter(p => !UI_DICT[p]); }

    const batches = [];

    let bi = 0, added = 0, failed = 0, attempt = 0;
    btn.disabled = true;
    const stop = msg => { btn.disabled = false; box.style.color = '#c62828'; box.textContent = msg; uiTranslateTree(document.body); };
    const next = () => {

      google.script.run
        .withSuccessHandler(res => {

  function rqRun(fn, arg, after) {

  let RQS = null, rqPick = { d: '', p: '' };

  }));
  // ประเภทงาน → ชั่วโมงช่าง → วันพร้อมรับรถ
  let RQSVC = null;
  function rqSvcRow(n, h) { return `<div class="sv"><input type="text" data-k="n" value="${rqEsc(n)}" placeholder="ชื่อประเภทงาน"><input type="number" data-k="h" min="0.25" max="200" step="0.25" value="${h}"><button type="button" class="rq-btn sm" data-del-sv>✕</button></div>`; }

  document.getElementById('rqs-svc').addEventListener('click', e => { if (e.target.closest('[data-del-sv]')) e.target.closest('.sv').remove(); });
  function rqLoadSvc() {
    const fill = S => {
      const sel = document.getElementById('nr-svc'), cur = sel.value;
      sel.innerHTML = `<option value="">${rqT('ไม่ระบุ')} (${rqH(S.default_hours)} ${rqT('ชม.')})</option>` + Object.keys(S.svc_hours).map(n => `<option value="${rqEsc(n)}">${rqEsc(n)} · ${rqH(S.svc_hours[n])} ${rqT('ชม.')}</option>`).join('');
      if (cur) sel.value = cur;
      if (rqNewMode() === 'now') rqEstimate();
    };
    google.script.run.withSuccessHandler(S => { if (S && S.success) { RQSVC = S; fill(S); } }).withFailureHandler(() => {}).getRepairQueueServices();
  }
  function rqEstimate() {

    google.script.run.withSuccessHandler(e => {
      if (!e || !e.success || !e.ready) { box.textContent = ''; return; }
      box.className = 'rq-est' + (e.ok ? '' : ' warn');
      box.textContent = `⏱ ${rqH(e.hours)} ${rqT('ชม.')} · ${rqT('ถ้ารับตอนนี้ พร้อมรับรถประมาณ')} ${rqReady(e.ready)}${e.ok ? '' : ' — ' + rqT('ช่างงานเต็ม อาจช้ากว่าปกติ')}`;
    }).withFailureHandler(() => { box.textContent = ''; }).estimateRepair(sv);

    var mn = parse(el.getAttribute('min')), mx = parse(el.getAttribute('max')), v = ymd(t.y, t.m, t.d);
    if (mx && v > ymd(mx.y, mx.m, mx.d)) return mx;
    if (mn && v < ymd(mn.y, mn.m, mn.d)) return mn;
    return t;
  }
  function place() {
    if (!pop || !cur) return;
    var r = cur.proxy.getBoundingClientRect(), h = pop.offsetHeight, w = pop.offsetWidth;
    var top = r.bottom + 6; if (top + h > window.innerHeight - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
    var left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
    pop.style.top = Math.max(8, top) + 'px'; pop.style.left = left + 'px';
  }
  function draw() {
    var el = cur.el, y = cur.y, m = cur.m, v = parse(VALUE.get.call(el)), t = todayParts();
    var mn = el.getAttribute('min'), mx = el.getAttribute('max'); mn = mn ? mn.slice(0, 10) : ''; mx = mx ? mx.slice(0, 10) : '';
    var y0 = Math.min(t.y - 100, y - 5, mn ? +mn.slice(0, 4) : 9999), y1 = Math.max(t.y + 10, y + 5, mx ? +mx.slice(0, 4) : 0);
    if (mn) y0 = Math.max(y0, +mn.slice(0, 4)); if (mx) y1 = Math.min(y1, +mx.slice(0, 4));
    var years = ''; for (var yy = y1; yy >= y0; yy--) years += '<option value="' + yy + '"' + (yy === y ? ' selected' : '') + '>' + yy + '</option>';
    var h = '<div class="sdp-hd"><button type="button" class="sdp-nav" data-nav="-1" aria-label="Previous month">‹</button>' +
      '<select data-sel="m" aria-label="Month">' + MONTHS.map(function (n, i) { return '<option value="' + i + '"' + (i === m ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select>' +
      '<select data-sel="y" aria-label="Year">' + years + '</select>' +
      '<button type="button" class="sdp-nav" data-nav="1" aria-label="Next month">›</button></div><div class="sdp-g">' + HEAD.map(function (d) { return '<span>' + d + '</span>'; }).join('');
    var first = (dowOf(y, m, 1) + 6) % 7, start = new Date(Date.UTC(y, m, 1 - first));
    for (var i = 0; i < 42; i++) {
      var d = new Date(start.getTime() + i * 864e5), dy = d.getUTCFullYear(), dm = d.getUTCMonth(), dd = d.getUTCDate(), key = ymd(dy, dm, dd);
      var cls = (dm !== m ? 'o ' : '') + (dy === t.y && dm === t.m && dd === t.d ? 't ' : '') + (v && v.y === dy && v.m === dm && v.d === dd ? 's' : '');
      var off = (mn && key < mn) || (mx && key > mx);
      h += '<button type="button" data-day="' + key + '" class="' + cls + '"' + (off ? ' disabled' : '') + ' aria-label="' + DOW[d.getUTCDay()] + ' ' + dd + ' ' + MONTHS[dm] + ' ' + dy + '">' + dd + '</button>';
    }
    h += '</div><div class="sdp-ft">' + (cur.kind === 'datetime-local' ? timeSel(cur.time) : '') +
      '<button type="button" class="sdp-b" data-act="today">Today</button><span class="sp"></span>' +
      (el.required ? '' : '<button type="button" class="sdp-b" data-act="clear">Clear</button>') +
      (cur.kind === 'datetime-local' ? '<button type="button" class="sdp-b k" data-act="ok">OK</button>' : '') + '</div>';
    pop.innerHTML = h;
  }
  // ເວລາແບບ 24 ຊົ່ວໂມງ (ບໍ່ຂຶ້ນກັບພາສາຂອງເຄື່ອງ)
  function timeSel(t) {
    var p = String(t || '09:00').split(':'), hh = +p[0] || 0, mm = +p[1] || 0, o = '<span class="sdp-tm" data-time-box><select data-hh aria-label="Hour">';
    for (var i = 0; i < 24; i++) o += '<option' + (i === hh ? ' selected' : '') + '>' + pad(i) + '</option>';
    o += '</select>:<select data-mm aria-label="Minute">';
    for (var j = 0; j < 60; j += 5) o += '<option' + (j === mm ? ' selected' : '') + '>' + pad(j) + '</option>';

  function timeVal() { var h = pop && pop.querySelector('[data-hh]'), m = pop && pop.querySelector('[data-mm]'); return h && m ? h.value + ':' + m.value : ''; }
  function pick(key) {

    if (cur.kind === 'datetime-local') { cur.time = timeVal() || cur.time || '09:00'; setVal(el, key + 'T' + cur.time); draw(); return; }
    setVal(el, key); close(); el._sdpProxy.focus();
  }
  function onClick(e) {
    var b = e.target.closest('button'); if (!b || !cur) return;
    if (b.dataset.nav) { cur.m += +b.dataset.nav; if (cur.m < 0) { cur.m = 11; cur.y--; } if (cur.m > 11) { cur.m = 0; cur.y++; } draw(); return; }
    if (b.dataset.day) { pick(b.dataset.day); return; }
    var a = b.dataset.act, t = todayParts();
    if (a === 'today') { cur.y = t.y; cur.m = t.m; pick(ymd(t.y, t.m, t.d)); return; }
    if (a === 'clear') { setVal(cur.el, ''); close(); return; }
    if (a === 'ok') { var p = parse(VALUE.get.call(cur.el)); if (p) setVal(cur.el, ymd(p.y, p.m, p.d) + 'T' + (timeVal() || p.t || '09:00')); close(); }
  }
  function onChange(e) {
    var s = e.target;
    if (s.dataset.sel === 'm') { cur.m = +s.value; draw(); }
    else if (s.dataset.sel === 'y') { cur.y = +s.value; draw(); }
    else if (s.hasAttribute('data-hh') || s.hasAttribute('data-mm')) { cur.time = timeVal(); var p = parse(VALUE.get.call(cur.el)); if (p) setVal(cur.el, ymd(p.y, p.m, p.d) + 'T' + cur.time); }
  }

  function enhance(el) {
    if (el._sdpKind || el.hasAttribute('data-native-date')) return;
    var kind = el.type; if (kind !== 'date' && kind !== 'datetime-local') return;
    addCss();
    var proxy = document.createElement('input');
    proxy.type = 'text'; proxy.readOnly = true; proxy.className = (el.className ? el.className + ' ' : '') + 'sdp-field';
    if (el.getAttribute('style')) proxy.setAttribute('style', el.getAttribute('style'));
    proxy.placeholder = el.getAttribute('data-placeholder') || (kind === 'date' ? 'Select date' : 'Select date & time');
    proxy.setAttribute('aria-haspopup', 'dialog'); proxy.setAttribute('translate', 'no'); proxy.setAttribute('data-no-tr', '');
    if (el.getAttribute('aria-label')) proxy.setAttribute('aria-label', el.getAttribute('aria-label'));
    if (el.id) proxy.id = el.id + '__sdp';
    el._sdpKind = kind; el._sdpProxy = proxy;
    el.type = 'hidden';
    el.parentNode.insertBefore(proxy, el.nextSibling);
    if (el.id) document.querySelectorAll('label[for="' + el.id + '"]').forEach(function (l) { l.htmlFor = proxy.id; });
    el._sdpRender = function () { proxy.value = label(VALUE.get.call(el), kind); proxy.disabled = el.disabled; };
    Object.defineProperty(el, 'value', { configurable: true, get: function () { return VALUE.get.call(el); }, set: function (v) { VALUE.set.call(el, v == null ? '' : v); el._sdpRender(); } });
    proxy.addEventListener('click', function () { open(el); });
    proxy.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); open(el); }
      else if (e.key === 'Escape') close();
      else if ((e.key === 'Backspace' || e.key === 'Delete') && !el.required) { e.preventDefault(); setVal(el, ''); }
    });
    el._sdpRender();
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches('input[type=date],input[type=datetime-local]')) enhance(root);
    root.querySelectorAll('input[type=date],input[type=datetime-local]').forEach(enhance);
  }
  document.addEventListener('mousedown', function (e) { if (pop && !pop.contains(e.target) && (!cur || e.target !== cur.proxy)) close(); }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && pop) close(); });
  window.addEventListener('resize', place); window.addEventListener('scroll', function (e) { if (pop && !pop.contains(e.target)) place(); }, true);
  function start() {
    scan(document.body);
    new MutationObserver(function (ms) { ms.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); }); })
      .observe(document.body, { childList: true, subtree: true });
  }
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
  window.SDDatePicker = { enhance: enhance, scan: scan, label: label, close: close };
})();
