  function bookingStatusColor(status) {
    const map = {
      'ยืนยันแล้ว': '#9e9e9e', 'ชำระมัดจำแล้ว': '#3f51b5', 'สั่งซื้อแล้ว': '#ff9800',
      'ซัพพลายเออร์ยืนยันแล้ว': '#ff9800', 'อยู่ระหว่างขนส่ง': '#ff9800', 'สินค้ามาถึง': '#7b1fa2',
      'พร้อมส่งมอบลูกค้า': '#7b1fa2', 'ออกใบแจ้งหนี้แล้ว': '#e53935', 'ชำระบางส่วน': '#e53935',
      'ชำระครบแล้ว': '#43a047', 'เสร็จสมบูรณ์': '#43a047', 'ยกเลิก': '#757575'
    };
    return map[status] || '#9e9e9e';
  }

  // ลำดับสถานะที่เปลี่ยนด้วยมือได้ (ต้องตรงกับ BOOKING_MANUAL_STATUS_FLOW ฝั่ง Backend)
  const BOOKING_MANUAL_FLOW = ['ยืนยันแล้ว', 'ชำระมัดจำแล้ว', 'สั่งซื้อแล้ว', 'ซัพพลายเออร์ยืนยันแล้ว', 'อยู่ระหว่างขนส่ง', 'สินค้ามาถึง', 'พร้อมส่งมอบลูกค้า'];

  let currentBookingId = null;
  let currentBookingDetail = null;

  function openBookingDetail(bookingId) {
    currentBookingId = bookingId;
    google.script.run
      .withSuccessHandler(detail => {
        if (!detail) { showToast('ไม่พบ Booking นี้'); return; }
        currentBookingDetail = detail;
        const b = detail.booking;

        document.getElementById('bkd-title').textContent = 'Booking: ' + b.bookingId;
        document.getElementById('bkd-summary-cards').innerHTML = `
          <div class="card"><div class="card-label">ยอดสุทธิ</div><div class="card-value">${formatMoney(b.netPrice)}</div></div>
          <div class="card"><div class="card-label">ชำระแล้ว</div><div class="card-value">${formatMoney(b.paidTHB)}</div></div>
          <div class="card"><div class="card-label">คงเหลือ</div><div class="card-value warn">${formatMoney(b.balanceTHB)}</div></div>
          <div class="card"><div class="card-label">สถานะ</div><div class="card-value" style="font-size:15px;">${b.status}</div></div>`;

        document.getElementById('bkd-info').innerHTML = `
          <b>ลูกค้า:</b> ${b.customerName} (${b.customerPhone || '-'})<br>
          <b>สินค้า:</b> ${b.productName} (SKU: ${b.sku})${b.modelDetail ? ' | ' + b.modelDetail : ''} | จำนวน: ${b.qty}<br>
          <b>ราคา:</b> ${formatMoney(b.unitPrice)} x ${b.qty} - ส่วนลด ${formatMoney(b.discount)} = สุทธิ ${formatMoney(b.netPrice)} บาท
          ${b.freeGift ? '<br><b>ของแถม:</b> ' + b.freeGift : ''}<br>
          <b>วันที่คาดว่าสินค้าจะเข้า:</b> ${b.expectedArrivalDate || '-'} | <b>หมายเหตุ:</b> ${b.note || '-'}<br>
          ${b.invoiceId ? '<b>เลขที่ Invoice:</b> ' + b.invoiceId + ' (ออกเมื่อ ' + b.invoiceDate + ')<br>' : ''}
          ${b.deliveredDate ? '<b>ส่งมอบเมื่อ:</b> ' + b.deliveredDate + ' โดย ' + b.deliveredBy + (b.serialNumber ? ' | Serial: ' + b.serialNumber : '') + '<br>' : ''}
          <b>พนักงาน:</b> ${b.staffName} | <b>สร้างเมื่อ:</b> ${b.createdDate}`;

        // ปุ่มการทำงานตามสถานะปัจจุบัน (กันกดผิดขั้นตอน)
        const actionBox = document.getElementById('bkd-action-row');
        actionBox.innerHTML = '';
        const isCancelled = b.status === 'ยกเลิก';
        const isCompleted = b.status === 'เสร็จสมบูรณ์';

        if (!isCancelled && !isCompleted) {
          // ปุ่มรับมัดจำ (แสดงตอนยังไม่ออก Invoice และยังมียอดคงเหลือ)
          if (!b.invoiceId && b.balanceTHB > 0.01) {
            actionBox.innerHTML += `<button onclick="openBookingPaymentModal('มัดจำ')">💰 รับมัดจำ</button>`;
          }
          // ปุ่มเลื่อนสถานะถัดไปตามลำดับ (เฉพาะช่วงก่อนออก Invoice)
          const curIdx = BOOKING_MANUAL_FLOW.indexOf(b.status);
          if (curIdx !== -1 && curIdx < BOOKING_MANUAL_FLOW.length - 1) {
            const nextStatus = BOOKING_MANUAL_FLOW[curIdx + 1];
            actionBox.innerHTML += `<button onclick="advanceBookingStatus('${nextStatus}')">➡️ ${nextStatus}</button>`;
          }
          // ปุ่มออก Invoice (เมื่อสินค้ามาถึงหรือพร้อมส่งมอบแล้ว และยังไม่เคยออก)
          if (!b.invoiceId && (b.status === 'สินค้ามาถึง' || b.status === 'พร้อมส่งมอบลูกค้า')) {
            actionBox.innerHTML += `<button onclick="createInvoiceForBooking()">📄 ออก Invoice</button>`;
          }
          // ปุ่มรับชำระยอดคงเหลือ (หลังออก Invoice แล้ว และยังมียอดค้าง)
          if (b.invoiceId && b.balanceTHB > 0.01) {
            actionBox.innerHTML += `<button onclick="openBookingPaymentModal('ชำระยอดคงเหลือ')">💳 รับชำระยอดคงเหลือ</button>`;
          }
          // ปุ่มส่งมอบสินค้า (ชำระครบแล้วเท่านั้น)
          if (b.status === 'ชำระครบแล้ว') {
            actionBox.innerHTML += `<button onclick="openBookingDeliverModal()">📦 ส่งมอบสินค้า</button>`;
          }
          // ปุ่มยกเลิก (ยกเลิกได้เฉพาะยังไม่มีการชำระเงิน)
          if (b.paidTHB <= 0) {
            actionBox.innerHTML += `<button onclick="cancelCurrentBooking()">✕ ยกเลิก Booking</button>`;
          }
        }
        // ปุ่มพิมพ์เอกสาร (พิมพ์ได้ทุกสถานะที่ไม่ใช่ยกเลิก)
        if (!isCancelled) {
          actionBox.innerHTML += `<button onclick="printBookingDoc('booking')">🖨️ พิมพ์ Booking</button>`;
          if (b.invoiceId) actionBox.innerHTML += `<button onclick="printBookingDoc('invoice')">🖨️ พิมพ์ Invoice</button>`;
          if (detail.payments.length > 0) actionBox.innerHTML += `<button onclick="printBookingDoc('receipt')">🖨️ พิมพ์ใบเสร็จรับเงิน</button>`;
        }

        const timelineEl = document.getElementById('bkd-timeline');
        timelineEl.innerHTML = '';
        detail.timeline.forEach(t => {
          const div = document.createElement('div');
          div.className = 'timeline-item';
          div.innerHTML = `<div class="ti-event">${t.status}</div><div class="ti-meta">${t.date} — ${t.by}${t.note ? ' — ' + t.note : ''}</div>`;
          timelineEl.appendChild(div);
        });

        const payBody = document.querySelector('#bkd-payments-table tbody');
        payBody.innerHTML = '';
        if (detail.payments.length === 0) {
          payBody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--on-surface-variant);">ยังไม่มีการชำระเงิน</td></tr>';
        } else {
          detail.payments.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${p.date}</td><td>${p.type}</td><td>${p.method}</td><td>${formatMoney(p.amount)} ${p.currency}</td><td>${formatMoney(p.amountTHB)}</td><td>${p.receivedBy}</td>`;
            payBody.appendChild(tr);
          });
        }

        document.getElementById('modal-booking-detail').classList.add('active');
      })
      .withFailureHandler(onServerError)
      .getBookingDetail(bookingId);
  }

  // ---------- รับชำระเงิน (ใช้ร่วมกันมัดจำ/ยอดคงเหลือ) ----------
  let bkpPayments = [];
  let bkpPaymentType = 'มัดจำ';

  function openBookingPaymentModal(paymentType) {
    bkpPaymentType = paymentType;

  function renderBkpPaymentRows() {
    const box = document.getElementById('bkp-payment-rows');
    box.innerHTML = '';
    bkpPayments.forEach((p, idx) => {
      const row = document.createElement('div');
      row.className = 'pay-row';
      row.innerHTML = `
        <select onchange="bkpPayments[${idx}].method = this.value">
          <option value="เงินสด" ${p.method === 'เงินสด' ? 'selected' : ''}>เงินสด</option>
          <option value="โอนเงิน" ${p.method === 'โอนเงิน' ? 'selected' : ''}>โอนเงิน</option>
          <option value="บัตรเครดิต" ${p.method === 'บัตรเครดิต' ? 'selected' : ''}>บัตรเครดิต</option>
        </select>
        <select onchange="bkpPayments[${idx}].currency = this.value; renderBkpPaymentRows();">
          <option value="THB" ${p.currency === 'THB' ? 'selected' : ''}>THB</option>
          <option value="LAK" ${p.currency === 'LAK' ? 'selected' : ''}>LAK</option>
          <option value="USD" ${p.currency === 'USD' ? 'selected' : ''}>USD</option>
          <option value="CNY" ${p.currency === 'CNY' ? 'selected' : ''}>CNY</option>
        </select>
        <input type="number" class="pay-amount-input" value="${p.amount}" min="0" step="0.01"
          oninput="bkpPayments[${idx}].amount = this.value; updateBkpSummary();">
        <button type="button" class="pay-remove-btn" onclick="bkpPayments.splice(${idx},1); renderBkpPaymentRows();">✕</button>
        <div class="pay-converted">${p.currency === 'THB' ? '' : ('≈ ' + formatMoney(bkpAmountToTHB(p.currency, p.amount)) + ' บาท (อัตรา 1 บาท = ' + formatRate(bkpRateFor(p.currency)) + ' ' + p.currency + ')')}</div>`;
      box.appendChild(row);
    });
    updateBkpSummary();
  }

  function bkpRateFor(currency) {
    if (currency === 'LAK') return exchangeRates.LAK_PER_THB;
    if (currency === 'USD') return exchangeRates.USD_PER_THB;
    if (currency === 'CNY') return exchangeRates.CNY_PER_THB;
    return 1;
  }
  function bkpAmountToTHB(currency, amount) {
    const amt = Number(amount) || 0;
    return currency === 'THB' ? amt : amt / bkpRateFor(currency);
  }
  function updateBkpSummary() {
    const total = bkpPayments.reduce((s, p) => s + bkpAmountToTHB(p.currency, p.amount), 0);
    const balance = currentBookingDetail.booking.balanceTHB;
    document.getElementById('bkp-sum-total').textContent = formatMoney(total) + ' บาท';
    document.getElementById('bkp-sum-remaining').textContent = formatMoney(Math.max(0, balance - total)) + ' บาท';
  }

    if (payload.length === 0) { showToast('กรุณากรอกจำนวนเงินอย่างน้อย 1 รายการ'); return; }

  // ---------- Multi-Payment / Multi-Currency สำหรับรับชำระลูกหนี้ ----------
  let ardPayments = [];
  let currentArBalance = 0;

  function ardRateFor(currency) {
    if (currency === 'LAK') return exchangeRates.LAK_PER_THB;
    if (currency === 'USD') return exchangeRates.USD_PER_THB;
    if (currency === 'CNY') return exchangeRates.CNY_PER_THB;
    return 1;
  }
  function ardAmountToTHB(currency, amount) {
    const amt = Number(amount) || 0;
    return currency === 'THB' ? amt : amt / ardRateFor(currency);
  }

  document.getElementById('ard-add-payment').addEventListener('click', () => {
    const paidSoFar = ardPayments.reduce((s, p) => s + ardAmountToTHB(p.currency, p.amount), 0);
    const remaining = Math.max(0, currentArBalance - paidSoFar);
    ardPayments.push({ method: 'เงินสด', currency: 'THB', amount: remaining > 0 ? Number(remaining.toFixed(2)) : 0 });
    renderArdPaymentRows();
  });

  function renderArdPaymentRows() {
    const box = document.getElementById('ard-payment-rows');
    box.innerHTML = '';
    ardPayments.forEach((p, idx) => {
      const row = document.createElement('div');
      row.className = 'pay-row';
      row.innerHTML = `
        <select onchange="ardPayments[${idx}].method = this.value">
          <option value="เงินสด" ${p.method === 'เงินสด' ? 'selected' : ''}>เงินสด</option>
          <option value="โอนเงิน" ${p.method === 'โอนเงิน' ? 'selected' : ''}>โอนเงิน</option>
          <option value="บัตรเครดิต" ${p.method === 'บัตรเครดิต' ? 'selected' : ''}>บัตรเครดิต</option>
        </select>
        <select onchange="ardPayments[${idx}].currency = this.value; renderArdPaymentRows();">
          <option value="THB" ${p.currency === 'THB' ? 'selected' : ''}>THB</option>
          <option value="LAK" ${p.currency === 'LAK' ? 'selected' : ''}>LAK</option>
          <option value="USD" ${p.currency === 'USD' ? 'selected' : ''}>USD</option>
          <option value="CNY" ${p.currency === 'CNY' ? 'selected' : ''}>CNY</option>
        </select>
        <input type="number" class="pay-amount-input" value="${p.amount}" min="0" step="0.01"
          oninput="ardPayments[${idx}].amount = this.value; updateArdPaymentSummary();">
        <button type="button" class="pay-remove-btn" onclick="ardPayments.splice(${idx},1); renderArdPaymentRows();">✕</button>
        <div class="pay-converted">${p.currency === 'THB' ? '' : ('≈ ' + formatMoney(ardAmountToTHB(p.currency, p.amount)) + ' บาท (อัตรา 1 บาท = ' + formatRate(ardRateFor(p.currency)) + ' ' + p.currency + ')')}</div>`;
      box.appendChild(row);
    });
    updateArdPaymentSummary();
  }

  function updateArdPaymentSummary() {
    const total = ardPayments.reduce((s, p) => s + ardAmountToTHB(p.currency, p.amount), 0);
    document.getElementById('ard-sum-total').textContent = formatMoney(total) + ' บาท';
    document.getElementById('ard-sum-remaining').textContent = formatMoney(Math.max(0, currentArBalance - total)) + ' บาท';
  }

  function renderTrajectoryChart(data) {
    const box = document.getElementById('fin-trajectory-chart');
    if (!data || data.length === 0) { box.innerHTML = '<div class="empty-hint">ยังไม่มีข้อมูล</div>'; return; }

    box.innerHTML = data.map(d => `
      <div class="traj-bar-group">
        <div class="traj-bars">
          <div class="traj-bar in" style="height:${Math.max(2, (d.inflow / maxVal) * 100)}px;" title="เข้า ${formatMoney(d.inflow)}"></div>
          <div class="traj-bar out" style="height:${Math.max(2, (d.outflow / maxVal) * 100)}px;" title="ออก ${formatMoney(d.outflow)}"></div>

  }

          <div class="card"><div class="card-icon"><span class="material-symbols-outlined">payments</span></div><div class="card-label">บาท (THB)</div><div class="card-value">${formatMoney(reserves.balances.THB)}</div></div>
          <div class="card"><div class="card-icon"><span class="material-symbols-outlined">payments</span></div><div class="card-label">กีบ (LAK) — เทียบเท่า ${formatMoney(reserves.thbEquivalent.LAK)} บาท</div><div class="card-value">${formatMoney(reserves.balances.LAK)}</div></div>
          <div class="card"><div class="card-icon"><span class="material-symbols-outlined">payments</span></div><div class="card-label">ดอลลาร์ (USD) — เทียบเท่า ${formatMoney(reserves.thbEquivalent.USD)} บาท</div><div class="card-value">${formatMoney(reserves.balances.USD)}</div></div>
          <div class="card"><div class="card-icon"><span class="material-symbols-outlined">account_balance</span></div><div class="card-label">มูลค่ารวมทั้งหมด (เทียบเท่าบาท)</div><div class="card-value">${formatMoney(reserves.totalTHB)}</div></div>`;
      })
      .withFailureHandler(onServerError)
      .getCurrencyReserves();

    google.script.run
      .withSuccessHandler(report => {
        const tbody = document.querySelector('#cashflow-report-table tbody');
        tbody.innerHTML = '';
        if (!report.byCategory || report.byCategory.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--on-surface-variant);padding:16px;">ยังไม่มีข้อมูลใน 30 วันล่าสุด</td></tr>';
        } else {
          report.byCategory.forEach(c => {
            const net = c.inflow - c.outflow;
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${c.category}</td><td>${formatMoney(c.inflow)}</td><td>${formatMoney(c.outflow)}</td>
              <td style="color:${net >= 0 ? '#1e7e34' : '#c5221f'}; font-weight:600;">${formatMoney(net)}</td>`;
            tbody.appendChild(tr);
          });
        }
        document.getElementById('cashflow-report-total').textContent =
          `กระแสเงินสดสุทธิ (30 วัน): ${formatMoney(report.netCashFlow)} บาท (เข้า ${formatMoney(report.totalInflow)} / ออก ${formatMoney(report.totalOutflow)})`;
      })
      .withFailureHandler(onServerError)
      .getCashflowStatement(30);
  }

  // ================================================================
  // Trade-In
  // ================================================================
  function loadTradeInPage() {
    google.script.run
      .withSuccessHandler(summary => {
        document.getElementById('ti-stat-pending').textContent = summary.รอดำเนินการ;
        document.getElementById('ti-stat-waiting').textContent = summary.รอลูกค้าตัดสินใจ;
        document.getElementById('ti-stat-refurb').textContent = summary.กำลังซ่อม;
        document.getElementById('ti-stat-ready').textContent = summary.พร้อมขาย;
        document.getElementById('ti-stat-sold').textContent = summary.ขายแล้ว;
        document.getElementById('ti-stat-inventory-value').textContent = formatMoney(summary.มูลค่าคงคลังรวมTHB);
      })
      .withFailureHandler(onServerError)
      .getTradeInDashboardSummary();
    loadTradeInTable();
  }

  function loadTradeInTable() {
    const filter = document.getElementById('tradein-status-filter').value;
    google.script.run
      .withSuccessHandler(list => {
        const tbody = document.querySelector('#tradein-table tbody');
        tbody.innerHTML = '';
        if (!list || list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--on-surface-variant);padding:16px;">ไม่พบ Trade-In</td></tr>';
          return;
        }
        list.forEach(t => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${t.tradeInId}</td><td>${t.customerName}</td><td>${t.brand} ${t.model}${t.year ? ' (' + t.year + ')' : ''}</td>
            <td>${formatMoney(t.tradeInValue)}</td><td>${formatMoney(t.expectedMargin)}</td>
            <td><span class="status-badge" style="background:${tradeInStatusColor(t.status)};">${t.status}</span></td>
            <td><button onclick="openTradeInDetail('${t.tradeInId}')">ดู/จัดการ</button></td>`;
          tbody.appendChild(tr);
        });
      })
      .withFailureHandler(onServerError)
      .getTradeIns(filter);
  }
  document.getElementById('tradein-status-filter').addEventListener('change', loadTradeInTable);

  function tradeInStatusColor(status) {
    const map = {
      'กำลังประเมิน': '#9e9e9e', 'เสนอราคาแล้ว': '#ff9800', 'ลูกค้ายอมรับ': '#3f51b5',
      'รับจักรยานแล้ว': '#7b1fa2', 'ตรวจสอบสภาพ': '#7b1fa2', 'กำลังซ่อม': '#e53935',
      'พร้อมขาย': '#43a047', 'ขายแล้ว': '#43a047', 'ยกเลิก': '#757575'
    };
    return map[status] || '#9e9e9e';
  }

  // ---------- สร้างการประเมินใหม่ ----------
  let ntiSelectedCustomer = null;

  document.getElementById('btn-new-tradein').addEventListener('click', () => {
    ntiSelectedCustomer = null;
    ['nti-brand', 'nti-model', 'nti-year', 'nti-type', 'nti-frame-size', 'nti-frame-serial', 'nti-color',
     'nti-condition', 'nti-original-parts', 'nti-accessories', 'nti-damage', 'nti-photo-note',
     'nti-market-value', 'nti-refurb-cost', 'nti-tradein-value', 'nti-expected-resale', 'nti-notes'
    ].forEach(id => document.getElementById(id).value = '');
    document.getElementById('nti-customer-search').value = '';
    document.getElementById('nti-customer-selected').style.display = 'none';
    document.getElementById('nti-margin-preview').textContent = 'กำไรที่คาด: 0.00 บาท';
    document.getElementById('modal-new-tradein').classList.add('active');
  });
  document.getElementById('nti-cancel').addEventListener('click', () => {
    document.getElementById('modal-new-tradein').classList.remove('active');
  });

  document.getElementById('nti-customer-search').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.keyCode !== 13) return;
    const q = e.target.value.trim();
    if (!q) return;
    google.script.run
      .withSuccessHandler(results => {
        if (results && results.length > 0) {
          ntiSelectedCustomer = results[0];
          const box = document.getElementById('nti-customer-selected');
          box.style.display = 'block';
          box.innerHTML = `${ntiSelectedCustomer.name} (${ntiSelectedCustomer.phone})`;
        } else {
          showToast('ไม่พบลูกค้า - ลองพิมพ์ชื่อหรือเบอร์โทรให้ครบถ้วน');
        }
      })
      .withFailureHandler(onServerError)
      .searchCustomers(q);
  });

  ['nti-tradein-value', 'nti-refurb-cost', 'nti-expected-resale'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      const tradeInValue = Number(document.getElementById('nti-tradein-value').value) || 0;
      const refurbCost = Number(document.getElementById('nti-refurb-cost').value) || 0;
      const expectedResale = Number(document.getElementById('nti-expected-resale').value) || 0;
      const margin = expectedResale - tradeInValue - refurbCost;
      document.getElementById('nti-margin-preview').textContent = 'กำไรที่คาด: ' + formatMoney(margin) + ' บาท';
    });
  });

  document.getElementById('nti-save').addEventListener('click', () => {
    if (!ntiSelectedCustomer) { showToast('กรุณาเลือกลูกค้าก่อน'); return; }
    const brand = document.getElementById('nti-brand').value;
    const model = document.getElementById('nti-model').value;
    if (!brand || !model) { showToast('กรุณากรอกยี่ห้อและรุ่นจักรยาน'); return; }

    const data = {
      customerId: ntiSelectedCustomer.id, brand: brand, model: model,
      year: document.getElementById('nti-year').value, type: document.getElementById('nti-type').value,
      frameSize: document.getElementById('nti-frame-size').value, frameSerial: document.getElementById('nti-frame-serial').value,
      color: document.getElementById('nti-color').value, condition: document.getElementById('nti-condition').value,
      originalParts: document.getElementById('nti-original-parts').value, accessories: document.getElementById('nti-accessories').value,
      damage: document.getElementById('nti-damage').value, photoNote: document.getElementById('nti-photo-note').value,
      marketValue: document.getElementById('nti-market-value').value, refurbishCost: document.getElementById('nti-refurb-cost').value,
      tradeInValue: document.getElementById('nti-tradein-value').value, expectedResalePrice: document.getElementById('nti-expected-resale').value,
      notes: document.getElementById('nti-notes').value
    };

    google.script.run
      .withSuccessHandler(res => {
        showToast(res.message);
        if (res.success) {
          document.getElementById('modal-new-tradein').classList.remove('active');
          loadTradeInPage();
          openTradeInDetail(res.tradeInId);
        }
      })
      .withFailureHandler(onServerError)
      .createTradeInEvaluation(data, currentStaffId || '', currentStaffName || 'พนักงาน');
  });

  // ---------- รายละเอียด + Actions ----------
  let currentTradeInId = null;
  let currentTradeInDetail = null;

  function openTradeInDetail(tradeInId) {
    currentTradeInId = tradeInId;
    google.script.run
      .withSuccessHandler(detail => {
        if (!detail) { showToast('ไม่พบ Trade-In นี้'); return; }
        currentTradeInDetail = detail;
        const t = detail.tradeIn;

        document.getElementById('tid-title').textContent = 'Trade-In: ' + t.tradeInId;
        document.getElementById('tid-summary-cards').innerHTML = `
          <div class="card"><div class="card-label">ราคาตลาด</div><div class="card-value">${formatMoney(t.marketValue)}</div></div>
          <div class="card"><div class="card-label">มูลค่า Trade-In</div><div class="card-value">${formatMoney(t.tradeInValue)}</div></div>
          <div class="card"><div class="card-label">ราคาขายต่อที่คาด</div><div class="card-value">${formatMoney(t.expectedResalePrice)}</div></div>
          <div class="card"><div class="card-label">กำไรที่คาด</div><div class="card-value ${t.expectedMargin < 0 ? 'warn' : ''}">${formatMoney(t.expectedMargin)}</div></div>`;

        document.getElementById('tid-info').innerHTML = `
          <b>ลูกค้า:</b> ${t.customerName}<br>
          <b>จักรยาน:</b> ${t.brand} ${t.model} ${t.year ? '(' + t.year + ')' : ''} | ${t.type || '-'}<br>
          <b>ขนาดเฟรม:</b> ${t.frameSize || '-'} | <b>เลขเฟรม:</b> ${t.frameSerial || '-'} | <b>สี:</b> ${t.color || '-'}<br>
          <b>สภาพ:</b> ${t.condition || '-'} | <b>อะไหล่เดิม:</b> ${t.originalParts || '-'} | <b>อุปกรณ์เสริม:</b> ${t.accessories || '-'}<br>
          <b>ความเสียหาย:</b> ${t.damage || '-'}<br>
          <b>ค่าซ่อมแซมประมาณ:</b> ${formatMoney(t.refurbishCost)} บาท<br>
          <b>ประเมินโดย:</b> ${t.evaluatedBy} | <b>อนุมัติโดย:</b> ${t.approvedBy || '(ยังไม่อนุมัติ)'}<br>
          ${t.appliedBillNumber ? '<b>ใช้ในบิล:</b> ' + t.appliedBillNumber + '<br>' : ''}
          ${t.sku ? '<b>SKU สินค้ามือสอง:</b> ' + t.sku + (t.soldPrice ? ' | ขายไปแล้ว ' + formatMoney(t.soldPrice) + ' บาท' : '') + '<br>' : ''}
          <b>วันที่สร้าง:</b> ${t.createdDate}`;

        const actionBox = document.getElementById('tid-action-row');
        actionBox.innerHTML = '';
        const isTerminal = t.status === 'ยกเลิก' || t.status === 'ขายแล้ว';

        if (!isTerminal) {
          if (t.status === 'กำลังประเมิน') {
            actionBox.innerHTML += `<button onclick="approveCurrentTradeIn()">✅ อนุมัติราคาเสนอ (ผู้จัดการ)</button>`;
            actionBox.innerHTML += `<button onclick="cancelCurrentTradeIn()">✕ ยกเลิก</button>`;
          }
          if (t.status === 'เสนอราคาแล้ว') {
            actionBox.innerHTML += `<button onclick="acceptCurrentTradeIn()">🤝 ลูกค้ายอมรับข้อเสนอ</button>`;
            actionBox.innerHTML += `<button onclick="cancelCurrentTradeIn()">✕ ยกเลิก</button>`;
          }
          if (t.status === 'ลูกค้ายอมรับ') {
            actionBox.innerHTML += `<button onclick="manuallyReceiveCurrentTradeIn()">📦 ยืนยันรับจักรยานแล้ว</button>`;
          }
          // เลื่อนสถานะช่วง Inventory (Received -> Inspection -> Refurbishing -> Ready)
          const invFlow = ['รับจักรยานแล้ว', 'ตรวจสอบสภาพ', 'กำลังซ่อม', 'พร้อมขาย'];
          const curIdx = invFlow.indexOf(t.status);
          if (curIdx !== -1 && curIdx < invFlow.length - 1) {
            const nextStatus = invFlow[curIdx + 1];
            actionBox.innerHTML += `<button onclick="advanceTradeInStatus('${nextStatus}')">➡️ ${nextStatus}</button>`;
          }
          if (t.approvedBy || t.tradeInValue > 0) {
            actionBox.innerHTML += `<button onclick="openTradeInEditValue()">✏️ แก้ไขมูลค่า Trade-In</button>`;
          }
        }
        actionBox.innerHTML += `<button onclick="printTradeInDoc('evaluation')">🖨️ พิมพ์ใบประเมิน</button>`;
        if (t.status !== 'กำลังประเมิน' && t.status !== 'ยกเลิก') {
          actionBox.innerHTML += `<button onclick="printTradeInDoc('receipt')">🖨️ พิมพ์ใบรับซื้อ</button>`;
        }

        const timelineEl = document.getElementById('tid-timeline');
        timelineEl.innerHTML = '';
        detail.timeline.forEach(e => {
          const div = document.createElement('div');
          div.className = 'timeline-item';
          div.innerHTML = `<div class="ti-event">${e.status}</div><div class="ti-meta">${e.date} — ${e.by}${e.note ? ' — ' + e.note : ''}</div>`;
          timelineEl.appendChild(div);
        });

        const auditSection = document.getElementById('tid-audit-section');
        if (detail.auditLog.length > 0) {
          auditSection.style.display = 'block';
          const tbody = document.querySelector('#tid-audit-table tbody');
          tbody.innerHTML = '';
          detail.auditLog.forEach(a => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${a.date}</td><td>${a.by}</td><td>${formatMoney(a.oldValue)}</td><td>${formatMoney(a.newValue)}</td><td>${a.reason || '-'}</td>`;
            tbody.appendChild(tr);
          });
        } else {
          auditSection.style.display = 'none';
        }

        document.getElementById('modal-tradein-detail').classList.add('active');
      })
      .withFailureHandler(onServerError)
      .getTradeInDetail(tradeInId);
  }

  document.getElementById('tid-close').addEventListener('click', () => {
    document.getElementById('modal-tradein-detail').classList.remove('active');
    loadTradeInPage();
  });

  function approveCurrentTradeIn() {
    if (!confirm('ยืนยันอนุมัติราคาเสนอ Trade-In นี้? (เฉพาะผู้จัดการเท่านั้นที่อนุมัติได้)')) return;
    google.script.run
      .withSuccessHandler(res => { showToast(res.message); openTradeInDetail(currentTradeInId); })
      .withFailureHandler(onServerError)
      .approveTradeInOffer(currentTradeInId, currentStaffId || '', currentStaffName || 'พนักงาน');
  }

  function acceptCurrentTradeIn() {
    if (!confirm('ยืนยันว่าลูกค้ายอมรับข้อเสนอ Trade-In นี้แล้ว?')) return;
    google.script.run
      .withSuccessHandler(res => { showToast(res.message); openTradeInDetail(currentTradeInId); })
      .withFailureHandler(onServerError)
      .acceptTradeIn(currentTradeInId, currentStaffName || 'พนักงาน');
  }

  function manuallyReceiveCurrentTradeIn() {
    if (!confirm('ยืนยันว่าได้รับจักรยานจากลูกค้าแล้วจริง?\n\nระบบจะสร้างสินค้ามือสองในคลัง (ยังไม่เปิดขายจนกว่าจะตรวจสอบ/ซ่อมเสร็จ)\nหมายเหตุ: ถ้าลูกค้าซื้อสินค้าใหม่พร้อมกันในครั้งนี้ แนะนำให้ใช้ปุ่ม "ใช้เครดิตซื้อสินค้าใหม่" แทน ระบบจะเชื่อมกับบิลขายให้อัตโนมัติ')) return;
    google.script.run
      .withSuccessHandler(res => { showToast(res.message); openTradeInDetail(currentTradeInId); })
      .withFailureHandler(onServerError)
      .manuallyReceiveTradeIn(currentTradeInId, currentStaffName || 'พนักงาน');
  }

  function cancelCurrentTradeIn() {
    const reason = prompt('เหตุผลการยกเลิก (ถ้ามี)');
    if (reason === null) return;
    google.script.run
      .withSuccessHandler(res => { showToast(res.message); openTradeInDetail(currentTradeInId); })
      .withFailureHandler(onServerError)
      .cancelTradeIn(currentTradeInId, currentStaffName || 'พนักงาน', reason);
  }

  function advanceTradeInStatus(nextStatus) {
    if (!confirm('ยืนยันเปลี่ยนสถานะเป็น "' + nextStatus + '"?' + (nextStatus === 'พร้อมขาย' ? '\n\nระบบจะเปิดให้ขายสินค้านี้ใน POS ทันที' : ''))) return;
    google.script.run
      .withSuccessHandler(res => { showToast(res.message); openTradeInDetail(currentTradeInId); })
      .withFailureHandler(onServerError)
      .advanceTradeInInventoryStatus(currentTradeInId, nextStatus, currentStaffName || 'พนักงาน');
  }

  // ---------- แก้ไขมูลค่า ----------
  function openTradeInEditValue() {
    const t = currentTradeInDetail.tradeIn;
    document.getElementById('tev-current-info').textContent = 'มูลค่าปัจจุบัน: ' + formatMoney(t.tradeInValue) + ' บาท' + (t.approvedBy ? ' (อนุมัติแล้วโดย ' + t.approvedBy + ' — ต้องเป็นผู้จัดการถึงจะแก้ไขได้ และต้องระบุเหตุผล)' : '');
    document.getElementById('tev-new-value').value = t.tradeInValue;
    document.getElementById('tev-reason').value = '';
    document.getElementById('modal-tradein-edit-value').classList.add('active');
  }
  document.getElementById('tev-cancel').addEventListener('click', () => {
    document.getElementById('modal-tradein-edit-value').classList.remove('active');
  });
  document.getElementById('tev-save').addEventListener('click', () => {
    const newValue = document.getElementById('tev-new-value').value;
    const reason = document.getElementById('tev-reason').value;
    google.script.run
      .withSuccessHandler(res => {
        showToast(res.message);
        if (res.success) {
          document.getElementById('modal-tradein-edit-value').classList.remove('active');
          openTradeInDetail(currentTradeInId);
        }
      })
      .withFailureHandler(onServerError)
      .updateTradeInValue(currentTradeInId, newValue, reason, currentStaffId || '', currentStaffName || 'พนักงาน');
  });

  // ---------- พิมพ์เอกสาร (ใบประเมิน / ใบรับซื้อ) ----------

  document.getElementById('tipr-close').addEventListener('click', () => {

  // ================================================================
  // ใช้เครดิต Trade-In ซื้อสินค้าใหม่ (Mini Checkout) — หน้า Sale > Trade-In
  // ================================================================
  let ticSelectedTradeIn = null; // { tradeInId, customerId, customerName, value, label }
  let ticItems = []; // สินค้าใหม่ที่ลูกค้าเลือกซื้อ [{ sku, name, qty, price }]
  let ticSelectedProduct = null;
  let ticPayments = [];
  let lastTradeInPickerList = [];

  document.getElementById('btn-use-tradein-credit').addEventListener('click', () => {
    google.script.run
      .withSuccessHandler(list => {
        lastTradeInPickerList = list || [];
        const box = document.getElementById('tradein-picker-list');
        if (!list || list.length === 0) {
          box.innerHTML = '<div class="empty-hint">ยังไม่มี Trade-In ที่ "ลูกค้ายอมรับข้อเสนอ" แล้วและยังไม่ได้ใช้เลย</div>';

  document.getElementById('tradein-picker-close').addEventListener('click', () => {

  document.getElementById('tradein-picker-list').addEventListener('click', (e) => {

  function openTradeInCheckout(t) {
    ticSelectedTradeIn = { tradeInId: t.tradeInId, customerId: t.customerId, customerName: t.customerName, value: t.tradeInValue, label: t.brand + ' ' + t.model };
    ticItems = [];

    ticPayments = [{ method: 'เงินสด', currency: 'THB', amount: 0 }];

    document.getElementById('tic-tradein-info').innerHTML = `
      <b>ลูกค้า:</b> ${t.customerName}<br>
      <b>Trade-In:</b> ${t.tradeInId} — ${t.brand} ${t.model} ${t.year ? '(' + t.year + ')' : ''}<br>
      <b>เครดิตที่ใช้ได้:</b> <span style="color:#1e7e34; font-weight:700;">${formatMoney(t.tradeInValue)} บาท</span>`;

    document.getElementById('tic-item-search').value = '';
    document.getElementById('tic-item-selected').style.display = 'none';
    document.getElementById('tic-item-qty').value = '1';
    document.getElementById('tic-item-price').value = '';
    renderTicItems();
    renderTicPaymentRows();

    document.getElementById('modal-tradein-picker').classList.remove('active');
    document.getElementById('modal-tradein-checkout').classList.add('active');
  }

  document.getElementById('tic-item-search').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.keyCode !== 13) return;
    const code = e.target.value.trim();
    if (!code) return;
    google.script.run
      .withSuccessHandler(product => {
        if (product) {
          ticSelectedProduct = product;
          const box = document.getElementById('tic-item-selected');
          box.style.display = 'block';
          box.textContent = product.name + ' (SKU: ' + product.sku + ') | คงเหลือ: ' + product.stock + ' ' + product.unit;
          document.getElementById('tic-item-price').value = product.price || '';
        } else {
          showToast('ไม่พบสินค้ารหัส/บาร์โค้ด: ' + code);
        }
      })
      .withFailureHandler(onServerError)
      .findProductOrVariantByCode(code); // รองรับ Variant ด้วย (InventoryV3)
  });

  document.getElementById('tic-add-item').addEventListener('click', () => {
    if (!ticSelectedProduct) { showToast('กรุณาค้นหาและเลือกสินค้าก่อน'); return; }
    const qty = Number(document.getElementById('tic-item-qty').value);
    const price = Number(document.getElementById('tic-item-price').value);
    if (!qty || qty <= 0) { showToast('กรุณากรอกจำนวนให้ถูกต้อง'); return; }
    if (price === '' || isNaN(price) || price < 0) { showToast('กรุณากรอกราคาให้ถูกต้อง'); return; }

    ticItems.push({ sku: ticSelectedProduct.sku, name: ticSelectedProduct.name, qty: qty, price: price });
    renderTicItems();

    document.getElementById('tic-item-search').value = '';
    document.getElementById('tic-item-selected').style.display = 'none';
    document.getElementById('tic-item-qty').value = '1';
    document.getElementById('tic-item-price').value = '';
    ticSelectedProduct = null;
  });

  function renderTicItems() {
    const box = document.getElementById('tic-items-list');
    if (ticItems.length === 0) {
      box.innerHTML = '<div class="empty-hint">ยังไม่ได้เลือกสินค้าใหม่</div>';
    } else {
      box.innerHTML = '<table class="data-table"><thead><tr><th>สินค้า</th><th>จำนวน</th><th>ราคา/หน่วย</th><th>รวม</th><th></th></tr></thead><tbody>' +
        ticItems.map((item, idx) => `<tr><td>${item.name}</td><td>${item.qty}</td><td>${formatMoney(item.price)}</td><td>${formatMoney(item.qty * item.price)}</td>
          <td><button onclick="removeTicItem(${idx})">✕</button></td></tr>`).join('') +
        '</tbody></table>';
    }
    updateTicSummary();
  }

  function removeTicItem(idx) {
    ticItems.splice(idx, 1);
    renderTicItems();
  }

  function ticSubtotal() {
    return ticItems.reduce((s, i) => s + i.qty * i.price, 0);
  }
  function ticNetTotal() {
    return Math.max(0, ticSubtotal() - ticSelectedTradeIn.value);
  }

  function updateTicSummary() {
    document.getElementById('tic-sum-subtotal').textContent = formatMoney(ticSubtotal()) + ' บาท';
    document.getElementById('tic-sum-credit').textContent = '-' + formatMoney(ticSelectedTradeIn.value) + ' บาท';
    document.getElementById('tic-sum-total').textContent = formatMoney(ticNetTotal()) + ' บาท';
    updateTicPaymentSummary();
  }

  // ---------- Multi-Payment / Multi-Currency (เหมือนหน้า POS) ----------
  function ticRateFor(currency) {
    if (currency === 'LAK') return exchangeRates.LAK_PER_THB;
    if (currency === 'USD') return exchangeRates.USD_PER_THB;
    if (currency === 'CNY') return exchangeRates.CNY_PER_THB;
    return 1;
  }
  function ticAmountToTHB(currency, amount) {
    const amt = Number(amount) || 0;
    return currency === 'THB' ? amt : amt / ticRateFor(currency);
  }
  function ticPaidTotalTHB() {
    return ticPayments.reduce((s, p) => s + ticAmountToTHB(p.currency, p.amount), 0);
  }

  document.getElementById('tic-add-payment').addEventListener('click', () => {
    const remaining = Math.max(0, ticNetTotal() - ticPaidTotalTHB());
    ticPayments.push({ method: 'เงินสด', currency: 'THB', amount: remaining > 0 ? Number(remaining.toFixed(2)) : 0 });
    renderTicPaymentRows();
  });

  function renderTicPaymentRows() {
    const box = document.getElementById('tic-payment-rows');
    box.innerHTML = '';
    ticPayments.forEach((p, idx) => {
      const row = document.createElement('div');
      row.className = 'pay-row';
      row.innerHTML = `
        <select onchange="ticPayments[${idx}].method = this.value">
          <option value="เงินสด" ${p.method === 'เงินสด' ? 'selected' : ''}>เงินสด</option>
          <option value="โอนเงิน" ${p.method === 'โอนเงิน' ? 'selected' : ''}>โอนเงิน</option>
          <option value="บัตรเครดิต" ${p.method === 'บัตรเครดิต' ? 'selected' : ''}>บัตรเครดิต</option>
        </select>
        <select onchange="ticPayments[${idx}].currency = this.value; renderTicPaymentRows();">
          <option value="THB" ${p.currency === 'THB' ? 'selected' : ''}>THB</option>
          <option value="LAK" ${p.currency === 'LAK' ? 'selected' : ''}>LAK</option>
          <option value="USD" ${p.currency === 'USD' ? 'selected' : ''}>USD</option>
          <option value="CNY" ${p.currency === 'CNY' ? 'selected' : ''}>CNY</option>
        </select>
        <input type="number" class="pay-amount-input" value="${p.amount}" min="0" step="0.01"
          oninput="ticPayments[${idx}].amount = this.value; updateTicPaymentSummary();">
        <button type="button" class="pay-remove-btn" onclick="ticPayments.splice(${idx},1); renderTicPaymentRows();">✕</button>
        <div class="pay-converted">${p.currency === 'THB' ? '' : ('≈ ' + formatMoney(ticAmountToTHB(p.currency, p.amount)) + ' บาท (อัตรา 1 บาท = ' + formatMoney(ticRateFor(p.currency)) + ' ' + p.currency + ')')}</div>`;
      box.appendChild(row);
    });
    updateTicPaymentSummary();
  }

  function updateTicPaymentSummary() {
    const total = ticNetTotal();
    const paid = ticPaidTotalTHB();
    const remaining = Math.max(0, total - paid);
    const cashPaid = ticPayments.filter(p => p.method === 'เงินสด').reduce((s, p) => s + ticAmountToTHB(p.currency, p.amount), 0);
    const overpaid = Math.max(0, paid - total);
    const change = Math.min(overpaid, cashPaid);

    document.getElementById('tic-pay-paid').textContent = formatMoney(paid) + ' บาท';
    const remainingEl = document.getElementById('tic-pay-remaining');
    remainingEl.textContent = formatMoney(remaining) + ' บาท';
    remainingEl.parentElement.classList.toggle('zero', remaining <= 0.01);

    const changeRow = document.getElementById('tic-pay-change-row');
    if (overpaid > 0.01) {
      changeRow.style.display = 'flex';
      document.getElementById('tic-pay-change').textContent = formatMoney(change) + ' บาท';
    } else {
      changeRow.style.display = 'none';
    }

    document.getElementById('tic-complete').disabled = !(remaining <= 0.01 && ticPayments.length > 0);
  }

  document.getElementById('tic-cancel').addEventListener('click', () => {
    document.getElementById('modal-tradein-checkout').classList.remove('active');
  });

  document.getElementById('tic-complete').addEventListener('click', () => {
    // สร้างตะกร้า: สินค้าใหม่ + บรรทัดเครดิต Trade-In (ลบยอดตามที่อนุมัติไว้)
    const cartForSale = ticItems.map(i => ({ ...i }));
    cartForSale.push({
      sku: 'TRADEIN-CREDIT', name: 'TRADE-IN CREDIT: ' + ticSelectedTradeIn.label,
      price: -Math.abs(ticSelectedTradeIn.value), qty: 1
    });

    const paymentsPayload = ticPayments.filter(p => Number(p.amount) > 0).map(p => ({
      method: p.method, currency: p.currency, amount: Number(p.amount), exchangeRate: ticRateFor(p.currency)
    }));
    if (paymentsPayload.length === 0) { showToast('กรุณาเพิ่มรายการชำระเงินอย่างน้อย 1 รายการ'); return; }

    const totalTHB = ticNetTotal();
    const customerNameSnapshot = ticSelectedTradeIn.customerName;
    const cartSnapshot = cartForSale.map(i => ({ ...i }));

    const completeBtn = document.getElementById('tic-complete');
    completeBtn.disabled = true;

    google.script.run
      .withSuccessHandler(res => {
        completeBtn.disabled = false;
        if (res.success) {
          const pointsMsg = res.pointsEarned > 0 ? (' | ลูกค้าได้รับ ' + res.pointsEarned + ' แต้ม') : '';
          showToast('ขายสำเร็จ เลขที่บิล ' + res.billNumber + pointsMsg);
          showReceipt({
            billNumber: res.billNumber, date: new Date(), items: cartSnapshot, total: totalTHB,
            payments: res.payments, changeTHB: res.changeTHB, customerName: customerNameSnapshot, pointsEarned: res.pointsEarned
          });
          document.getElementById('modal-tradein-checkout').classList.remove('active');
          loadTradeInPage();
        } else {
          showToast(res.message || 'เกิดข้อผิดพลาด');
          updateTicPaymentSummary();
        }
      })
      .withFailureHandler(err => { completeBtn.disabled = false; onServerError(err); })
      .recordSaleWithPayments(cartForSale, paymentsPayload, currentStaffName || 'พนักงาน', ticSelectedTradeIn.customerId, currentStaffId || '', ticSelectedTradeIn.tradeInId);
  });

        document.getElementById('pur-stat-pending').textContent = summary.รอรับสินค้า;

        document.getElementById('pur-stat-done').textContent = summary.รับครบแล้ว;

  function renderPurchaseRows(tableId, list) {
    const tbody = document.querySelector('#' + tableId + ' tbody');
    tbody.innerHTML = '';
    if (!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--on-surface-variant);padding:16px;">ไม่พบใบสั่งซื้อ</td></tr>';

      tr.innerHTML = `<td>${p.purchaseId}</td><td>${p.supplierName}</td><td>${formatMoney(p.totalTHB)}</td>

  function switchPurchaseTab(targetTab) {
    document.querySelectorAll('#purchase-tabs .subpage-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === targetTab));
    document.querySelectorAll('#page-purchase .subpage-panel').forEach(p => p.classList.toggle('active', p.id === 'subpage-' + targetTab));

    if (targetTab === 'pur-suppliers') { loadSuppliersTable(); return; }

    if (targetTab === 'pur-reorder') { loadReorderSuggestions(); return; }

    if (targetTab === 'pur-pending') {
      google.script.run
        .withSuccessHandler(list => renderPurchaseRows('purchase-table-pending', list.filter(p => p.status === 'สั่งซื้อ' || p.status === 'รับสินค้าบางส่วน')))
        .withFailureHandler(onServerError)
        .getPurchaseOrders('all');
      return;
    }

    const filterMap = { 'pur-all': 'all', 'pur-received': 'รับครบแล้ว' };
    const tableMap = { 'pur-all': 'purchase-table', 'pur-received': 'purchase-table-received' };

    google.script.run
      .withSuccessHandler(list => renderPurchaseRows(tableMap[targetTab], list))
      .withFailureHandler(onServerError)
      .getPurchaseOrders(filterMap[targetTab]);
  }

  // ---------- สร้างใบสั่งซื้อใหม่ ----------
  // Helper ใช้ร่วมกันทุกจุดที่ต้องเลือกซัพพลายเออร์ (สร้าง PO / รับสินค้าเข้า / Product Profile)

    const cost = Number(document.getElementById('np-item-cost').value);
    if (!qty || qty <= 0) { showToast('กรุณากรอกจำนวนให้ถูกต้อง'); return; }
    if (!cost || cost < 0) { showToast('กรุณากรอกราคาต่อหน่วยให้ถูกต้อง'); return; }

    npCart.push({ sku: npSelectedProduct.sku, name: npSelectedProduct.name, qty: qty, unitCost: cost });
    renderNpItemsTable();

    document.getElementById('np-item-search').value = '';
    document.getElementById('np-item-selected').style.display = 'none';
    document.getElementById('np-item-qty').value = '1';
    document.getElementById('np-item-cost').value = '';
    npSelectedProduct = null;
  });

  function renderNpItemsTable() {
    const tbody = document.querySelector('#np-items-table tbody');
    tbody.innerHTML = '';
    let total = 0;
    npCart.forEach((item, idx) => {
      const lineTotal = item.qty * item.unitCost;
      total += lineTotal;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${item.name}</td><td>${item.qty}</td><td>${formatMoney(item.unitCost)}</td><td>${formatMoney(lineTotal)}</td>
        <td><button onclick="removeNpItem(${idx})">✕</button></td>`;
      tbody.appendChild(tr);
    });
    const currency = document.getElementById('np-currency-select').value;
    document.getElementById('np-total-display').textContent = 'รวม: ' + formatMoney(total) + ' ' + currency;
  }

  function removeNpItem(idx) {
    npCart.splice(idx, 1);
    renderNpItemsTable();
  }

  document.getElementById('np-save-purchase').addEventListener('click', () => {
    const supplierId = document.getElementById('np-supplier-select').value;
    if (!supplierId) { showToast('กรุณาเลือกซัพพลายเออร์'); return; }
    if (npCart.length === 0) { showToast('กรุณาเพิ่มสินค้าอย่างน้อย 1 รายการ'); return; }

    const btn = document.getElementById('np-save-purchase');
    if (btn.disabled) return; // กันกดซ้ำ — เคยเกิดปัญหาสร้างใบสั่งซื้อซ้ำ 2-3 ใบเลขเดียวกันเพราะกดรัวๆ ตอนระบบช้า
    btn.disabled = true;
    let reEnabled = false;
    const reEnable = () => { if (reEnabled) return; reEnabled = true; btn.disabled = false; };
    setTimeout(reEnable, 15000); // กันปุ่มค้างถ้า server ไม่ตอบกลับเลย (หายากมาก)

    const currency = document.getElementById('np-currency-select').value;
    const rate = currency === 'THB' ? 1 : Number(document.getElementById('np-exchange-rate').value);
    const expectedDate = document.getElementById('np-expected-date').value;
    const note = document.getElementById('np-note').value;

    google.script.run
      .withSuccessHandler(res => {
        reEnable();
        showToast(res.message);
        if (res.success) {
          document.getElementById('modal-new-purchase').classList.remove('active');
          clearNewPurchaseDraft(); // สั่งซื้อสำเร็จแล้ว ไม่ใช่ร่างอีกต่อไป ล้างให้พร้อมสำหรับใบถัดไป
          loadPurchasePage();
        }
      })
      .withFailureHandler(err => { reEnable(); onServerError(err); })
      .createPurchaseOrder(npCart, supplierId, currency, rate, expectedDate, note, currentStaffId || '', currentStaffName || 'พนักงาน');
  });

  // ---------- รายละเอียด/จัดการใบสั่งซื้อ ----------
  function openPurchaseDetail(rowNum) {
    currentPurchaseId = rowNum; // เก็บเป็นเลขแถวจริง (rowNum) ไม่ใช่เลขที่ใบสั่งซื้อ — กันปัญหาเลขที่ซ้ำกัน (ดูเหตุผลใน Purchase.gs)
    google.script.run
      .withSuccessHandler(detail => {
        if (!detail) { showToast('ไม่พบใบสั่งซื้อนี้'); return; }
        const po = detail.po;
        document.getElementById('pd-title').textContent = 'ใบสั่งซื้อ: ' + po.purchaseId;
        document.getElementById('pd-info').innerHTML = `
          <b>ซัพพลายเออร์:</b> ${po.supplierName}<br>
          <b>สถานะ:</b> <span class="status-badge status-${po.status}">${po.status}</span>
          &nbsp; <b>การชำระ:</b> <span class="status-badge status-${po.paymentStatus}">${po.paymentStatus}</span><br>
          <b>ยอดรวม:</b> ${formatMoney(po.totalTHB)} บาท (${formatMoney(po.totalForeign)} ${po.currency})<br>
          <b>ชำระแล้ว:</b> ${formatMoney(po.paidTHB)} บาท | <b>คงค้าง:</b> ${formatMoney(po.balanceTHB)} บาท<br>
          <b>วันที่คาดว่าจะได้รับ:</b> ${po.expectedDate || '-'} | <b>หมายเหตุ:</b> ${po.note || '-'}`;

        const itemsBody = document.querySelector('#pd-items-table tbody');
        itemsBody.innerHTML = '';
        detail.items.forEach(item => {
          const remaining = item.qty - item.receivedQty;
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${item.name}</td><td>${item.qty}</td><td>${item.receivedQty}</td>
            <td>${remaining > 0 ? `<input type="number" class="pd-receive-input" data-sku="${item.sku}" min="0" max="${remaining}" placeholder="0" style="width:70px;">` : '-'}</td>`;
          itemsBody.appendChild(tr);
        });

        const payBody = document.querySelector('#pd-payments-table tbody');
        payBody.innerHTML = '';
        if (detail.payments.length === 0) {
          payBody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#999;">ยังไม่มีการจ่ายเงิน</td></tr>';
        } else {
          detail.payments.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${p.date}</td><td>${formatMoney(p.amount)}</td><td>${p.method}</td><td>${p.note || '-'}</td>`;
            payBody.appendChild(tr);
          });
        }

        const timelineEl = document.getElementById('pd-timeline');
        timelineEl.innerHTML = '';
        detail.timeline.forEach(t => {
          const div = document.createElement('div');
          div.className = 'timeline-item';
          div.innerHTML = `<div class="ti-event">${t.event}</div><div class="ti-meta">${t.date} — ${t.by}${t.detail ? ' — ' + t.detail : ''}</div>`;
          timelineEl.appendChild(div);
        });

        const isCancelledOrDone = po.status === 'ยกเลิก' || po.status === 'รับครบแล้ว';
        document.getElementById('pd-btn-receive').style.display = isCancelledOrDone ? 'none' : 'block';
        document.getElementById('pd-payment-section').style.display = po.balanceTHB > 0 && po.status !== 'ยกเลิก' ? 'block' : 'none';
        document.getElementById('pd-btn-cancel-purchase').style.display = (po.status === 'สั่งซื้อ' && po.paidTHB <= 0) ? 'inline-block' : 'none';

        document.getElementById('modal-purchase-detail').classList.add('active');
      })
      .withFailureHandler(onServerError)
      .getPurchaseOrderDetail(rowNum);
  }

  document.getElementById('pd-close').addEventListener('click', () => {
    document.getElementById('modal-purchase-detail').classList.remove('active');
    loadPurchasePage();
  });

  document.getElementById('pd-btn-receive').addEventListener('click', () => {
    const receivedItems = [];
    document.querySelectorAll('.pd-receive-input').forEach(input => {
      const qty = Number(input.value);
      if (qty > 0) receivedItems.push({ sku: input.dataset.sku, qty: qty });
    });
    if (receivedItems.length === 0) { showToast('กรุณากรอกจำนวนที่รับเข้าอย่างน้อย 1 รายการ'); return; }
    if (!confirm('ยืนยันรับสินค้าเข้าคลังตามจำนวนที่กรอก? ระบบจะเพิ่มสต๊อกทันที')) return;

    google.script.run
      .withSuccessHandler(res => { showToast(res.message); openPurchaseDetail(currentPurchaseId); })
      .withFailureHandler(onServerError)
      .receivePurchaseGoods(currentPurchaseId, receivedItems, currentStaffName || 'พนักงาน');
  });

  document.getElementById('pd-btn-pay').addEventListener('click', () => {
    const amount = document.getElementById('pd-payment-amount').value;
    const method = document.getElementById('pd-payment-method').value;
    const reference = document.getElementById('pd-payment-reference').value;
    const note = document.getElementById('pd-payment-note').value;
    if (!amount || Number(amount) <= 0) { showToast('กรุณากรอกจำนวนเงิน'); return; }
    google.script.run
      .withSuccessHandler(res => {
        showToast(res.message);
        if (res.success) {
          document.getElementById('pd-payment-amount').value = '';
          document.getElementById('pd-payment-reference').value = '';
          document.getElementById('pd-payment-note').value = '';
          openPurchaseDetail(currentPurchaseId);
        }
      })
      .withFailureHandler(onServerError)
      .recordPurchasePayment(currentPurchaseId, amount, method, reference, note, currentStaffName || 'พนักงาน');
  });

  document.getElementById('pd-btn-cancel-purchase').addEventListener('click', () => {
    if (!confirm('ยืนยันยกเลิกใบสั่งซื้อนี้?')) return;
    google.script.run
      .withSuccessHandler(res => { showToast(res.message); openPurchaseDetail(currentPurchaseId); })
      .withFailureHandler(onServerError)
      .cancelPurchaseOrder(currentPurchaseId, currentStaffName || 'พนักงาน');
  });

  // ================================================================
  // Reorder Suggestion (เชื่อม Inventory + Supplier + Purchase)
  // ================================================================
  let lastReorderGroups = [];

  function loadReorderSuggestions() {
    google.script.run
      .withSuccessHandler(groups => {
        lastReorderGroups = groups || [];
        renderReorderGroups(lastReorderGroups);
      })
      .withFailureHandler(onServerError)
      .getReorderSuggestionsBySupplier();
  }

  function renderReorderGroups(groups) {
    const box = document.getElementById('reorder-groups-container');
    if (!groups || groups.length === 0) {
      box.innerHTML = '<div class="empty-hint">ไม่มีสินค้าที่ต้องสั่งซื้อตอนนี้ 👍 (ตั้งค่า "จุดสั่งซื้อ" ในรายละเอียดสินค้าเพื่อให้ระบบแจ้งเตือนอัตโนมัติ)</div>';
      return;
    }
    box.innerHTML = groups.map(g => {
      const rows = g.items.map(it => `
        <tr><td>${it.sku}</td><td>${it.name}</td><td>${it.stock}</td><td>${it.reorderLevel}</td><td>${it.suggestedQty}</td><td>${formatMoney(it.unitCost)}</td></tr>
      `).join('');
      const hasSupplier = !!g.supplierId;
      return `
        <div class="panel-box" style="margin-bottom:14px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
            <div style="font-weight:700;">${g.supplierName} <span class="pending-tag">${g.items.length} รายการ</span></div>
            ${hasSupplier
              ? `<button onclick="openPurchaseFromReorderGroup('${g.supplierId}')">📄 สร้างใบสั่งซื้อ</button>`
              : `<span style="font-size:12px;color:var(--on-surface-variant);">ยังไม่ได้กำหนดซัพพลายเออร์ — ตั้งค่าได้ที่รายละเอียดสินค้า</span>`}
          </div>
          <table class="data-table">
            <thead><tr><th>SKU</th><th>สินค้า</th><th>คงเหลือ</th><th>จุดสั่งซื้อ</th><th>แนะนำสั่ง</th><th>ราคาทุน</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }).join('');
  }

  function openPurchaseFromReorderGroup(supplierId) {
    const group = lastReorderGroups.find(g => g.supplierId === supplierId);
    if (!group) return;

    npCart = group.items.map(it => ({ sku: it.sku, name: it.name, qty: it.suggestedQty, unitCost: it.unitCost }));
    npSelectedProduct = null;
    document.getElementById('np-currency-select').value = 'THB';
    document.getElementById('np-rate-row').style.display = 'none';
    document.getElementById('np-expected-date').value = '';
    document.getElementById('np-note').value = 'สร้างจากรายการแนะนำสั่งซื้อ (Reorder Suggestion)';
    document.getElementById('np-item-search').value = '';
    document.getElementById('np-item-selected').style.display = 'none';
    document.getElementById('np-item-qty').value = '1';
    document.getElementById('np-item-cost').value = '';
    renderNpItemsTable();

    loadSuppliersForSelect(() => {
      document.getElementById('np-supplier-select').value = supplierId;
    });
    document.getElementById('modal-new-purchase').classList.add('active');
  }

  // ---------- จัดการซัพพลายเออร์ (อยู่ในแท็บ pur-suppliers) ----------

  let allSuppliersCache = [];

  function loadSuppliersTable() {
    google.script.run
      .withSuccessHandler(suppliers => {
        allSuppliersCache = suppliers || [];
        renderSuppliersRows(allSuppliersCache);
      })
      .withFailureHandler(onServerError)
      .getSuppliers();
  }

  function renderSuppliersRows(suppliers) {
    const tbody = document.querySelector('#suppliers-table tbody');
    tbody.innerHTML = '';
    if (!suppliers || suppliers.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--on-surface-variant);padding:16px;">ไม่พบซัพพลายเออร์</td></tr>';
      return;
    }
    suppliers.forEach(s => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${s.name}</td><td>${s.phone || '-'}</td><td>${s.address || '-'}</td><td>${s.note || '-'}</td>`;
      tbody.appendChild(tr);
    });
  }

  document.getElementById('suppliers-search-box').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) { renderSuppliersRows(allSuppliersCache); return; }
    const filtered = allSuppliersCache.filter(s =>
      s.name.toLowerCase().includes(q) ||
      String(s.phone || '').includes(q) ||
      String(s.address || '').toLowerCase().includes(q)
    );
    renderSuppliersRows(filtered);
  });

  document.getElementById('btn-view-suppliers').addEventListener('click', () => {
    switchPurchaseTab('pur-suppliers');
  });

  document.getElementById('sup-save').addEventListener('click', () => {
    const supplier = {
      name: document.getElementById('sup-name').value,
      phone: document.getElementById('sup-phone').value,
      address: document.getElementById('sup-address').value,
      note: document.getElementById('sup-note').value
    };
    if (!supplier.name) { showToast('กรุณากรอกชื่อซัพพลายเออร์'); return; }
    google.script.run
      .withSuccessHandler(res => {
        showToast(res.message);
        if (res.success) {
          ['sup-name', 'sup-phone', 'sup-address', 'sup-note'].forEach(id => document.getElementById(id).value = '');
          loadSuppliersTable();
        }
      })
      .withFailureHandler(onServerError)
      .addSupplier(supplier);
  });

  // ================================================================
  // Shift / Cash Drawer (ลิ้นชักเงินสด) — ใช้ในหน้า POS
  // ================================================================
  const CASH_CURRENCIES_JS = ['THB', 'LAK', 'USD'];
  let currentShiftSummary = null; // cache ล่าสุดจากเซิร์ฟเวอร์

  function refreshCashDrawerButton() {
    google.script.run
      .withSuccessHandler(summary => {
        currentShiftSummary = summary;
        const btn = document.getElementById('btn-cash-drawer-toggle');
        if (!btn) return;
        if (summary.hasOpenShift) {
          btn.textContent = '💰 กะ #' + summary.shift.shiftId.replace('SHIFT-', '');
          btn.classList.add('shift-open');
        } else {
          btn.textContent = '💰 CASH DRAWER';
          btn.classList.remove('shift-open');
        }
      })
      .withFailureHandler(onServerError)
      .getCurrentShiftSummary();
  }

  document.getElementById('btn-cash-drawer-toggle').addEventListener('click', () => {
    google.script.run
      .withSuccessHandler(summary => {
        currentShiftSummary = summary;
        renderCashDrawerModal(summary);
        document.getElementById('modal-cash-drawer').classList.add('active');
      })
      .withFailureHandler(onServerError)
      .getCurrentShiftSummary();
  });

  function renderCashDrawerModal(summary) {
    const noShiftSection = document.getElementById('cd-section-noshift');
    const openSection = document.getElementById('cd-section-open');

    if (!summary.hasOpenShift) {
      document.getElementById('cd-title').textContent = 'CASH DRAWER — เปิดกะ';
      noShiftSection.style.display = 'block';
      openSection.style.display = 'none';
      ['cd-open-thb', 'cd-open-lak', 'cd-open-usd'].forEach(id => document.getElementById(id).value = '0');
      return;
    }

    noShiftSection.style.display = 'none';
    openSection.style.display = 'block';

    document.getElementById('cd-title').textContent = 'กะ ' + summary.shift.shiftId;
    document.getElementById('cd-shift-info').innerHTML =
      '<b>เปิดกะโดย:</b> ' + summary.shift.openedBy + ' | <b>เวลาเปิด:</b> ' + summary.shift.openedAt;

    document.getElementById('cd-expected-thb').textContent = formatMoney(summary.expectedCash.THB);
    document.getElementById('cd-expected-lak').textContent = formatMoney(summary.expectedCash.LAK);
    document.getElementById('cd-expected-usd').textContent = formatMoney(summary.expectedCash.USD);

    renderCashLedgerTable(summary.ledger);
  }

  function renderCashLedgerTable(ledger) {
    const tbody = document.querySelector('#cd-ledger-table tbody');
    tbody.innerHTML = '';
    if (!ledger || ledger.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#999;padding:12px;">ยังไม่มีรายการ</td></tr>';
      return;
    }
    ledger.forEach(e => {
      const isVoided = e.status === 'ยกเลิก';
      const canVoid = !isVoided && (e.type === 'เติมเงิน' || e.type === 'เบิกเงิน' || e.type === 'เบิกเงิน(ค่าใช้จ่าย)');
      const tr = document.createElement('tr');
      if (isVoided) tr.style.opacity = '0.5';
      const amountLabel = (e.amount >= 0 ? '+' : '') + formatMoney(e.amount);
      const refLabel = e.reason + (e.refBillNumber ? ' (' + e.refBillNumber + ')' : '');
      tr.innerHTML = `<td>${e.timestamp}</td><td>${e.type}</td><td>${e.currency}</td><td>${amountLabel}</td>
        <td>${refLabel}</td><td>${e.by}</td>
        <td><span class="status-badge" style="background:${isVoided ? '#9e9e9e' : '#43a047'};">${isVoided ? 'ยกเลิก' : 'ปกติ'}</span></td>
        <td>${canVoid ? `<button onclick="voidCashLedgerEntryPrompt('${e.entryId}')">ยกเลิก</button>` : '-'}</td>`;
      tbody.appendChild(tr);
    });
  }

  function voidCashLedgerEntryPrompt(entryId) {
    const reason = prompt('เหตุผลการยกเลิกรายการนี้');
    if (reason === null) return;
    if (!reason.trim()) { showToast('กรุณาระบุเหตุผล'); return; }
    google.script.run
      .withSuccessHandler(res => {
        showToast(res.message);
        if (res.success) reopenCashDrawerModal_();
      })
      .withFailureHandler(onServerError)
      .voidCashLedgerEntry(entryId, currentStaffName || 'พนักงาน', reason);
  }

  function reopenCashDrawerModal_() {
    google.script.run
      .withSuccessHandler(summary => {
        currentShiftSummary = summary;
        renderCashDrawerModal(summary);
        refreshCashDrawerButton();
      })
      .withFailureHandler(onServerError)
      .getCurrentShiftSummary();
  }

  document.getElementById('cd-close').addEventListener('click', () => {
    document.getElementById('modal-cash-drawer').classList.remove('active');
  });

  // ---------- เปิดกะ ----------
  document.getElementById('cd-open-btn').addEventListener('click', () => {
    const openingCash = {
      THB: document.getElementById('cd-open-thb').value,
      LAK: document.getElementById('cd-open-lak').value,
      USD: document.getElementById('cd-open-usd').value
    };
    google.script.run
      .withSuccessHandler(res => {
        showToast(res.message);
        if (res.success) reopenCashDrawerModal_();
      })
      .withFailureHandler(onServerError)
      .openCashShift(openingCash, currentStaffName || 'พนักงาน', currentStaffId || '');
  });

  // ---------- เติมเงิน ----------
  document.getElementById('cd-btn-cashin').addEventListener('click', () => {
    document.getElementById('cin-amount').value = '';
    document.getElementById('cin-reason').value = '';
    document.getElementById('modal-cash-in').classList.add('active');
  });
  document.getElementById('cin-cancel').addEventListener('click', () => {
    document.getElementById('modal-cash-in').classList.remove('active');
  });
  document.getElementById('cin-save').addEventListener('click', () => {
    const currency = document.getElementById('cin-currency').value;
    const amount = document.getElementById('cin-amount').value;
    const reason = document.getElementById('cin-reason').value;
    google.script.run
      .withSuccessHandler(res => {
        showToast(res.message);
        if (res.success) {
          document.getElementById('modal-cash-in').classList.remove('active');
          reopenCashDrawerModal_();
        }
      })
      .withFailureHandler(onServerError)
      .addCashToDrawer(currency, amount, reason, currentStaffName || 'พนักงาน');

  // ---------- เบิกเงิน ----------
  document.getElementById('cd-btn-cashout').addEventListener('click', () => {
    document.getElementById('cout-type').value = 'vault';
    document.getElementById('cout-amount').value = '';
    document.getElementById('cout-reason').value = '';
    document.getElementById('cout-category').value = 'UTILITY';
    document.getElementById('cout-expense-note').value = '';
    document.getElementById('cout-vault-section').style.display = 'block';
    document.getElementById('cout-expense-section').style.display = 'none';
    document.getElementById('modal-cash-out').classList.add('active');
  });

  document.getElementById('cout-type').addEventListener('change', (e) => {
    const isExpense = e.target.value === 'expense';
    document.getElementById('cout-vault-section').style.display = isExpense ? 'none' : 'block';
    document.getElementById('cout-expense-section').style.display = isExpense ? 'block' : 'none';
    if (isExpense) {
      populateFinanceAccountsForCurrency('cout-finance-account', document.getElementById('cout-currency').value);
    }
  });

  document.getElementById('cout-currency').addEventListener('change', (e) => {
    if (document.getElementById('cout-type').value === 'expense') {
      populateFinanceAccountsForCurrency('cout-finance-account', e.target.value);
    }
  });

  function populateFinanceAccountsForCurrency(selectId, currency) {
    google.script.run
      .withSuccessHandler(accounts => {
        const active = (accounts || []).filter(a => a.status === 'ใช้งาน' && a.currency === currency);
        const select = document.getElementById(selectId);
        select.innerHTML = active.length === 0
          ? '<option value="">-- ไม่มีบัญชีสกุล ' + currency + ' ให้เลือก ไปสร้างที่ Finance > บัญชี ก่อน --</option>'

  function showCloseShiftResult(res) {
    const rows = CASH_CURRENCIES_JS.map(c => {
      const variance = res.variance[c];
      const varLabel = variance === 0 ? 'ตรงพอดี' : (variance > 0 ? 'เกิน +' + formatMoney(variance) : 'ขาด ' + formatMoney(variance));
      const color = variance === 0 ? '#43a047' : (variance > 0 ? '#1e88e5' : '#e53935');
      return `<tr><td>${c}</td><td>${formatMoney(res.expectedCash[c])}</td><td>${formatMoney(res.actualCash[c])}</td>
        <td style="color:${color}; font-weight:700;">${varLabel}</td></tr>`;
    }).join('');
    document.getElementById('clsr-table-body').innerHTML = rows;
    document.getElementById('clsr-shift-id').textContent = res.shiftId;
    document.getElementById('modal-close-shift-result').classList.add('active');

  // อัปเดต preview ผลต่างแบบ real-time
  document.getElementById('sa-physical').addEventListener('input', (e) => {
    const phys = Number(e.target.value);
    if (isNaN(phys) || e.target.value === '') {
      document.getElementById('sa-diff').textContent = '-';
      document.getElementById('sa-after').textContent = '-';
      return;
    }
    const diff = phys - _saSystemStock;
    const diffEl = document.getElementById('sa-diff');
    diffEl.textContent = (diff >= 0 ? '+' : '') + diff;
    diffEl.style.color = diff === 0 ? 'var(--on-surface)' : diff > 0 ? 'var(--secondary)' : 'var(--error)';
    document.getElementById('sa-after').textContent = phys;
  });

  function assistantSearch(query) {
    const q = query.trim().toLowerCase();
    if (!q) return null;
    let bestMatches = [];
    ASSISTANT_KB.forEach(cat => {
      cat.qa.forEach(item => {
        const score = item.keywords.reduce((s, kw) => s + (q.includes(kw.toLowerCase()) || kw.toLowerCase().includes(q) ? 1 : 0), 0);
        if (score > 0) bestMatches.push(Object.assign({}, item, { score: score, category: cat.category }));
      });
    });
    bestMatches.sort((a, b) => b.score - a.score);
    return bestMatches.slice(0, 5);
  }

  // รองรับ Chrome/Edge/Safari เวอร์ชันใหม่ๆ — เบราว์เซอร์บางตัว (Firefox) อาจไม่รองรับ จะซ่อนปุ่มไมค์ให้อัตโนมัติ
  (function setupVoiceInput() {
    const micBtn = document.getElementById('ai-agent-mic');
    const micStatus = document.getElementById('ai-mic-status');
    const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognitionAPI) {
      micBtn.style.display = 'none'; // เบราว์เซอร์นี้ไม่รองรับ ซ่อนปุ่มไปเลย กันสับสน
      return;
    }

    const recognition = new SpeechRecognitionAPI();
    recognition.lang = 'lo-LA'; // ลาวเป็นหลัก — ถ้าเบราว์เซอร์ไม่รองรับภาษาลาวจะ fallback เป็นค่าเริ่มต้นของอุปกรณ์เอง
    recognition.continuous = false;
    recognition.interimResults = false;
    let isListening = false;

    micBtn.addEventListener('click', () => {
      if (isListening) { recognition.stop(); return; }
      try {
        recognition.start();
        isListening = true;
        micBtn.textContent = '🔴';
        micStatus.textContent = '🎙️ กำลังฟัง... พูดคำสั่งได้เลย';
      } catch (e) {
        micStatus.textContent = 'ไม่สามารถเปิดไมโครโฟนได้ — ตรวจสอบว่าอนุญาตสิทธิ์ไมค์ให้เว็บนี้แล้วหรือยัง';
      }
    });

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      const input = document.getElementById('ai-agent-input');
      input.value = (input.value ? input.value + ' ' : '') + transcript;
      micStatus.textContent = '✅ รับเสียงแล้ว — ตรวจสอบข้อความก่อนกด "ส่งให้ AI ตีความ"';
    };

    recognition.onerror = (event) => {
      if (event.error === 'not-allowed' || event.error === 'permission-denied') {
        micStatus.textContent = '⚠️ ไม่ได้รับอนุญาตให้ใช้ไมโครโฟน — กรุณาอนุญาตสิทธิ์ไมค์ในเบราว์เซอร์แล้วลองใหม่';
      } else if (event.error === 'no-speech') {
        micStatus.textContent = '⚠️ ไม่ได้ยินเสียงพูด ลองใหม่อีกครั้ง';
      } else {
        micStatus.textContent = '⚠️ เกิดข้อผิดพลาด: ' + event.error;
      }
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.textContent = '🎤';
    };
  })();

        else resultBox.innerHTML = '<div style="background:#fff3e0; color:#e65100; padding:10px; border-radius:8px; font-size:13px;">🤔 ไม่เข้าใจคำสั่งนี้ — ตอนนี้รองรับ: รับเรื่องซ่อม, เพิ่มสินค้าใหม่, บันทึกรายจ่าย, เพิ่มลูกค้า, ขายสินค้า, ขายเครดิต, สร้างใบสั่งซื้อ, สร้างใบสั่งจอง</div>';
        aiPostRenderNote(res);
      })
      .withFailureHandler(err => { btn.disabled = false; onServerError(err); })
      .parseCommandWithAI(text);

  // ================================================================
  // ตัวแก้ไขรายการสินค้าแบบใช้ร่วมกัน (ขายปกติ / ขายเครดิต / ใบสั่งซื้อ)
  // AI แค่เสนอ "สินค้าที่ใกล้เคียง" ให้ — พนักงานต้องตรวจ/เลือก/แก้จำนวนและราคาเองก่อนยืนยันเสมอ
  // ================================================================
  const aiItemState = {};

  function aiEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function aiRound2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

  function aiItemsInit(prefix, items, mode, rate) {
    aiItemState[prefix] = {
      mode: mode, rate: rate || 1,
      rows: (items || []).map(it => {
        const cands = it.candidates || [];
        const aiPrice = Number(it.unitCost) || 0;
        return {
          hint: it.productNameHint || '', candidates: cands, sel: cands.length ? 0 : -1,
          qty: Number(it.qty) > 0 ? Number(it.qty) : 1,
          price: aiPrice > 0 ? aiPrice : 0, priceEdited: aiPrice > 0
        };
      })
    };
  }

  function aiRowDefaultPrice(st, row) {
    const c = row.candidates[row.sel];
    if (!c) return 0;
    return st.mode === 'po' ? aiRound2(c.cost * st.rate) : c.price;
  }

  function aiItemsGetValid(prefix) {
    const st = aiItemState[prefix];
    return st.rows.filter(r => r.sel >= 0 && r.qty > 0).map(r => {
      const c = r.candidates[r.sel];
      return { sku: c.sku, name: c.name, qty: r.qty, price: r.price };
    });
  }

  function aiItemsUpdateTotal(prefix) {
    const st = aiItemState[prefix];
    const valid = aiItemsGetValid(prefix);
    const total = aiRound2(valid.reduce((s, v) => s + v.qty * v.price, 0));
    const totalEl = document.getElementById(prefix + '-total');
    if (totalEl) totalEl.textContent = formatMoney(total);
    const btn = document.getElementById(prefix + '-confirm');
    if (btn && !btn.dataset.busy) {
      const ok = valid.length > 0 && (st.mode === 'po' ? valid.every(v => v.price > 0) : total > 0);
      btn.disabled = !ok;
    }
    return total;
  }

  function aiItemsRender(prefix) {
    const st = aiItemState[prefix];
    const box = document.getElementById(prefix + '-items');
    if (!box) return;
    st.rows.forEach(r => { if (!r.priceEdited) r.price = aiRowDefaultPrice(st, r); });
    if (st.rows.length === 0) {
      box.innerHTML = '<i style="font-size:12px;">ไม่มีรายการสินค้า — ลองพิมพ์คำสั่งใหม่ให้ระบุสินค้าและจำนวน</i>';
      aiItemsUpdateTotal(prefix);
      return;
    }
    const priceLabel = st.mode === 'po' ? 'ทุน/หน่วย' : 'ราคา/หน่วย';
    box.innerHTML = st.rows.map((r, idx) => {
      const c = r.candidates[r.sel];
      let head;
      if (r.candidates.length === 0) {
        head = '<div style="color:#c62828; font-size:12px;">⚠️ ไม่พบสินค้าที่ตรงกับ "' + aiEsc(r.hint) + '" — รายการนี้จะไม่ถูกรวมในบิล</div>';
      } else {
        const opts = r.candidates.map((cd, i) => '<option value="' + i + '"' + (i === r.sel ? ' selected' : '') + '>' + aiEsc(cd.name) + ' (คงเหลือ ' + cd.stock + ')</option>').join('');
        head = '<select data-ai-role="sel" data-idx="' + idx + '" style="margin:0 0 4px; width:100%;">' + opts + '</select>' +
          (r.candidates.length > 1 ? '<div style="font-size:11px; color:#e65100;">พบ ' + r.candidates.length + ' รายการที่ใกล้เคียง — เลือกให้ตรงตัวที่ต้องการ</div>' : '');
      }
      const stockWarn = (c && c.itemType !== 'บริการ' && st.mode !== 'po' && r.qty > c.stock)
        ? '<div style="font-size:11px; color:#e65100;">⚠️ เกินสต๊อกคงเหลือ (' + c.stock + ')</div>' : '';
      const controls = c
        ? '<div style="display:flex; gap:6px; align-items:center;">' +
            '<input type="number" data-ai-role="qty" data-idx="' + idx + '" value="' + r.qty + '" min="0.01" step="0.1" style="width:64px; margin:0;">' +
            '<span style="font-size:11px; white-space:nowrap;">' + priceLabel + '</span>' +
            '<input type="number" data-ai-role="price" data-idx="' + idx + '" value="' + r.price + '" min="0" step="0.01" style="flex:1; margin:0; min-width:0;">' +
            '<button type="button" data-ai-role="del" data-idx="' + idx + '" style="width:auto; padding:4px 8px; margin:0;">✕</button>' +
          '</div>'
        : '<button type="button" data-ai-role="del" data-idx="' + idx + '" style="width:auto; padding:4px 8px; margin:4px 0 0;">✕ ลบรายการนี้</button>';
      return '<div style="border-bottom:1px dashed var(--outline-variant); padding:6px 0;">' +
        '<div style="font-size:11px; color:var(--on-surface-variant);">พูดว่า: "' + aiEsc(r.hint) + '"</div>' + head + controls + stockWarn + '</div>';
    }).join('');

    box.querySelectorAll('[data-ai-role]').forEach(el => {
      const idx = Number(el.dataset.idx);
      const role = el.dataset.aiRole;
      if (role === 'sel') el.addEventListener('change', () => { st.rows[idx].sel = Number(el.value); st.rows[idx].priceEdited = false; aiItemsRender(prefix); });
      else if (role === 'qty') {
        el.addEventListener('input', () => { st.rows[idx].qty = Number(el.value) || 0; aiItemsUpdateTotal(prefix); });
        el.addEventListener('change', () => aiItemsRender(prefix));
      }
      else if (role === 'price') el.addEventListener('input', () => { st.rows[idx].price = Number(el.value) || 0; st.rows[idx].priceEdited = true; aiItemsUpdateTotal(prefix); });
      else if (role === 'del') el.addEventListener('click', () => { st.rows.splice(idx, 1); aiItemsRender(prefix); });
    });
    aiItemsUpdateTotal(prefix);
  }

  // หา/สร้างลูกค้าตอนกดยืนยันเท่านั้น (ไม่สร้างตอน AI แค่ตีความ) — done(customerOrNull, failed)
  function aiResolveCustomer(name, phone, done) {
    const fail = err => { onServerError(err); done(null, true); };
    if (phone && name) {
      google.script.run.withSuccessHandler(c => done(c || null, false)).withFailureHandler(fail).getOrCreateCustomerByPhone(name, phone);
    } else if (phone) {
      google.script.run.withSuccessHandler(c => done(c || null, false)).withFailureHandler(fail).findCustomerByPhone(phone);
    } else {
      done(null, false);
    }
  }

    aiItemsRender('aips');

    document.getElementById('aips-cancel').addEventListener('click', () => { resultBox.innerHTML = ''; document.getElementById('ai-agent-input').value = ''; });
    document.getElementById('aips-confirm').addEventListener('click', () => {
      const cart = aiItemsGetValid('aips');
      const total = aiRound2(cart.reduce((s, v) => s + v.qty * v.price, 0));
      if (cart.length === 0 || total <= 0) { showToast('ไม่มีรายการสินค้าที่ขายได้'); return; }
      const method = document.getElementById('aips-method').value;
      let payAmount = total;
      if (method === 'เงินสด') {
        const rec = Number(document.getElementById('aips-received').value) || 0;
        if (rec > 0) {
          if (rec < total - 0.01) { showToast('รับเงินมาน้อยกว่ายอดรวม (' + formatMoney(total) + ' บาท)'); return; }
          payAmount = rec;
        }
      }
      const name = document.getElementById('aips-cus-name').value.trim();
      const phone = document.getElementById('aips-cus-phone').value.trim();
      aiSetBusy('aips-confirm', true);
      aiResolveCustomer(name, phone, (customer, failed) => {
        if (failed) { aiSetBusy('aips-confirm', false); aiItemsUpdateTotal('aips'); return; }
        const payments = [{ method: method, currency: 'THB', amount: payAmount, exchangeRate: 1 }];
        google.script.run
          .withSuccessHandler(res => {
            if (res.success) {
              const pointsMsg = res.pointsEarned > 0 ? (' | ลูกค้าได้รับ ' + res.pointsEarned + ' แต้ม') : '';
              showToast('ขายสำเร็จ เลขที่บิล ' + res.billNumber + pointsMsg);
              aiResetCard(resultBox, '✅ ขายสำเร็จ เลขที่บิล ' + res.billNumber);
              document.getElementById('assistant-panel').style.display = 'none';
              showReceipt({
                billNumber: res.billNumber, date: new Date(), items: cart, total: total,
                payments: res.payments, changeTHB: res.changeTHB,
                customerName: customer ? customer.name : '', pointsEarned: res.pointsEarned
              });
              _productsNeedRefresh = true; allProducts = [];
              try { loadProductsForPOS(); } catch (e) {}
            } else {
              showToast(res.message || 'เกิดข้อผิดพลาด');
              aiSetBusy('aips-confirm', false); aiItemsUpdateTotal('aips');
            }
          })
          .withFailureHandler(err => { aiSetBusy('aips-confirm', false); aiItemsUpdateTotal('aips'); onServerError(err); })
          .recordSaleWithPayments(cart, payments, currentStaffName || 'พนักงาน', customer ? customer.id : '', currentStaffId || '', '');
      });
    });
  }
