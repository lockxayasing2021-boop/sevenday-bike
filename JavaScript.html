<script>

  let allProducts = [];
  let cart = [];
  let posSelectedCustomer = null;
  let exchangeRates = { LAK_PER_THB: 650, USD_PER_THB: 0.028, CNY_PER_THB: 0.2 };
  let rcSelectedProduct = null;
  let bcSelectedProduct = null;
  let currentStaffName = null;
  let currentStaffId = null;
  let currentStaffRole = null;
  let allRepairJobsCache = [];

  // ---------- ระบบล็อกอินพนักงาน ----------
  function loadStaffListForLogin() {
    google.script.run
      .withSuccessHandler(staffList => {
        const select = document.getElementById('login-staff-select');
        select.innerHTML = '<option value="">-- เลือกพนักงาน --</option>';
        staffList.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = s.name + (s.role ? ' (' + s.role + ')' : '');
          select.appendChild(opt);
        });
      })
      .withFailureHandler(err => {
        document.getElementById('login-error').textContent = 'โหลดรายชื่อพนักงานไม่สำเร็จ: ' + (err && err.message ? err.message : err);
      })
      .getActiveStaffList();
  }

  function showApp(staffName, staffId, staffRole, menuPermissions) {
    currentStaffName = staffName;
    currentStaffId = staffId;
    currentStaffRole = staffRole;
    document.getElementById('topbar-staff-name').textContent = staffName;
    document.getElementById('topbar-staff-role').textContent = staffRole || '-';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'flex';

    if (menuPermissions) {
      applyMenuPermissions(menuPermissions);
    } else {
      google.script.run
        .withSuccessHandler(perms => applyMenuPermissions(perms))
        .withFailureHandler(() => {})
        .getMenuPermissions(staffId);
    }

    // โหลด Dashboard พร้อมกับ preload ข้อมูลพื้นฐาน (สินค้า+ตั้งค่า+อัตราแลก) ใน 1 call เดียว
    // ทำให้หน้า POS และ Inventory เปิดทันทีโดยไม่ต้องรอ server อีกรอบ
    loadDashboard();
    preloadInitialData();
    startPermissionSync(staffId);
  }

  // ดึงสิทธิ์ "สดใหม่" จากเซิร์ฟเวอร์ซ้ำทุก 45 วิ — กันปัญหา session login ค้างไว้นาน
  // แล้วผู้จัดการเพิ่งไปแก้สิทธิ์ทีหลัง (เดิมสิทธิ์จะอัปเดตแค่ตอน login ครั้งแรกเท่านั้น)
  let _permissionSyncInterval = null;
  function startPermissionSync(staffId) {
    if (_permissionSyncInterval) clearInterval(_permissionSyncInterval);
    _permissionSyncInterval = setInterval(() => {
      google.script.run
        .withSuccessHandler(perms => applyMenuPermissions(perms))
        .withFailureHandler(() => {})
        .getMenuPermissions(staffId);
    }, 45000);
  }

  // โหลดข้อมูลพื้นฐานทั้งหมดในครั้งเดียวหลัง login — เก็บไว้ใน memory
  // ทุกหน้าที่เปิดต่อมาจะใช้ข้อมูลจาก memory แทน server (เร็วขึ้น ~3-4 วินาทีต่อการสลับหน้า)
  function preloadInitialData() {
    google.script.run
      .withSuccessHandler(data => {
        if (data.products && data.products.length > 0) {
          allProducts = data.products;
          allProductsCache = data.products;
        }
        if (data.rates) {
          exchangeRates.LAK_PER_THB = Number(data.rates.LAK_PER_THB) || 650;
          exchangeRates.USD_PER_THB = Number(data.rates.USD_PER_THB) || 0.028;
          exchangeRates.CNY_PER_THB = Number(data.rates.CNY_PER_THB) || 0.2;
          window._exchangeRates = { ...data.rates };
          if (data.rates.LAK_PER_THB) document.getElementById('rate-lak').value = data.rates.LAK_PER_THB;
          if (data.rates.USD_PER_THB) document.getElementById('rate-usd').value = data.rates.USD_PER_THB;
        }
        if (data.settings) {
          const s = data.settings; // shape จริงจาก getShopSettings(): {name, address, phone, thankYou, logo, receiptSize}
          if (document.getElementById('shop-name'))     document.getElementById('shop-name').value     = s.name || '';
          if (document.getElementById('shop-address'))  document.getElementById('shop-address').value  = s.address || '';
          if (document.getElementById('shop-phone'))    document.getElementById('shop-phone').value    = s.phone || '';
          if (document.getElementById('shop-thankyou')) document.getElementById('shop-thankyou').value = s.thankYou || '';
          window._shopSettings = s;
        }
      })
      .withFailureHandler(() => {}) // ล้มเหลวก็ไม่เป็นไร แต่ละหน้าจะ fallback โหลดของตัวเอง
      .getInitialData();
  }

  // ซ่อนเมนูที่ staff คนนี้ไม่มีสิทธิ์เข้า และถ้าหน้าที่ active อยู่ไม่มีสิทธิ์ ให้สลับไป Dashboard แทน
  function applyMenuPermissions(allowedPages) {
    let activePageWasHidden = false;
    document.querySelectorAll('.menu li').forEach(li => {
      const page = li.dataset.page;
      const allowed = allowedPages.includes(page);
      li.style.display = allowed ? '' : 'none';
      if (!allowed && li.classList.contains('active')) activePageWasHidden = true;
    });
    if (activePageWasHidden) {
      document.querySelectorAll('.menu li').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
      document.querySelector('.menu li[data-page="dashboard"]').classList.add('active');
      document.getElementById('page-dashboard').classList.add('active');
    }
  }

  function showLoginScreen() {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('main-app').style.display = 'none';
    document.getElementById('login-pin').value = '';
    document.getElementById('login-error').textContent = '';
    loadStaffListForLogin();
  }

  document.getElementById('login-btn').addEventListener('click', () => {
    const staffId = document.getElementById('login-staff-select').value;
    const pin = document.getElementById('login-pin').value;
    const errorEl = document.getElementById('login-error');
    if (!staffId) { errorEl.textContent = 'กรุณาเลือกชื่อพนักงาน'; return; }
    if (!pin) { errorEl.textContent = 'กรุณากรอก PIN'; return; }

    google.script.run
      .withSuccessHandler(res => {
        if (res.success) {
          try { localStorage.setItem('sevenday_staff', JSON.stringify({ id: res.staffId, name: res.name, role: res.role, menuPermissions: res.menuPermissions })); } catch (e) {}
          showApp(res.name, res.staffId, res.role, res.menuPermissions);
        } else {
          errorEl.textContent = res.message;
        }
      })
      .withFailureHandler(err => { errorEl.textContent = 'เกิดข้อผิดพลาด: ' + (err && err.message ? err.message : err); })
      .staffLogin(staffId, pin);
  });

  document.getElementById('login-pin').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.keyCode === 13) document.getElementById('login-btn').click();
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    try { localStorage.removeItem('sevenday_staff'); } catch (e) {}
    if (_permissionSyncInterval) { clearInterval(_permissionSyncInterval); _permissionSyncInterval = null; }
    currentStaffName = null;
    currentStaffId = null;
    currentStaffRole = null;
    showLoginScreen();
  });

  // ---------- เมนูบัญชีผู้ใช้มุมขวาบน (ตั้งค่า/ออกจากระบบ) ----------
  document.getElementById('topbar-user-toggle').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('topbar-user-dropdown').classList.toggle('active');
  });
  document.addEventListener('click', () => {
    document.getElementById('topbar-user-dropdown').classList.remove('active');
  });
  document.getElementById('topbar-btn-settings').addEventListener('click', () => {
    document.getElementById('topbar-user-dropdown').classList.remove('active');
    document.querySelector('.menu li[data-page="settings"]').click();
  });

  function checkExistingSession() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('sevenday_staff') || 'null'); } catch (e) {}
    if (saved && saved.id && saved.name) {
      // ไม่ใช้ menuPermissions ที่ cache ไว้เก่า (อาจตกยุคถ้าระบบเพิ่มเมนูใหม่ทีหลัง)
      // ให้ showApp ไปขอสิทธิ์ล่าสุดจากเซิร์ฟเวอร์เสมอทุกครั้งที่เปิดหน้าเว็บ
      showApp(saved.name, saved.id, saved.role, null);
    } else {
      showLoginScreen();
    }
  }

  // ---------- ตัวสร้างบาร์โค้ด Code 39 (ฝังในตัว ไม่ต้องพึ่ง CDN ภายนอก) ----------
  const CODE39_TABLE = {
    '0':'000110100','1':'100100001','2':'001100001','3':'101100000',
    '4':'000110001','5':'100110000','6':'001110000','7':'000100101',
    '8':'100100100','9':'001100100','A':'100001001','B':'001001001',
    'C':'101001000','D':'000011001','E':'100011000','F':'001011000',
    'G':'000001101','H':'100001100','I':'001001100','J':'000011100',
    'K':'100000011','L':'001000011','M':'101000010','N':'000010011',
    'O':'100010010','P':'001010010','Q':'000000111','R':'100000110',
    'S':'001000110','T':'000010110','U':'110000001','V':'011000001',
    'W':'111000000','X':'010010001','Y':'110010000','Z':'011010000',
    '-':'010000101','.':'110000100',' ':'011000100','$':'010101000',
    '/':'010100010','+':'010001010','%':'000101010','*':'010010100'
  };

  // แปลงข้อความให้เหลือเฉพาะตัวอักษรที่ Code 39 รองรับ (A-Z, 0-9, บางสัญลักษณ์)
  function sanitizeForCode39(text) {
    const upper = String(text).toUpperCase();
    let clean = '';
    let hadInvalid = false;
    for (const ch of upper) {
      if (CODE39_TABLE[ch]) {
        clean += ch;
      } else {
        hadInvalid = true;
      }
    }
    return { clean: clean || '0', hadInvalid };
  }

  function renderCode39(svgEl, rawText, opts) {
    opts = opts || {};
    const narrow = opts.narrow || 2;
    const wide = narrow * 2.5;
    const barHeight = opts.height || 50;
    const { clean, hadInvalid } = sanitizeForCode39(rawText);
    const sequence = ('*' + clean + '*').split('');

    let x = 0;
    const rects = [];
    sequence.forEach((ch, idx) => {
      const pattern = CODE39_TABLE[ch];
      for (let i = 0; i < 9; i++) {
        const isBar = i % 2 === 0; // ตำแหน่งคู่ = แท่ง, คี่ = ช่องว่าง
        const w = pattern[i] === '1' ? wide : narrow;
        if (isBar) rects.push({ x: x, w: w });
        x += w;
      }
      if (idx < sequence.length - 1) x += narrow; // ช่องว่างระหว่างตัวอักษร
    });

    const totalWidth = x;
    const textHeight = 16;
    const svgHeight = barHeight + textHeight;

    while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);
    svgEl.setAttribute('width', totalWidth);
    svgEl.setAttribute('height', svgHeight);
    svgEl.setAttribute('viewBox', `0 0 ${totalWidth} ${svgHeight}`);

    rects.forEach(r => {
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', r.x);
      rect.setAttribute('y', 0);
      rect.setAttribute('width', r.w);
      rect.setAttribute('height', barHeight);
      rect.setAttribute('fill', '#000');
      svgEl.appendChild(rect);
    });

    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', totalWidth / 2);
    label.setAttribute('y', barHeight + 12);
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('font-size', '12');
    label.setAttribute('font-family', 'monospace');
    label.setAttribute('font-weight', '700'); // Barcode Number ใต้โค้ด: Bold ชัด (ไม่กระทบแท่งบาร์โค้ดด้านบนซึ่งเป็นคนละ element)
    label.setAttribute('fill', '#000000'); // สีดำเข้มเสมอ ไม่ใช้สีเทา/Light เพื่อความคมชัดบน Thermal Printer
    label.textContent = clean;
    svgEl.appendChild(label);

    return { hadInvalid: hadInvalid, encodedValue: clean };
  }

  // ---------- นำทางเมนู ----------
  document.querySelectorAll('.menu li').forEach(li => {
    li.addEventListener('click', () => {
      document.querySelectorAll('.menu li').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
      li.classList.add('active');
      document.getElementById('page-' + li.dataset.page).classList.add('active');

      if (li.dataset.page === 'dashboard') loadDashboard();
      if (li.dataset.page === 'pos') loadProductsForPOS();
      if (li.dataset.page === 'repairs') { loadRepairJobs(); rqOnRepairsOpen(); }
      if (li.dataset.page === 'inventory') loadInventoryPage();
      if (li.dataset.page === 'sale') loadSalePage();
      if (li.dataset.page === 'customers') loadCustomersTable();
      if (li.dataset.page === 'staff') loadStaffTable();
      if (li.dataset.page === 'ar') loadARPage();
      if (li.dataset.page === 'purchase') loadPurchasePage();
      if (li.dataset.page === 'finance') loadFinancePage();
      if (li.dataset.page === 'settings') { loadExchangeRatesForm(); loadLoyaltySettingsForm(); loadSystemInfo(); loadShopSettingsForm(); loadAISettingsForm(); uiUpdateTranslateStatus(); }

      closeSidebar(); // ปิดเมนูอัตโนมัติหลังเลือกหน้า (สำคัญบนมือถือ)
    });
  });

  // ---------- เมนูแบบเลื่อนเปิด-ปิด (มือถือ) ----------
  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebar-overlay').classList.add('active');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('active');
  }
  document.getElementById('hamburger-btn').addEventListener('click', openSidebar);
  document.getElementById('sidebar-overlay').addEventListener('click', closeSidebar);

  // ---------- สแกนบาร์โค้ด/QR ด้วยกล้อง ----------
  let scannerStream = null;
  let scannerLoopId = null;
  let scannerTargetInputId = null;

  async function openScanner(targetInputId) {
    scannerTargetInputId = targetInputId;
    document.getElementById('modal-scanner').classList.add('active');
    const statusEl = document.getElementById('scanner-status');
    const video = document.getElementById('scanner-video');
    statusEl.textContent = 'กำลังเปิดกล้อง...';

    if (!('BarcodeDetector' in window)) {
      statusEl.textContent = '⚠️ เบราว์เซอร์นี้ไม่รองรับการสแกนอัตโนมัติ กรุณาพิมพ์รหัสสินค้าแทน หรือใช้เครื่องสแกนบาร์โค้ดต่อ USB/Bluetooth';
      return;
    }

    try {
      scannerStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }
      });
      video.srcObject = scannerStream;
      statusEl.textContent = 'เล็งกล้องไปที่บาร์โค้ดหรือ QR Code';

      const detector = new BarcodeDetector({
        formats: ['qr_code', 'code_128', 'code_39', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf', 'codabar']
      });

      const scanLoop = async () => {
        if (!scannerStream) return; // หยุดสแกนแล้ว
        try {
          const results = await detector.detect(video);
          if (results.length > 0) {
            const code = results[0].rawValue;
            closeScanner();
            const input = document.getElementById(scannerTargetInputId);
            input.value = code;
            input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
            showToast('สแกนสำเร็จ: ' + code);
            return;
          }
        } catch (err) {
          // เฟรมบางเฟรมอาจ detect ไม่ได้ ข้ามไปเฟรมถัดไปได้เลย ไม่ต้องหยุด
        }
        scannerLoopId = requestAnimationFrame(scanLoop);
      };
      scanLoop();
    } catch (err) {
      statusEl.textContent = '⚠️ เปิดกล้องไม่ได้: ' + (err.message || err) + ' (ตรวจสอบว่าอนุญาตให้เว็บไซต์ใช้กล้องแล้ว)';
    }
  }

  function closeScanner() {
    document.getElementById('modal-scanner').classList.remove('active');
    if (scannerLoopId) {
      cancelAnimationFrame(scannerLoopId);
      scannerLoopId = null;
    }
    if (scannerStream) {
      scannerStream.getTracks().forEach(track => track.stop());
      scannerStream = null;
    }
  }

  document.getElementById('scanner-cancel').addEventListener('click', closeScanner);

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  // แสดง error จริงจากฝั่งเซิร์ฟเวอร์ แทนที่จะเงียบเฉยเมื่อมีปัญหา
  function onServerError(err) {
    console.error(err);
    showToast('เกิดข้อผิดพลาด: ' + (err && err.message ? err.message : err));
  }

  function formatMoney(n) {
    return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // ใช้แสดงอัตราแลกเปลี่ยน (ต่างจาก formatMoney ตรงที่ไม่ปัดทศนิยมทิ้ง เช่น USD rate 0.031 จะไม่ถูกปัดเหลือ 0.03)
  function formatRate(n) {
    return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
  }

  function formatDate(d) {
    if (!d) return '-';
    // เซิร์ฟเวอร์ส่งวันที่มาเป็น string รูปแบบ dd/MM/yyyy HH:mm อยู่แล้ว (กันปัญหา Date serialize พัง) ใช้ตรงๆ ได้เลย
    // แสดงเป็นปฏิทินแบบอังกฤษ (ค.ศ. + ชื่อเดือนอังกฤษ) เช่น 13 Oct 2026 14:30
    const M3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const m = typeof d === 'string' && d.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{1,2}:\d{2}))?/);
    if (m) return (+m[1]) + ' ' + M3[+m[2] - 1] + ' ' + m[3] + (m[4] ? ' ' + m[4] : '');
    const x = new Date(d);
    if (isNaN(x)) return String(d);
    return x.getDate() + ' ' + M3[x.getMonth()] + ' ' + x.getFullYear() + ' ' + String(x.getHours()).padStart(2, '0') + ':' + String(x.getMinutes()).padStart(2, '0');
  }

  // ---------- Dashboard ----------
  function updateDashboardDateTime() {
    const dateEl = document.getElementById('dash-current-date');
    const timeEl = document.getElementById('dash-current-time');
    const now = new Date();
    if (dateEl) dateEl.textContent = now.toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });   // ปฏิทินแบบอังกฤษ
    if (timeEl) timeEl.textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  // ================================================================
  // Dashboard — รวม 4 calls → 1 call (getDashboardData batch function)
  // ================================================================
  function loadDashboard() {
    updateDashboardDateTime();

    document.getElementById('dash-low-stock-list').innerHTML = '<div class="empty-hint" style="color:var(--outline);">กำลังโหลด...</div>';
    document.getElementById('dash-pending-list').innerHTML   = '<div class="empty-hint" style="color:var(--outline);">กำลังโหลด...</div>';

    google.script.run
      .withSuccessHandler(data => {
        // Stats cards
        const s = data.stats || {};
        document.getElementById('stat-today-sales').textContent    = formatMoney(s.todaySales || 0);
        document.getElementById('stat-today-bills').textContent    = s.todayBills || 0;
        document.getElementById('stat-month-sales').textContent    = formatMoney(s.monthSales || 0);
        document.getElementById('stat-low-stock').textContent      = s.lowStockCount || 0;
        document.getElementById('stat-total-products').textContent = s.totalProducts || 0;

        // Low stock list (ใช้ data.lowStock จาก batch แทนการเรียก getProducts ซ้ำ)
        const box = document.getElementById('dash-low-stock-list');
        const lowStock = (data.lowStock || []).slice(0, 5);
        box.innerHTML = lowStock.length === 0
          ? '<div class="empty-hint">ไม่มีสินค้าใกล้หมดตอนนี้ 👍</div>'
          : lowStock.map(p => `
              <div class="alert-item">
                <div class="alert-item-icon"><span class="material-symbols-outlined">inventory_2</span></div>
                <div><div class="alert-item-name">${p.name}</div><div class="alert-item-sub">SKU: ${p.sku}</div></div>
                <div class="alert-item-right">${p.stock} ${p.unit}<div class="sub">คงเหลือ</div></div>
              </div>`).join('');

        // Pending actions (ใช้ data.pending จาก batch)
        const pending = data.pending || {};
        renderDashboardPending(pending.repairs || [], pending.purchases || []);
      })
      .withFailureHandler(onServerError)
      .getDashboardData(); // <-- batch: 1 call แทน 4
  }

  function renderDashboardPending(repairs, purchases) {
    const box = document.getElementById('dash-pending-list');
    const items = [];

    repairs.forEach(r => {
      items.push({
        dotColor: r.status === 'รออะไหล่' ? 'var(--error)' : 'var(--tertiary)',
        title: 'งานซ่อม ' + r.jobId + ' — ' + r.customerName,
        sub: r.problem,
        tag: r.status
      });
    });
    purchases.forEach(p => {
      items.push({
        dotColor: 'var(--secondary)',
        title: 'ใบสั่งซื้อ ' + p.purchaseId + ' — ' + p.supplierName,
        sub: 'คาดว่าจะถึง: ' + (p.expectedDate || '-'),
        tag: p.status
      });
    });

    if (items.length === 0) {

  // ย่อขนาดรูปก่อนแปลงเป็น base64 กันไฟล์ใหญ่เกินไปสำหรับเก็บใน Google Sheets
  function resizeImageToBase64(file, maxSize, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxSize) { h = h * (maxSize / w); w = maxSize; }
        else if (h > maxSize) { w = w * (maxSize / h); h = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function addToCart(product) {
    const existing = cart.find(i => i.sku === product.sku);
    if (existing) {

  function renderCart() {
    const container = document.getElementById('cart-items');
    container.innerHTML = '';
    let total = 0;
    cart.forEach((item, idx) => {
      total += item.qty * item.price;
      const div = document.createElement('div');

      if (item.isTradeIn) {
        div.className = 'cart-line cart-line-editable';
        div.innerHTML = `
          <div class="cart-line-top">
            <span class="cart-line-name" style="color:#1e7e34;">🔄 ${item.name}</span>
            <button onclick="removeFromCart(${idx})" class="cart-line-remove">✕</button>
          </div>
          <div class="cart-line-bottom">
            <span class="cart-line-subtotal" style="color:#1e7e34; margin-left:auto;">${formatMoney(item.qty * item.price)}</span>
          </div>`;
        container.appendChild(div);
        return;
      }

      const isDiscounted = Number(item.price) !== Number(item.originalPrice);
      div.className = 'cart-line cart-line-editable';
      div.innerHTML = `
        <div class="cart-line-top">
          <span class="cart-line-name">${item.name}</span>
          <button onclick="removeFromCart(${idx})" class="cart-line-remove">✕</button>
        </div>
        <div class="cart-line-bottom" style="flex-wrap:wrap; gap:6px;">
          <input type="number" class="cart-qty-input" value="${item.qty}" min="0.01" step="0.1" style="width:60px;text-align:center;padding:4px;"
            onchange="updateCartQty(${idx}, this.value)">
          <span class="cart-line-price-label">ราคา/หน่วย:</span>
          <input type="number" class="cart-price-input" value="${item.price}" min="0" step="0.01"
            onchange="updateCartPrice(${idx}, this.value)">
          ${isDiscounted ? `<span class="cart-original-price">เดิม ${formatMoney(item.originalPrice)}</span>` : ''}
          <span class="cart-line-subtotal">${formatMoney(item.qty * item.price)}</span>
        </div>`;
      container.appendChild(div);
    });
    document.getElementById('cart-total-amount').textContent = formatMoney(total);
    updatePaymentSummary();
  }

  function updateCartQty(idx, newQty) {
    const qty = Number(newQty); // รองรับจำนวนเป็นทศนิยม เช่น 0.5, 1.3 (สินค้าบางอย่างขายเป็นเศษได้ เช่น วัสดุตัดตามความยาว)
    if (isNaN(qty) || qty <= 0) {
      // จำนวนเป็น 0 หรือติดลบ หรือกรอกค่าไม่ถูกต้อง — ถามว่าจะลบรายการนี้เลยไหม
      if (confirm('จำนวนต้องมากกว่า 0 — ต้องการลบรายการนี้ออกจากตะกร้าเลยไหม?')) {
        removeFromCart(idx);
      } else {
        renderCart(); // คืนค่าเดิม ไม่เปลี่ยนแปลง
      }
      return;
    }
    cart[idx].qty = qty;
    renderCart();
  }

  function updateCartPrice(idx, newPrice) {
    const price = Number(newPrice);
    if (isNaN(price) || price < 0) {
      showToast('กรุณากรอกราคาที่ถูกต้อง');
      renderCart();
      return;
    }
    cart[idx].price = price;
    renderCart();
  }

  function removeFromCart(idx) {
    cart.splice(idx, 1);
    renderCart();
  }

  // ================================================================
  // Multi-Payment / Multi-Currency (หน้า POS)
  // ================================================================
  let posPayments = []; // [{ method, currency, amount }]

  function cartTotalTHB() {
    return cart.reduce((s, i) => s + i.qty * i.price, 0);
  }

  // แปลงจำนวนเงินสกุลใดๆ เป็นบาท ด้วยอัตราแลกเปลี่ยนปัจจุบันที่โหลดไว้ (rate = หน่วยสกุลนั้นต่อ 1 บาท)
  function paymentAmountToTHB(currency, amount) {
    const amt = Number(amount) || 0;
    if (currency === 'THB') return amt;
    if (currency === 'LAK') return amt / exchangeRates.LAK_PER_THB;
    if (currency === 'USD') return amt / exchangeRates.USD_PER_THB;
    return amt;
  }

  function currencyRateFor(currency) {
    if (currency === 'LAK') return exchangeRates.LAK_PER_THB;
    if (currency === 'USD') return exchangeRates.USD_PER_THB;
    return 1;
  }

  function paidTotalTHB() {
    return posPayments.reduce((s, p) => s + paymentAmountToTHB(p.currency, p.amount), 0);
  }

  function addPaymentRow() {
    const remainingTHB = Math.max(0, cartTotalTHB() - paidTotalTHB());
    posPayments.push({ method: 'เงินสด', currency: 'THB', amount: remainingTHB > 0 ? Number(remainingTHB.toFixed(2)) : 0 });
    renderPaymentRows();
  }
  document.getElementById('btn-add-payment').addEventListener('click', addPaymentRow);

  function removePaymentRow(idx) {
    posPayments.splice(idx, 1);
    renderPaymentRows();
  }

  function updatePaymentRowField(idx, field, value) {
    posPayments[idx][field] = field === 'amount' ? value : value; // เก็บ string ไว้ก่อน แปลงเลขตอนคำนวณ
    updatePaymentSummary();
    // อัปเดตแค่บรรทัดตัวเลขแปลงสกุลของแถวนั้น ไม่ re-render ทั้งหมดกันช่อง input เสีย focus ตอนพิมพ์
    const convertedEl = document.getElementById('pay-converted-' + idx);
    if (convertedEl) {
      const p = posPayments[idx];
      convertedEl.textContent = p.currency === 'THB' ? '' : ('≈ ' + formatMoney(paymentAmountToTHB(p.currency, p.amount)) + ' บาท (อัตรา 1 บาท = ' + formatRate(currencyRateFor(p.currency)) + ' ' + p.currency + ')');
    }
  }

  // เปลี่ยนสกุลเงินของแถวนี้ + คำนวณจำนวนเงินที่ต้องจ่ายในสกุลใหม่ให้อัตโนมัติ (พอดีกับยอดคงเหลือ)
  // กันแคชเชียร์ต้องคิดเลขเอง และกันจ่ายเกินจนต้องทอนเงินข้ามสกุล (ปัดขึ้นเล็กน้อยเผื่อเศษ ให้ยอดคงเหลือเป็น 0 พอดีเสมอ)
  function updatePaymentRowCurrency(idx, newCurrency) {
    posPayments[idx].currency = newCurrency;

    // ยอดคงเหลือที่ต้องจ่าย "ไม่นับเงินในแถวนี้เอง" (เผื่อมีหลายแถวคนละสกุลอยู่แล้ว) แล้วค่อยแปลงเป็นสกุลใหม่
    const totalTHB = cartTotalTHB();
    const paidByOtherRowsTHB = posPayments.reduce((sum, p, i) => i === idx ? sum : sum + paymentAmountToTHB(p.currency, p.amount), 0);
    const remainingTHB = Math.max(0, totalTHB - paidByOtherRowsTHB);

    let newAmount;
    if (newCurrency === 'THB') {
      newAmount = Number(remainingTHB.toFixed(2));
    } else {
      const rate = currencyRateFor(newCurrency); // หน่วยสกุลนั้นต่อ 1 บาท
      const converted = remainingTHB * rate;
      // ปัดขึ้นเสมอ (ไม่ปัดลง) กันจ่ายขาดแม้เศษเล็กน้อย ทำให้ยอดคงเหลือไม่มีวันติดลบ/ค้างจนกดชำระเงินไม่ได้
      newAmount = newCurrency === 'LAK' ? Math.ceil(converted) : Math.ceil(converted * 100) / 100;
    }
    posPayments[idx].amount = newAmount;
    renderPaymentRows();
  }

  function renderPaymentRows() {
    const box = document.getElementById('payment-rows');
    box.innerHTML = '';
    posPayments.forEach((p, idx) => {
      const row = document.createElement('div');
      row.className = 'pay-row';
      row.innerHTML = `
        <select onchange="updatePaymentRowField(${idx}, 'method', this.value)">
          <option value="เงินสด" ${p.method === 'เงินสด' ? 'selected' : ''}>เงินสด</option>
          <option value="โอนเงิน" ${p.method === 'โอนเงิน' ? 'selected' : ''}>โอนเงิน</option>
          <option value="บัตรเครดิต" ${p.method === 'บัตรเครดิต' ? 'selected' : ''}>บัตรเครดิต</option>
        </select>
        <select onchange="updatePaymentRowCurrency(${idx}, this.value)">
          <option value="THB" ${p.currency === 'THB' ? 'selected' : ''}>THB</option>
          <option value="LAK" ${p.currency === 'LAK' ? 'selected' : ''}>LAK</option>
          <option value="USD" ${p.currency === 'USD' ? 'selected' : ''}>USD</option>
        </select>
        <input type="number" class="pay-amount-input" value="${p.amount}" min="0" step="0.01"
          oninput="updatePaymentRowField(${idx}, 'amount', this.value)">
        <button type="button" class="pay-remove-btn" onclick="removePaymentRow(${idx})">✕</button>
        <div class="pay-converted" id="pay-converted-${idx}">${p.currency === 'THB' ? '' : ('≈ ' + formatMoney(paymentAmountToTHB(p.currency, p.amount)) + ' บาท (อัตรา 1 บาท = ' + formatRate(currencyRateFor(p.currency)) + ' ' + p.currency + ')')}</div>`;
      box.appendChild(row);
    });
    updatePaymentSummary();
  }

  function updatePaymentSummary() {
    const total = cartTotalTHB();
    const paid = paidTotalTHB();
    const remaining = Math.max(0, total - paid);
    const cashPaid = posPayments.filter(p => p.method === 'เงินสด').reduce((s, p) => s + paymentAmountToTHB(p.currency, p.amount), 0);
    const overpaid = Math.max(0, paid - total);
    const change = Math.min(overpaid, cashPaid);

    document.getElementById('pay-sum-total').textContent = formatMoney(total) + ' บาท';
    document.getElementById('pay-sum-paid').textContent = formatMoney(paid) + ' บาท';
    const remainingEl = document.getElementById('pay-sum-remaining');
    remainingEl.textContent = formatMoney(remaining) + ' บาท';
    remainingEl.parentElement.classList.toggle('zero', remaining <= 0.01);

    const changeRow = document.getElementById('pay-sum-change-row');
    if (overpaid > 0.01) {
      changeRow.style.display = 'flex';
      document.getElementById('pay-sum-change').textContent = formatMoney(change) + ' บาท';
    } else {
      changeRow.style.display = 'none';
    }

    // เปิดปุ่มชำระเงินได้ก็ต่อเมื่อจ่ายครบยอด (คงเหลือ <= เศษปัดเงิน) และมีตะกร้าสินค้า
    const checkoutBtn = document.getElementById('btn-checkout');
    checkoutBtn.disabled = !(cart.length > 0 && remaining <= 0.01 && posPayments.length > 0);
  }

  function resetPosPayments() {
    posPayments = [];
    const total = cartTotalTHB();
    posPayments.push({ method: 'เงินสด', currency: 'THB', amount: total > 0 ? Number(total.toFixed(2)) : 0 });
    renderPaymentRows();
  }

      return;
    }

    const totalTHB = cartTotalTHB();

    const cartSnapshot = cart.map(i => ({ ...i }));
    const customerNameSnapshot = posSelectedCustomer ? posSelectedCustomer.name : '';
    const paymentsPayload = posPayments.map(p => ({
      method: p.method, currency: p.currency, amount: Number(p.amount) || 0, exchangeRate: currencyRateFor(p.currency)
    }));

            billNumber: res.billNumber,

            total: totalTHB,

            changeTHB: res.changeTHB,

  function showReceipt(sale) {

    google.script.run
      .withSuccessHandler(shop => {
        const logoEl = document.getElementById('rcpt-logo');
        if (shop.logo) {
          logoEl.src = shop.logo;
          logoEl.style.display = 'inline-block';
        } else {
          logoEl.style.display = 'none';
        }

        document.getElementById('rcpt-shop-name').textContent = shop.name;
        document.getElementById('rcpt-shop-address').textContent = shop.address;
        document.getElementById('rcpt-shop-phone').textContent = shop.phone ? (T.rcpt_tel + ' ' + shop.phone) : '';
        document.getElementById('rcpt-bill-number').textContent = sale.billNumber;
        const rcptBarcodeEl = document.getElementById('rcpt-barcode');
        if (rcptBarcodeEl) renderCode39(rcptBarcodeEl, sale.billNumber, { height: 36, narrow: 1.5 });
        document.getElementById('rcpt-date').textContent = formatDate(sale.date);
        document.getElementById('rcpt-customer').textContent = sale.customerName || T.rcpt_walkin_customer;

        const tbody = document.querySelector('#rcpt-items tbody');
        tbody.innerHTML = '';
        sale.items.forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td class="ri-name">${item.name}</td><td class="ri-qty">x${item.qty}</td><td class="ri-amount">${formatMoney(item.qty * item.price)}</td>`;
          tbody.appendChild(tr);
        });

        document.getElementById('rcpt-total').textContent = formatMoney(sale.total);

        // ใบเสร็จลูกค้า: แสดงเฉพาะ "จำนวนเงินที่จ่ายจริง" แยกตามสกุลเงิน ห้ามโชว์วิธีชำระ/อัตราแลกเปลี่ยน/ยอดแปลงสกุล/ยอดคงเหลือ
        const paymentByCurrency = {};
        (sale.payments || []).forEach(p => {
          paymentByCurrency[p.currency] = (paymentByCurrency[p.currency] || 0) + Number(p.amount);
        });
        const paymentLines = Object.keys(paymentByCurrency)
          .map(cur => formatMoney(paymentByCurrency[cur]) + ' ' + cur)
          .join('<br>');
        document.getElementById('rcpt-payment').innerHTML = T.rcpt_payment_label + '<br>' + paymentLines;

        const changeEl = document.getElementById('rcpt-change');
        if (sale.changeTHB > 0.01) {
          changeEl.style.display = 'block';
          changeEl.textContent = T.rcpt_change + ' ' + formatMoney(sale.changeTHB) + ' ' + T.pos_baht_thb2;
        } else {
          changeEl.style.display = 'none';
        }

        const pointsEl = document.getElementById('rcpt-points');
        if (sale.pointsEarned > 0) {
          pointsEl.style.display = 'block';
          pointsEl.textContent = T.rcpt_points_earned + ' ' + sale.pointsEarned + ' ' + T.rcpt_points_unit;
        } else {
          pointsEl.style.display = 'none';
        }

        document.getElementById('rcpt-thankyou').textContent = shop.thankYou;

        const sizeSelect = document.getElementById('rcpt-size-select');
        sizeSelect.value = shop.receiptSize || '80';
        applyReceiptSize(sizeSelect.value);

        document.getElementById('modal-receipt').classList.add('active');
      })
      .withFailureHandler(onServerError)
      .getShopSettings();
  }

            const box = document.getElementById('rc-selected');
            box.style.display = 'block';
            box.textContent = product.name + ' (SKU: ' + product.sku + ') | คงเหลือปัจจุบัน: ' + product.stock + ' ' + product.unit;
            document.getElementById('rc-item-cost').value = product.cost || '';
          } else {
            showToast('ไม่พบสินค้ารหัส/บาร์โค้ด: ' + code);
          }
        })
        .withFailureHandler(onServerError)
        .findProductOrVariantByCode(code); // รองรับ Variant ด้วย (InventoryV3)
    }
  });

  document.getElementById('rc-add-item').addEventListener('click', () => {
    if (!rcSelectedProduct) { showToast('กรุณาค้นหาและเลือกสินค้าก่อน'); return; }
    const qty = Number(document.getElementById('rc-item-qty').value);
    const costInput = document.getElementById('rc-item-cost').value;
    if (!qty || qty <= 0) { showToast('กรุณากรอกจำนวนให้ถูกต้อง'); return; }

    rcCart.push({
      sku: rcSelectedProduct.sku, name: rcSelectedProduct.name, qty: qty,
      cost: costInput === '' ? rcSelectedProduct.cost : Number(costInput)
    });
    renderRcItemsTable();

    document.getElementById('rc-search').value = '';
    document.getElementById('rc-selected').style.display = 'none';
    document.getElementById('rc-item-qty').value = '1';
    document.getElementById('rc-item-cost').value = '';
    rcSelectedProduct = null;
  });

  function renderRcItemsTable() {
    const tbody = document.querySelector('#rc-items-table tbody');
    tbody.innerHTML = '';
    let total = 0;
    rcCart.forEach((item, idx) => {
      const lineTotal = item.qty * item.cost;
      total += lineTotal;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${item.name}</td><td>${item.qty}</td><td>${formatMoney(item.cost)}</td><td>${formatMoney(lineTotal)}</td>
        <td><button onclick="removeRcItem(${idx})">✕</button></td>`;
      tbody.appendChild(tr);
    });
    document.getElementById('rc-total-display').textContent = 'รวม: ' + formatMoney(total) + ' บาท';
  }

  function removeRcItem(idx) {
    rcCart.splice(idx, 1);
    renderRcItemsTable();
  }

  document.getElementById('rc-confirm').addEventListener('click', () => {
    if (rcCart.length === 0) { showToast('กรุณาเพิ่มสินค้าอย่างน้อย 1 รายการ'); return; }
    const supplierId = document.getElementById('rc-supplier-select').value;
    const note = document.getElementById('rc-note').value;

    const btn = document.getElementById('rc-confirm');
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        showToast(res.message);
        if (res.success) {
          rcCart = [];
          renderRcItemsTable();
          document.getElementById('rc-note').value = '';
          document.getElementById('rc-supplier-select').value = '';
          loadReceivingHistory();
          loadStockLog();
          _productsNeedRefresh = true; // inventory stats จะ refresh รอบหน้า
          allProducts = [];            // POS จะโหลดสินค้าใหม่รอบหน้าเช่นกัน
        }
      })
      .withFailureHandler(err => { btn.disabled = false; onServerError(err); })
      .createStockReceiving(supplierId, rcCart, note, currentStaffName || 'พนักงาน', currentStaffId);
  });

  function loadReceivingHistory() {
    google.script.run
      .withSuccessHandler(list => {
        const tbody = document.querySelector('#receiving-history-table tbody');
        tbody.innerHTML = '';
        if (!list || list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--on-surface-variant);padding:16px;">ยังไม่มีประวัติการรับสินค้าเข้า</td></tr>';
          return;
        }
        list.forEach(r => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${r.receivingId}</td><td>${r.date}</td><td>${r.supplierName}</td><td>${r.itemCount}</td>
            <td>${formatMoney(r.totalTHB)}</td><td>${r.staffName}</td>
            <td><button onclick="openReceivingDetail('${r.receivingId}')">ดู</button></td>`;
          tbody.appendChild(tr);
        });
      })
      .withFailureHandler(onServerError)
      .getStockReceivingHistory(100);
  }

  function openReceivingDetail(receivingId) {
    google.script.run
      .withSuccessHandler(detail => {
        if (!detail) { showToast('ไม่พบเอกสารนี้'); return; }
        document.getElementById('rcvd-title').textContent = 'เอกสารรับสินค้า ' + detail.header.receivingId;
        document.getElementById('rcvd-info').innerHTML = `
          <b>วันที่:</b> ${detail.header.date} | <b>ซัพพลายเออร์:</b> ${detail.header.supplierName}<br>
          <b>บันทึกโดย:</b> ${detail.header.staffName} | <b>หมายเหตุ:</b> ${detail.header.note || '-'}`;
        const tbody = document.querySelector('#rcvd-items-table tbody');
        tbody.innerHTML = detail.items.map(i =>
          `<tr><td>${i.sku}</td><td>${i.name}</td><td>${i.qty}</td><td>${formatMoney(i.unitCost)}</td><td>${formatMoney(i.total)}</td></tr>`
        ).join('');

  document.getElementById('rcvd-close').addEventListener('click', () => {
    document.getElementById('modal-receiving-detail').classList.remove('active');
  });

  function loadStockLog() {
    google.script.run
      .withSuccessHandler(logs => {
        const tbody = document.querySelector('#stocklog-table tbody');
        tbody.innerHTML = '';
        logs.forEach(l => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${formatDate(l.date)}</td><td>${l.sku}</td><td>${l.name}</td><td>${l.type}</td><td>${l.qty}</td><td>${l.note}</td>`;
          tbody.appendChild(tr);
        });
      })
      .withFailureHandler(onServerError)
      .getStockLog(100);
  }

  // ---------- Products ----------
  let allProductsCache = [];
  let _productsNeedRefresh = false; // ตั้งเป็น true หลัง add/edit/receive สินค้า

  function loadProductsTable(forceRefresh) {
    // ถ้ามี cache อยู่แล้วและไม่ถูกบังคับ refresh → ใช้ของใน memory ทันที
    if (!forceRefresh && !_productsNeedRefresh && allProductsCache.length > 0) {
      renderInventoryStats(allProductsCache);
      renderProductsTableRows(allProductsCache);
      return;
    }
    _productsNeedRefresh = false;
    google.script.run
      .withSuccessHandler(data => {
        if (data && data.error) {
          showToast(data.error);
          // ไม่มีสิทธิ์เข้า Inventory จริงๆ (server เช็คแล้ว) — เด้งกลับ Dashboard
          document.querySelectorAll('.menu li').forEach(x => x.classList.remove('active'));
          document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
          document.querySelector('.menu li[data-page="dashboard"]').classList.add('active');
          document.getElementById('page-dashboard').classList.add('active');
          return;
        }
        const products = data.products || data;
        allProductsCache = products;
        allProducts = products;
        renderInventoryStats(products);
        renderProductsTableRows(products);
        // ถ้ามี search term ค้างอยู่ (พิมพ์ขณะรอ load) → apply ทันที
        if (_pendingInventorySearch) {
          // รอ 1 tick ให้ DOM update เสร็จก่อน filter
          setTimeout(() => applyInventorySearch(_pendingInventorySearch), 0);
        }
        // โหลด StockLog ด้วยในคราวเดียว
        if (data.stockLog) {
          const tbody = document.querySelector('#stocklog-table tbody');
          tbody.innerHTML = '';
          data.stockLog.forEach(l => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${l.date}</td><td>${l.sku}</td><td>${l.name}</td><td>${l.type}</td><td>${l.qty}</td><td>${l.note}</td>`;
            tbody.appendChild(tr);
          });
        }
      })
      .withFailureHandler(onServerError)
      .getInventoryPageData(currentStaffId);
  }

  function renderInventoryStats(products) {
    const physical = products.filter(p => p.itemType !== 'บริการ');
    const totalValue = physical.reduce((sum, p) => sum + (Number(p.cost) || 0) * (Number(p.stock) || 0), 0);
    const lowStock = physical.filter(p => Number(p.stock) > 0 && Number(p.stock) <= 5).length;
    const outStock = physical.filter(p => Number(p.stock) <= 0).length;
    document.getElementById('inv-stat-total').textContent = products.length;
    document.getElementById('inv-stat-value').textContent = formatMoney(totalValue);
    document.getElementById('inv-stat-low').textContent = lowStock;
    document.getElementById('inv-stat-out').textContent = outStock;
  }

  function renderProductsTableRows(products) {
    const tbody = document.querySelector('#products-table tbody');
    tbody.innerHTML = '';
    if (products.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--on-surface-variant);padding:20px;">ไม่พบสินค้า</td></tr>';
      return;
    }
    products.forEach(p => {
      const isService = p.itemType === 'บริการ';
      const tr = document.createElement('tr');

      let statusHtml, stockCellHtml;
      if (isService) {
        statusHtml = '<span class="type-badge type-service">บริการ</span>';
        stockCellHtml = '-';
      } else {
        const stock = Number(p.stock);
        let statusClass = 'status-instock', statusLabel = 'มีสต๊อก';
        if (stock <= 0) { statusClass = 'status-outstock'; statusLabel = 'หมดสต๊อก'; }
        else if (stock <= 5) { statusClass = 'status-lowstock'; statusLabel = 'ใกล้หมด'; }
        statusHtml = `<span class="type-badge ${statusClass}">${statusLabel}</span>`;
        const barPct = Math.min(100, (stock / 30) * 100);
        stockCellHtml = `<div class="stock-cell">
          <div class="stock-bar-track"><div class="stock-bar-fill${stock <= 5 ? ' low' : ''}" style="width:${barPct}%;"></div></div>
          <span>${stock} ${p.unit}</span>
        </div>`;
      }

      const printBtn = isService ? '-' : `<button onclick="goToBarcodePage('${p.sku}')">🏷️ พิมพ์</button>`;
      // Variant ไม่มีหน้ารายละเอียดของตัวเอง — กดแล้วพาไปหน้ารายละเอียดของสินค้าหลักแทน (ที่เห็น Variant นี้อยู่ในรายการ)
      const detailBtn = p.isVariant
        ? `<button onclick="openProductDetail('${p.productSKU}')">📋 ดูสินค้าหลัก</button>`
        : `<button onclick="openProductDetail('${p.sku}')">📋 รายละเอียด</button>`;

      tr.innerHTML = `
        <td><div class="product-row-info">
          <div class="product-row-icon" style="overflow:hidden;">${p.imageURL
            ? `<img src="${p.imageURL}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">`
            : `<span class="material-symbols-outlined" style="font-size:18px;">${isService ? 'design_services' : 'inventory_2'}</span>`
          }</div>
          <div><div class="product-row-name">${p.name}</div><div class="product-row-sku">SKU: ${p.sku}${p.barcode ? ' | BC: ' + p.barcode : ''}</div></div>
        </div></td>
        <td>${isService ? '<span class="type-badge type-service">บริการ</span>' : '<span class="type-badge type-product">สินค้า</span>'}</td>
        <td>${p.category || '-'}</td>
        <td>${stockCellHtml}</td>
        <td>${formatMoney(p.cost)} / ${formatMoney(p.price)}</td>
        <td>${statusHtml}</td>
        <td style="white-space:nowrap;">${detailBtn} ${printBtn}</td>`;
      tbody.appendChild(tr);
    });
  }

  // เก็บ search term ปัจจุบันไว้ เผื่อ cache ว่างและต้องโหลดข้อมูลใหม่ก่อน
  let _pendingInventorySearch = '';

  function applyInventorySearch(q) {
    // กรอง DOM rows โดยตรง — ไม่พึ่ง cache เลย ทำงานถูกต้องเสมอ
    const rows = document.querySelectorAll('#products-table tbody tr');
    if (rows.length === 0) return; // ยังไม่ได้โหลด
    rows.forEach(tr => {
      tr.style.display = (!q || tr.textContent.toLowerCase().includes(q)) ? '' : 'none';
    });
  }

  document.getElementById('products-search-box').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    _pendingInventorySearch = q;

    // ถ้าตารางว่าง → โหลดข้อมูลก่อน แล้ว apply search หลัง load เสร็จ
    const rowCount = document.querySelectorAll('#products-table tbody tr').length;
    if (rowCount === 0) {
      loadProductsTable(true);
      return;
    }
    applyInventorySearch(q);
  });

  // barcode scanner กด Enter — ถ้าพบ 1 แถวที่ไม่ถูกซ่อน เปิด Product Profile ทันที
  document.getElementById('products-search-box').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.keyCode !== 13) return;
    const q = e.target.value.trim().toLowerCase();
    if (!q) return;

    // กรอง cache หา product ที่ตรง (เพื่อ openProductDetail)
    // หาด้วยบาร์โค้ดก่อนเสมอ (เหมือนหน้า POS) แล้วค่อยหา SKU — กันกรณี SKU ของตัวหนึ่งไปตรงกับบาร์โค้ดของอีกตัว
    const byBarcode = allProductsCache.filter(p => String(p.barcode || '').trim().toLowerCase() === q);
    const match = byBarcode[0] || allProductsCache.find(p => String(p.sku).trim().toLowerCase() === q);
    if (match) {
      if (byBarcode.length > 1) showToast('⚠️ บาร์โค้ดนี้ซ้ำกัน ' + byBarcode.length + ' สินค้า: ' + byBarcode.map(x => x.name).join(', ') + ' — กรุณาแก้ให้เหลือตัวเดียว');
      openProductDetail(match.isVariant ? match.productSKU : match.sku);
      return;
    }

    // fallback: ค้นหาแบบ partial ใน DOM
    const visibleRows = Array.from(document.querySelectorAll('#products-table tbody tr'))
      .filter(tr => tr.style.display !== 'none');
    if (visibleRows.length === 0) showToast('ไม่พบสินค้า: ' + q);
  });

  function goToBarcodePage(sku) {
    document.querySelectorAll('.menu li').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
    document.querySelector('.menu li[data-page="inventory"]').classList.add('active');
    document.getElementById('page-inventory').classList.add('active');
    switchSubpageTab('inventory-tabs', 'inv-barcode');
    document.getElementById('bc-search').value = sku;
    lookupBarcodeProduct(sku);
  }

  document.getElementById('btn-add-product').addEventListener('click', () => {
    resetProductModal(); // เริ่มฟอร์มใหม่สะอาดทุกครั้งที่เปิด กันข้อมูล Variant ค้างจากรอบก่อนที่กดยกเลิกไว้
    document.getElementById('modal-product').classList.add('active');
  });
  // ---------- สร้างบาร์โค้ดอัตโนมัติ ----------
  document.getElementById('np-barcode-gen').addEventListener('click', () => {
    genBarcodeInto('np-barcode', 'np-sku-preview-val', 'np-name');
  });

  // ---------- ฟังก์ชันกลาง สร้างบาร์โค้ดสุ่ม ใช้ร่วมกันทั้งฟอร์มหลักและฟอร์ม Variant ----------
  // [แก้ไข] เดิมถ้ามี SKU จะเอา SKU มาใช้เป็นบาร์โค้ดตรงๆ (บาร์โค้ด = SKU เป๊ะ ดูไม่เหมือนบาร์โค้ดจริง)
  // ตอนนี้สร้างเลขบาร์โค้ดแบบ EAN 12 หลักแยกต่างหากจาก SKU เสมอ ไม่ว่าจะมี SKU หรือไม่ก็ตาม
  // เช็คซ้ำกับสินค้าที่โหลดไว้ในเครื่อง (allProducts) ก่อนใช้จริงเสมอ — ถ้าชนโดยบังเอิญ (แทบเป็นไปไม่ได้) จะสุ่มใหม่ให้อัตโนมัติ
  function genBarcodeInto(targetInputId, skuPreviewId, nameInputId) {
    const barcodeInput = document.getElementById(targetInputId);
    if (barcodeInput.value.trim()) {
      if (!confirm('มีบาร์โค้ดอยู่แล้ว ต้องการสร้างใหม่แทนที่ไหม?')) return;
    }
    const existing = new Set((allProducts || []).map(p => String(p.barcode || '').trim()).filter(Boolean));
    let code;
    for (let attempt = 0; attempt < 5; attempt++) {
      const ts = String(Date.now()).slice(-9);
      const rand = String(Math.floor(Math.random() * 100)).padStart(2, '0');
      code = '7' + ts + rand; // 12 หลัก ขึ้นต้นด้วย 7 (prefix ภายในร้าน) ไม่ซ้ำกับ SKU
      if (!existing.has(code)) break;
    }
    barcodeInput.value = code;
    barcodeInput.style.background = '#e8f5e9';
    setTimeout(() => barcodeInput.style.background = '', 1500);
  }

  document.getElementById('np-cancel').addEventListener('click', () => {
    document.getElementById('modal-product').classList.remove('active');
    resetProductModal();
  });
  document.getElementById('np-type').addEventListener('change', (e) => {
    const isService = e.target.value === 'บริการ';
    document.getElementById('np-stock-row').style.display = isService ? 'none' : 'block';
    if (isService && document.getElementById('np-has-variants').checked) {
      document.getElementById('np-has-variants').checked = false;
      toggleVariantMode(false); // บริการไม่มี Variant
    }
    document.getElementById('np-has-variants').closest('label').style.display = isService ? 'none' : 'flex';
  });

  // ================================================================
  // Auto-SKU Preview — แสดง SKU ที่ระบบจะสร้างให้ตอนพิมพ์ชื่อ
  // ================================================================
  let _skuPreviewTimer = null;
  document.getElementById('np-name').addEventListener('input', (e) => {
    clearTimeout(_skuPreviewTimer);
    const name = e.target.value.trim();
    const preview = document.getElementById('np-sku-preview');
    if (!name) { preview.style.display = 'none'; return; }
    _skuPreviewTimer = setTimeout(() => {
      google.script.run
        .withSuccessHandler(sku => {
          if (sku) {
            document.getElementById('np-sku-preview-val').textContent = sku;
            preview.style.display = 'block';
          }
        })
        .withFailureHandler(() => {})
        .generateAutoSKU(name);
    }, 500);
  });

  // ================================================================
  // สินค้ามีหลายสี/ไซซ์ (Variant) — เพิ่มได้ในหน้าเดียวกันเลย ไม่ต้องเซฟก่อนแล้วค่อยไปหน้าอื่น
  // ================================================================
  let npDraftVariants = []; // [{ color, size, barcode, cost, price, stock }]

  function toggleVariantMode(showVariantMode) {
    document.getElementById('np-simple-fields').style.display = showVariantMode ? 'none' : 'block';
    document.getElementById('np-variant-fields').style.display = showVariantMode ? 'block' : 'none';
  }

  document.getElementById('np-has-variants').addEventListener('change', (e) => {
    toggleVariantMode(e.target.checked);
  });

  document.getElementById('npv-barcode-gen').addEventListener('click', () => {
    genBarcodeInto('npv-barcode', 'np-sku-preview-val', 'np-name');
  });

  function renderVariantDraftTable() {
    const tbody = document.querySelector('#np-variants-draft-table tbody');
    const emptyMsg = document.getElementById('np-variants-draft-empty');
    if (npDraftVariants.length === 0) {
      tbody.innerHTML = '';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';
    tbody.innerHTML = '';
    npDraftVariants.forEach((v, idx) => {
      const desc = [v.color, v.size].filter(Boolean).join(' / ') || '-';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${desc}</td>
        <td>${v.barcode || '-'}</td>
        <td>${formatMoney(v.cost)} / ${formatMoney(v.price)}</td>
        <td>${v.stock}</td>
        <td><button onclick="removeVariantDraftRow(${idx})" style="padding:4px 8px;font-size:12px;color:var(--error);">✕ ลบ</button></td>`;
      tbody.appendChild(tr);
    });
  }

  function removeVariantDraftRow(idx) {
    npDraftVariants.splice(idx, 1);
    renderVariantDraftTable();
  }

  document.getElementById('npv-add-row').addEventListener('click', () => {
    const color = document.getElementById('npv-color').value.trim();
    const size = document.getElementById('npv-size').value.trim();
    const barcode = document.getElementById('npv-barcode').value.trim();
    const cost = document.getElementById('npv-cost').value;
    const price = document.getElementById('npv-price').value;
    const stock = document.getElementById('npv-stock').value;

    if (!color && !size) { showToast('กรุณากรอกสีหรือไซซ์อย่างน้อยหนึ่งอย่าง'); return; }
    if (barcode && npDraftVariants.some(v => v.barcode === barcode)) {
      showToast('Barcode นี้ซ้ำกับแถวที่เพิ่มไว้แล้วในรายการ'); return;
    }

    npDraftVariants.push({ color, size, barcode, cost: Number(cost) || 0, price: Number(price) || 0, stock: Number(stock) || 0 });
    renderVariantDraftTable();

    // เคลียร์ฟอร์มแถวเพื่อกรอกแถวถัดไป
    ['npv-color','npv-size','npv-barcode','npv-cost','npv-price','npv-stock'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('npv-color').focus();
  });

  function resetProductModal() {
    document.getElementById('np-sku-preview').style.display = 'none';
    ['np-name','np-category','np-cost','np-price','np-stock','np-unit','np-barcode','np-unit-for-variants']
      .forEach(id => document.getElementById(id).value = '');
    document.getElementById('np-type').value = 'สินค้า';
    document.getElementById('np-stock-row').style.display = 'block';
    document.getElementById('np-has-variants').checked = false;
    document.getElementById('np-has-variants').closest('label').style.display = 'flex';
    toggleVariantMode(false);
    npDraftVariants = [];
    renderVariantDraftTable();
  }

  let currentProductDetailSku = null;

  let _pddRequestSeq = 0;
  function openProductDetail(sku) {
    currentProductDetailSku = sku;
    const reqId = ++_pddRequestSeq; // กันคำตอบของการเปิดครั้งก่อนที่มาถึงช้า มาเขียนทับข้อมูลสินค้าตัวล่าสุด
    google.script.run
      .withSuccessHandler(detail => {
        if (reqId !== _pddRequestSeq) return;
        if (!detail) { showToast('ไม่พบสินค้านี้'); return; }
        const p = detail.product;
        const dupWarn = document.getElementById('pdd-dup-warning');
        if (dupWarn) {
          dupWarn.style.display = detail.duplicateSkuCount > 1 ? 'block' : 'none';
          dupWarn.textContent = detail.duplicateSkuCount > 1
            ? '⚠️ SKU "' + p.sku + '" ซ้ำกัน ' + detail.duplicateSkuCount + ' แถวในชีต — ข้อมูลที่เห็นอาจเป็นของสินค้าอื่น ระบบจะไม่ให้บันทึกจนกว่าผู้จัดการจะกด "แก้ SKU ซ้ำ" ในหน้าตั้งค่า'
            : '';
        }
        document.getElementById('pdd-title').textContent = 'รายละเอียดสินค้า: ' + p.name;
        document.getElementById('pdd-sku').value = p.sku;
        document.getElementById('pdd-name').value = p.name;
        document.getElementById('pdd-category').value = p.category || '';
        document.getElementById('pdd-brand').value = p.brand || '';
        document.getElementById('pdd-barcode').value = p.barcode || '';
        document.getElementById('pdd-cost').value = p.cost || 0;
        document.getElementById('pdd-price').value = p.price || 0;
        document.getElementById('pdd-unit').value = p.unit || '';
        document.getElementById('pdd-reorder').value = p.reorderLevel || 0;
        document.getElementById('pdd-stock-display').textContent = p.stock;
        document.getElementById('pdd-unit-display').textContent = p.unit || '';

        currentProductDetailImage = p.imageURL || '';
        renderProductDetailImage();
        renderProductSuppliersTable(detail.suppliers);
        populateSupplierSelect('pdd-ps-supplier-select', false);
        renderProductDetailVariants(sku); // V3 — โหลดรายการ Variant ของสินค้านี้

  function loadSalesHistory() {
    google.script.run
      .withSuccessHandler(rows => {
        const tbody = document.querySelector('#history-table tbody');
        tbody.innerHTML = '';
        if (!rows || rows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--on-surface-variant);padding:16px;">ยังไม่มีประวัติการขาย</td></tr>';
          return;
        }
        rows.forEach(row => {
          const isCancelled = row.status === 'ยกเลิก';
          const tr = document.createElement('tr');
          if (isCancelled) tr.style.opacity = '0.55';

          let actionHtml = '-';
          if (row.type === 'บิลขาย' && !isCancelled) {
            actionHtml = `<button onclick="voidSaleFromHistory('${row.id}')">ยกเลิกบิล</button>`;
          } else if (row.type === 'Booking') {
            actionHtml = `<button onclick="openBookingDetail('${row.id}')">ดูรายละเอียด</button>`;
          } else if (row.type === 'งานซ่อม') {
            actionHtml = `<button onclick="openRepairDetail('${row.id}')">ดูรายละเอียด</button>`;
          }

          const statusColorMap = { 'ยกเลิก': '#9e9e9e', 'เสร็จสมบูรณ์': '#43a047', 'เสร็จแล้ว': '#43a047', 'รับรถคืนแล้ว': '#3f51b5', 'ระหว่างดำเนินการ': '#ff9800' };
          const statusColor = statusColorMap[row.status] || '#43a047';

          tr.innerHTML = `<td>${row.id}</td><td><span class="pending-tag">${row.category}</span></td><td>${row.date}</td>
            <td>${row.customerName || '-'}</td><td>${row.itemsSummary || '-'}</td><td>${formatMoney(row.total)}</td>
            <td>${row.staff || '-'}</td>
            <td><span class="status-badge" style="background:${statusColor};">${row.status}</span></td>
            <td>${actionHtml}</td>`;
          tbody.appendChild(tr);
        });
      })
      .withFailureHandler(onServerError)
      .getAllSalesHistory(300);
  }

      return;
    }
    const count = Math.max(1, Number(document.getElementById('bc-count').value) || 1);
    const container = document.getElementById('barcode-print-area');
    container.innerHTML = '';
    const code = bcSelectedProduct.barcode || bcSelectedProduct.sku;

    let warned = false;
    for (let i = 0; i < count; i++) {
      const label = document.createElement('div');
      label.className = 'barcode-label';
      const svgId = 'bc-svg-' + i;
      label.innerHTML = `<div class="label-name">${bcSelectedProduct.name}</div>

      container.appendChild(label);
      const svgEl = document.getElementById(svgId);
      const result = renderCode39(svgEl, code, { narrow: 1.2, height: 40 });
      if (result.hadInvalid && !warned) {

  function setPrintPageSize(cssPageRule) {

      // force ให้ทุก element ในหน้าพิมพ์ไม่มี margin เพิ่มเติม
      '@page :first { margin: 0; }\n' +
      '@page :left { margin: 0; }\n' +
      '@page :right { margin: 0; }';
  }

  function printWithMode(mode, pageSizeRule) {
    setPrintPageSize(pageSizeRule);
    document.body.classList.add(mode);

    const cleanup = () => {
      document.body.classList.remove(mode);
      setPrintPageSize(''); // reset page size หลังพิมพ์เสร็จ
      window.removeEventListener('afterprint', cleanup);
    };
    window.addEventListener('afterprint', cleanup);
    setTimeout(cleanup, 5000);

    window.print();
  }

  function renderCrmStats(customers) {
    const totalEl = document.getElementById('crm-stat-total');
    if (!totalEl) return;
    const now = new Date();
    const thisMonth = customers.filter(c => {
      const d = new Date(c.joinDate);
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }).length;
    const withPoints = customers.filter(c => Number(c.points) > 0).length;
    totalEl.textContent = customers.length;
    document.getElementById('crm-stat-new').textContent = thisMonth;
    document.getElementById('crm-stat-active').textContent = withPoints;
  }

      return;

    customers.forEach(c => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${c.id}</td><td>${c.name}</td><td>${c.phone}</td><td>${c.points}</td><td>${formatDate(c.joinDate)}</td>

  function switchSubpageTab(tabsContainerId, targetTab) {
    const container = document.getElementById(tabsContainerId);
    if (!container) return;
    container.querySelectorAll('.subpage-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === targetTab));
    const parentSection = container.closest('.page');
    parentSection.querySelectorAll('.subpage-panel').forEach(p => p.classList.toggle('active', p.id === 'subpage-' + targetTab));

    // โหลดข้อมูลของแท็บที่เพิ่งสลับไป (เฉพาะแท็บที่ต้องข้อมูลสด)
    if (targetTab === 'sale-history') loadSalesHistory();
    else if (targetTab === 'sale-credit') { loadARPage(); loadCreditSalesTable(); }
    else if (targetTab === 'sale-booking') loadBookingPage();
    else if (targetTab === 'sale-tradein') loadTradeInPage();
    else if (targetTab === 'inv-products') {
      _pendingInventorySearch = ''; // reset search เมื่อกลับมาหน้าสินค้า
      if (allProductsCache.length === 0) loadProductsTable(true);
      else { renderInventoryStats(allProductsCache); renderProductsTableRows(allProductsCache); }
    }
    else if (targetTab === 'inv-receive') { loadStockLog(); loadReceivingHistory(); loadSuppliersForReceivingSelect(); }
  }

        const bills = {};
        creditLines.forEach(s => {
          if (!bills[s.billNumber]) {
            bills[s.billNumber] = { billNumber: s.billNumber, date: s.date, total: 0, staff: s.staff, arId: s.arId };
          }
          bills[s.billNumber].total += Number(s.total);

        const billList = Object.values(bills);

        const tbody = document.querySelector('#credit-sales-table tbody');
        tbody.innerHTML = '';
        if (billList.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--on-surface-variant);padding:20px;">ยังไม่มีการขายแบบเครดิต</td></tr>';
          return;
        }
        billList.forEach(b => {
          const statusHtml = b.arId
            ? '<span class="status-badge status-ค้างชำระ">ค้างชำระ</span>'
            : '<span class="status-badge" style="background:#43a047;">ชำระครบแล้ว</span>';
          const actionHtml = b.arId
            ? `<button onclick="switchSubpageTab('sale-tabs', 'sale-credit'); setTimeout(() => openARDetail('${b.arId}'), 200);">ดูลูกหนี้</button>`

          const tr = document.createElement('tr');

  function ncsTotal() {
    return ncsCart.reduce((s, i) => s + i.qty * i.price, 0);

  // ---------- Multi-Payment / Multi-Currency (เหมือนหน้า POS) ----------
  function ncsRateFor(currency) {
    if (currency === 'LAK') return exchangeRates.LAK_PER_THB;
    if (currency === 'USD') return exchangeRates.USD_PER_THB;
    if (currency === 'CNY') return exchangeRates.CNY_PER_THB;
    return 1;
  }
  function ncsAmountToTHB(currency, amount) {
    const amt = Number(amount) || 0;
    return currency === 'THB' ? amt : amt / ncsRateFor(currency);
  }
  function ncsPaidTotalTHB() {
    return ncsPayments.reduce((s, p) => s + ncsAmountToTHB(p.currency, p.amount), 0);
  }

  document.getElementById('ncs-add-payment').addEventListener('click', () => {
    const remaining = Math.max(0, ncsTotal() - ncsPaidTotalTHB());
    ncsPayments.push({ method: 'เงินสด', currency: 'THB', amount: remaining > 0 ? Number(remaining.toFixed(2)) : 0 });
    renderNcsPaymentRows();
  });

  function renderNcsPaymentRows() {
    const box = document.getElementById('ncs-payment-rows');
    box.innerHTML = '';
    ncsPayments.forEach((p, idx) => {
      const row = document.createElement('div');
      row.className = 'pay-row';
      row.innerHTML = `
        <select onchange="ncsPayments[${idx}].method = this.value">
          <option value="เงินสด" ${p.method === 'เงินสด' ? 'selected' : ''}>เงินสด</option>
          <option value="โอนเงิน" ${p.method === 'โอนเงิน' ? 'selected' : ''}>โอนเงิน</option>
          <option value="บัตรเครดิต" ${p.method === 'บัตรเครดิต' ? 'selected' : ''}>บัตรเครดิต</option>
        </select>
        <select onchange="ncsPayments[${idx}].currency = this.value; renderNcsPaymentRows();">
          <option value="THB" ${p.currency === 'THB' ? 'selected' : ''}>THB</option>
          <option value="LAK" ${p.currency === 'LAK' ? 'selected' : ''}>LAK</option>
          <option value="USD" ${p.currency === 'USD' ? 'selected' : ''}>USD</option>
          <option value="CNY" ${p.currency === 'CNY' ? 'selected' : ''}>CNY</option>
        </select>
        <input type="number" class="pay-amount-input" value="${p.amount}" min="0" step="0.01"
          oninput="ncsPayments[${idx}].amount = this.value; updateNcsPaymentSummary();">
        <button type="button" class="pay-remove-btn" onclick="ncsPayments.splice(${idx},1); renderNcsPaymentRows();">✕</button>
        <div class="pay-converted">${p.currency === 'THB' ? '' : ('≈ ' + formatMoney(ncsAmountToTHB(p.currency, p.amount)) + ' บาท (อัตรา 1 บาท = ' + formatRate(ncsRateFor(p.currency)) + ' ' + p.currency + ')')}</div>`;
      box.appendChild(row);
    });
    updateNcsPaymentSummary();
  }

        const ready = allRepairJobsCache.filter(j => j.status === 'เสร็จแล้ว');
        const overdue = allRepairJobsCache.filter(j => {
          if (!j.appointmentDate || j.status === 'เสร็จแล้ว' || j.status === 'รับรถคืนแล้ว') return false;
          return new Date(j.appointmentDate) < new Date();
        });
        document.getElementById('rp-stat-active').textContent = active.length;
        document.getElementById('rp-stat-ready').textContent = ready.length;
        document.getElementById('rp-stat-overdue').textContent = overdue.length;
        renderRepairKanban();
        rqLoadJobMap();
      })
      .withFailureHandler(onServerError)
      .getRepairJobs('all');

  function renderRepairKanban() {
    const board = document.getElementById('repair-kanban');
    const jobs = allRepairJobsCache || [];
    const columns = currentRepairTab === 'all' ? REPAIR_COLUMNS : REPAIR_COLUMNS.filter(c => c.status === currentRepairTab);

    board.innerHTML = columns.map(col => {
      const colJobs = jobs.filter(j => j.status === col.status);
      const cardsHtml = colJobs.length === 0
        ? '<div class="kanban-empty">ไม่มีงาน</div>'
        : colJobs.map(j => {
            const isOverdue = j.appointmentDate && new Date(j.appointmentDate) < new Date() && col.status !== 'เสร็จแล้ว' && col.status !== 'รับรถคืนแล้ว';
            return `
            <div class="kanban-card${isOverdue ? ' overdue' : ''}" onclick="openRepairDetail('${j.jobId}')">
              <div class="kanban-card-top">
                <span class="kanban-card-id">${j.jobId}</span>
                ${isOverdue ? '<span class="pending-tag" style="background:var(--error-container); color:var(--on-error-container);">เกินกำหนด</span>' : ''}
              </div>
              <div class="kanban-card-title">${j.bikeModel || 'ไม่ระบุรุ่น'}</div>
              <div class="kanban-card-sub">${j.problem}</div>${rqJobBadge(j.jobId)}
              <div class="kanban-card-footer">
                <span class="kanban-card-customer">${j.customerName}</span>
                <span class="kanban-card-total">${formatMoney(j.total)}</span>
              </div>
            </div>`;
          }).join('');

      return `
        <div class="kanban-column">
          <div class="kanban-column-header">
            <span class="dot" style="background:${col.color};"></span>
            <span>${col.status}</span>
            <span class="kanban-column-count">${colJobs.length}</span>
          </div>
          ${cardsHtml}
        </div>`;
    }).join('');
  }

  // ---------- รับชำระเงินงานซ่อม (Multi-payment / Multi-currency) ----------
  let rcoPayments = [];

  function rcoRecalc() {
    const rates = window._exchangeRates || { LAK_PER_THB: 650, USD_PER_THB: 0.028 };
    const total = currentRepairDetail ? (Number(currentRepairDetail.job.total) || 0) : 0;
    let paidTHB = 0;
    document.querySelectorAll('.rco-pay-row').forEach(row => {
      const currency = row.querySelector('.rco-pay-currency').value;
      const amount = Number(row.querySelector('.rco-pay-amount').value) || 0;
      paidTHB += currency === 'THB' ? amount : currency === 'LAK' ? amount / (rates.LAK_PER_THB || 650) : amount / (rates.USD_PER_THB || 0.028);
    });
    const remaining = total - paidTHB;
    const change = paidTHB - total;
    document.getElementById('rco-sum-total').textContent = formatMoney(total) + ' บาท';
    document.getElementById('rco-sum-paid').textContent = formatMoney(paidTHB) + ' บาท';
    document.getElementById('rco-sum-remaining').textContent = formatMoney(Math.max(0, remaining)) + ' บาท';
    document.getElementById('rco-sum-remaining').parentElement.className = 'pay-summary-row remaining' + (remaining <= 0.01 ? ' zero' : '');
    document.getElementById('rco-sum-change-row').style.display = change > 0.01 ? 'flex' : 'none';
    document.getElementById('rco-sum-change').textContent = formatMoney(change) + ' บาท';
    document.getElementById('rco-confirm').disabled = remaining > 0.01;
  }

  function rcoAddPayRow(method, currency) {
    const row = document.createElement('div');
    row.className = 'pay-row rco-pay-row';
    row.innerHTML = `
      <select class="rco-pay-method">
        <option value="เงินสด" ${method === 'เงินสด' ? 'selected' : ''}>เงินสด</option>
        <option value="โอนเงิน" ${method === 'โอนเงิน' ? 'selected' : ''}>โอนเงิน</option>
        <option value="บัตรเครดิต" ${method === 'บัตรเครดิต' ? 'selected' : ''}>บัตรเครดิต</option>
        <option value="QR Code" ${method === 'QR Code' ? 'selected' : ''}>QR Code</option>
      </select>
      <select class="rco-pay-currency">
        <option value="THB" ${currency === 'THB' ? 'selected' : ''}>THB</option>
        <option value="LAK" ${currency === 'LAK' ? 'selected' : ''}>LAK</option>
        <option value="USD" ${currency === 'USD' ? 'selected' : ''}>USD</option>
      </select>
      <input type="number" class="rco-pay-amount pay-amount-input" placeholder="จำนวน" min="0" step="0.01">
      <button type="button" class="pay-remove-btn">✕</button>`;
    row.querySelector('.rco-pay-amount').addEventListener('input', rcoRecalc);
    row.querySelector('.rco-pay-currency').addEventListener('change', rcoRecalc);
    row.querySelector('.pay-remove-btn').addEventListener('click', () => { row.remove(); rcoRecalc(); });
    document.getElementById('rco-payment-rows').appendChild(row);
    rcoRecalc();
  }

  document.getElementById('rco-add-payment').addEventListener('click', () => rcoAddPayRow('เงินสด', 'THB'));

    document.getElementById('rco-sum-change-row').style.display = 'none';
    document.getElementById('rco-confirm').disabled = true;

    // โหลดอัตราแลกเปลี่ยนปัจจุบันมาใช้คำนวณ
    google.script.run.withSuccessHandler(rates => {
      window._exchangeRates = rates;
      rcoAddPayRow('เงินสด', 'THB'); // เพิ่มแถวแรกให้อัตโนมัติ
    }).withFailureHandler(() => {
      window._exchangeRates = { LAK_PER_THB: 650, USD_PER_THB: 0.028 };

    }).getExchangeRates();

  document.getElementById('rco-confirm').addEventListener('click', () => {
    const rates = window._exchangeRates || { LAK_PER_THB: 650, USD_PER_THB: 0.028 };
    const payments = [];
    document.querySelectorAll('.rco-pay-row').forEach(row => {
      const currency = row.querySelector('.rco-pay-currency').value;
      const amount = Number(row.querySelector('.rco-pay-amount').value) || 0;
      if (amount <= 0) return;
      const rate = currency === 'THB' ? 1 : currency === 'LAK' ? (rates.LAK_PER_THB || 650) : (rates.USD_PER_THB || 0.028);
      payments.push({ method: row.querySelector('.rco-pay-method').value, currency, amount, exchangeRate: rate });
    });
    if (payments.length === 0) { showToast('กรุณากรอกจำนวนเงินอย่างน้อย 1 รายการ'); return; }

    const btn = document.getElementById('rco-confirm');
    btn.disabled = true;
    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        showToast(res.message);
        if (res.success) {
          document.getElementById('modal-repair-checkout').classList.remove('active');
          openRepairDetail(currentRepairJobId); // รีเฟรชหน้ารายละเอียด (แสดงสถานะ รับรถคืนแล้ว + ประวัติชำระ)
          setTimeout(() => printRepairDoc('pickup'), 600); // เปิดใบเสร็จรับรถคืนให้อัตโนมัติ
          loadRepairJobs();
        }
      })
      .withFailureHandler(err => { btn.disabled = false; onServerError(err); })
      .checkoutRepairJob(currentRepairJobId, payments, currentStaffName || 'พนักงาน');
  });
