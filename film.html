<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ອອກແບບຟິມຫຸ້ມສີ — Sevenday Bike</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sevenday.css">
<style>
.crumbs{font-size:13px;color:var(--grey-600);padding:18px 0 6px}
.crumbs a:hover{text-decoration:underline}
.page-title{font-size:clamp(28px,3.4vw,44px);font-weight:800;letter-spacing:-.01em;line-height:1.05}
.page-sub{color:var(--grey-600);margin:8px 0 0;max-width:62ch}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input,.field select,.field textarea{height:48px;border:1px solid var(--grey-300);padding:0 14px;font:inherit;background:#fff;border-radius:0}
.field textarea{height:96px;padding:12px 14px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#000;box-shadow:0 0 0 1px #000}
.field .err{font-size:13px;font-weight:600;display:none}
.field.invalid input,.field.invalid select{border-color:#000;border-width:2px}
.field.invalid .err{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--grey-300);padding:16px;cursor:pointer}
.choice:has(input:checked){border:2px solid #000;padding:15px}
.choice input{width:20px;height:20px;accent-color:#000;margin-top:2px}
.choice b{display:block}.choice small{color:var(--grey-600)}
.alert{background:var(--grey-100);border-left:4px solid #000;padding:14px 16px;font-size:14px}
@media (max-width:860px){.row2{grid-template-columns:1fr}}

.fm{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;padding:24px 0 64px;align-items:start}
.stage{background:var(--grey-100);position:sticky;top:100px}
.stage svg{width:100%;height:auto;display:block}
.stage .cap{display:flex;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--grey-300);font-size:14px;background:#fff}
.stage .cap b{font-weight:800}
.ctl h2{font-size:18px;font-weight:800;margin:24px 0 10px}
.ctl h2:first-child{margin-top:0}
.parts{display:flex;gap:8px;flex-wrap:wrap}
.parts button{border:1px solid var(--grey-300);padding:10px 14px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.parts button.on{border:2px solid #000;padding:9px 13px}
.parts i{width:16px;height:16px;border:1px solid rgba(0,0,0,.2);display:inline-block}
.sw{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.sw button{aspect-ratio:1;border:1px solid rgba(0,0,0,.15)}
.sw button.on{outline:3px solid #000;outline-offset:2px}
.cname{font-size:14px;margin-top:8px;color:var(--grey-600)}
.fin{display:flex;gap:8px;flex-wrap:wrap}
.fin label{border:1px solid var(--grey-300);padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer}
.fin label:has(input:checked){background:#000;color:#fff;border-color:#000}
.fin input{position:absolute;opacity:0}
.pkg{display:flex;flex-direction:column;gap:8px}
.pkg label{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--grey-300);padding:14px;cursor:pointer}
.pkg label:has(input:checked){border:2px solid #000;padding:13px}
.pkg input{accent-color:#000;margin-right:10px}
.pkg small{display:block;color:var(--grey-600);font-weight:500}
.pkg b{white-space:nowrap}
.req{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.req .btn{border-radius:0;height:54px}
.done{background:var(--grey-100);padding:28px;text-align:center}
@media (max-width:860px){.fm{grid-template-columns:1fr}.stage{position:static}.sw{grid-template-columns:repeat(8,1fr)}}

</style>
</head>
<body>

<main class="wrap">
  <nav class="crumbs"><a href="index.html">ໜ້າຫຼັກ</a> / <a href="service.html">Workshop</a> / ຟິມຫຸ້ມສີ</nav>
  <h1 class="page-title">ອອກແບບສີຈັກຍານຂອງທ່ານ</h1>
  <p class="page-sub">ເລືອກສ່ວນ ແລ້ວເລືອກສີ ເບິ່ງຕົວຢ່າງທັນທີ. ສົ່ງແບບໃຫ້ຮ້ານ ເພື່ອຂໍລາຄາ.</p>
  <div class="fm">
    <div class="stage">
      <svg viewBox="0 0 600 380" aria-label="ຕົວຢ່າງສີຈັກຍານ">
        <defs><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
        <g id="wheels" fill="none" stroke-width="14"><circle cx="140" cy="260" r="92"/><circle cx="460" cy="260" r="92"/></g>
        <g stroke="#9a9a9a" stroke-width="2" fill="none"><circle cx="140" cy="260" r="78"/><circle cx="460" cy="260" r="78"/>
          <path d="M140 182v156M62 260h156M85 205l110 110M85 315l110-110M460 182v156M382 260h156M405 205l110 110M405 315l110-110"/></g>
        <circle cx="140" cy="260" r="10" fill="#333"/><circle cx="460" cy="260" r="10" fill="#333"/>
        <g id="frame" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="16">
          <path d="M140 260 270 260 230 120"/><path d="M230 120 410 132 270 260"/><path d="M140 260 230 120"/>
        </g>
        <path id="fork" d="M410 132 425 180 460 260" fill="none" stroke-width="13" stroke-linecap="round"/>
        <path id="frameGloss" d="M232 116 408 128" stroke="url(#gloss)" stroke-width="6" stroke-linecap="round" fill="none"/>
        <path d="M402 108 432 92h34" stroke="#222" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M410 132 402 108" stroke="#222" stroke-width="10" stroke-linecap="round"/>
        <path d="M230 120 222 86" stroke="#222" stroke-width="9" stroke-linecap="round"/>
        <path d="M196 80h56" stroke="#222" stroke-width="12" stroke-linecap="round"/>
        <circle cx="270" cy="260" r="22" fill="none" stroke="#333" stroke-width="5"/>
      </svg>
      <div class="cap"><span id="capTxt"></span><b id="capFin"></b></div>
    </div>
    <div class="ctl">
      <h2>1. ເລືອກສ່ວນທີ່ຈະປ່ຽນສີ</h2>
      <div class="parts" id="parts"></div>
      <h2>2. ເລືອກສີ</h2>
      <div class="sw" id="sw"></div><div class="cname" id="cname"></div>
      <h2>3. ພື້ນຜິວ</h2>
      <div class="fin" id="fin"></div>
      <h2>4. ແພັກເກດ</h2>
      <div class="pkg">
        <label><span><input type="radio" name="pkg" value="Accent Wrap">Accent Wrap<small>ບາງສ່ວນ ເຊັ່ນ ທໍ່ເທິງ ຫຼື ໂຊັກ</small></span><b>ຈາກ ₭300,000</b></label>
        <label><span><input type="radio" name="pkg" value="Full Frame Wrap" checked>Full Frame Wrap<small>ທັງເຟຣມ + ໂຊັກ</small></span><b>ຈາກ ₭800,000</b></label>
        <label><span><input type="radio" name="pkg" value="Premium Wrap">Premium<small>ທັງຄັນ ລວມຂອບລໍ້ ຟິມພິເສດ</small></span><b>ຈາກ ₭1,500,000</b></label>
      </div>
      <h2>5. ສົ່ງແບບໃຫ້ຮ້ານ</h2>
      <div id="reqBox"><form class="req" onsubmit="send(event)" novalidate>
        <div class="row2"><div class="field"><label for="fName">ຊື່</label><input id="fName" required><span class="err">ໃສ່ຊື່</span></div>
          <div class="field"><label for="fPhone">ເບີໂທ / WhatsApp</label><input id="fPhone" type="tel" required><span class="err">ໃສ່ເບີໂທ</span></div></div>
        <div class="field"><label for="fBike">ຈັກຍານຂອງທ່ານ</label><input id="fBike" placeholder="ຍີ່ຫໍ້ ແລະ ລຸ້ນ"></div>
        <div class="alert" id="fMsg" hidden></div>
        <button class="btn btn-black" id="fBtn">ສົ່ງແບບ ແລະ ຂໍລາຄາ</button>
      </form></div>
    </div>
  </div>
</main>

<script src="layout.js"></script>
<script>

const COLORS=[{"n": "Sevenday Red", "h": "#D42B2B"}, {"n": "Racing Red", "h": "#B00020"}, {"n": "Coral", "h": "#FF6B6B"}, {"n": "Flame Orange", "h": "#FF6B00"}, {"n": "Golden Yellow", "h": "#FFC72C"}, {"n": "Lime Green", "h": "#7CB518"}, {"n": "Forest Green", "h": "#2D6A4F"}, {"n": "Teal", "h": "#00897B"}, {"n": "Sky Blue", "h": "#0077B6"}, {"n": "Navy Blue", "h": "#023E8A"}, {"n": "Royal Blue", "h": "#1A6FBF"}, {"n": "Purple", "h": "#7B2FBE"}, {"n": "Magenta", "h": "#C2185B"}, {"n": "Hot Pink", "h": "#FF1493"}, {"n": "White", "h": "#FFFFFF"}, {"n": "Pearl White", "h": "#F5F0E8"}, {"n": "Silver", "h": "#C0C0C0"}, {"n": "Stealth Black", "h": "#111111"}, {"n": "Graphite", "h": "#444444"}, {"n": "Charcoal", "h": "#2D2D2D"}, {"n": "Gold Chrome", "h": "#FFD700"}, {"n": "Rose Gold", "h": "#B76E79"}, {"n": "Copper", "h": "#B87333"}, {"n": "Bronze", "h": "#CD7F32"}, {"n": "Titanium", "h": "#878681"}, {"n": "Gunmetal", "h": "#2A3439"}, {"n": "Silver Chrome", "h": "#A8A9AD"}, {"n": "Ice Blue", "h": "#B0E0E6"}, {"n": "Midnight Blue", "h": "#191970"}, {"n": "Champagne", "h": "#FAD6A5"}, {"n": "Matte Black", "h": "#1A1A1A"}, {"n": "Matte White", "h": "#E8E8E8"}, {"n": "Matte Red", "h": "#8B0000"}, {"n": "Matte Blue", "h": "#1B3A6B"}, {"n": "Matte Green", "h": "#1A4A1A"}, {"n": "Matte Orange", "h": "#7A2E00"}, {"n": "Matte Grey", "h": "#555555"}, {"n": "Matte Purple", "h": "#3D1A6E"}, {"n": "Matte Teal", "h": "#004D40"}, {"n": "Matte Yellow", "h": "#5C4A00"}, {"n": "Mirror Chrome", "h": "#C0C0C0"}, {"n": "Blue Chrome", "h": "#4169E1"}, {"n": "Red Chrome", "h": "#DC143C"}, {"n": "Green Chrome", "h": "#228B22"}, {"n": "Purple Chrome", "h": "#6A0DAD"}, {"n": "Black Chrome", "h": "#0D0D0D"}, {"n": "Rose Chrome", "h": "#FF007F"}, {"n": "Candy Apple Red", "h": "#CC0000"}, {"n": "Flip Flop Purple/Blue", "h": "#6B3FA0"}, {"n": "Galaxy Black", "h": "#0A0A1A"}, {"n": "Chameleon Green/Gold", "h": "#7B8B00"}, {"n": "Carbon Fiber Look", "h": "#1A1A2E"}, {"n": "Camo Green", "h": "#4A5240"}, {"n": "Brushed Aluminium", "h": "#8A8A8A"}, {"n": "Deep Space Blue", "h": "#050A30"}];
const FIN=['Gloss','Matte','Satin','Metallic','Chrome'];
const PARTS=[{k:'frame',n:'ເຟຣມ'},{k:'fork',n:'ໂຊັກ'},{k:'wheels',n:'ຂອບລໍ້'}];
const $=id=>document.getElementById(id);
let part='frame', fin='Gloss', pick={frame:COLORS[0],fork:COLORS[0],wheels:COLORS.find(c=>/Black/.test(c.n))||COLORS[0]};
function paint(){
  $('frame').setAttribute('stroke',pick.frame.h); $('fork').setAttribute('stroke',pick.fork.h); $('wheels').setAttribute('stroke',pick.wheels.h);
  $('frameGloss').style.display = fin==='Matte'?'none':''; $('frameGloss').style.opacity = fin==='Chrome'?1:fin==='Satin'?.4:.8;
  $('parts').innerHTML=PARTS.map(p=>`<button class="${p.k===part?'on':''}" onclick="part='${p.k}';paint()"><i style="background:${pick[p.k].h}"></i>${p.n}</button>`).join('');
  $('sw').innerHTML=COLORS.map((c,i)=>`<button class="${pick[part].n===c.n?'on':''}" style="background:${c.h}" title="${c.n}" aria-label="${c.n}" onclick="pick[part]=COLORS[${i}];paint()"></button>`).join('');
  $('cname').textContent=`${PARTS.find(p=>p.k===part).n}: ${pick[part].n}`;
  $('fin').innerHTML=FIN.map(f=>`<label><input type="radio" name="fin" ${f===fin?'checked':''} onchange="fin='${f}';paint()">${f}</label>`).join('');
  $('capTxt').textContent=`ເຟຣມ ${pick.frame.n} · ໂຊັກ ${pick.fork.n} · ລໍ້ ${pick.wheels.n}`; $('capFin').textContent=fin;
}
paint();
try{ const u=JSON.parse(sessionStorage.getItem('sd_user')||'null'); if(u){ $('fName').value=u.name||''; $('fPhone').value=u.phone||''; } }catch(_){}
function err(id,b){ $(id).closest('.field').classList.toggle('invalid',b); return b; }
async function send(e){
  e.preventDefault();
  if([err('fName',!$('fName').value.trim()),err('fPhone',$('fPhone').value.replace(/\D/g,'').length<8)].some(Boolean)) return;
  const b=$('fBtn'); b.disabled=true; b.textContent='ກຳລັງສົ່ງ...';
  const pkg=document.querySelector('[name=pkg]:checked').value;
  try{
    const d=await apiPost('filmRequest',{customer:{name:$('fName').value.trim(),phone:$('fPhone').value.trim()},package:pkg,
      color_name:`ເຟຣມ ${pick.frame.n} ${pick.frame.h} / ໂຊັກ ${pick.fork.n} / ລໍ້ ${pick.wheels.n}`,finish:fin,
      bike:{model:$('fBike').value.trim()||'ບໍ່ລະບຸ'},notes:'ສົ່ງຈາກໜ້າອອກແບບຟິມ'});
    $('reqBox').innerHTML=`<div class="done"><b style="font-size:22px;font-weight:800">ສົ່ງແບບແລ້ວ</b><p>ເລກທີ່ ${d.job_id||'—'} — ຮ້ານຈະຕິດຕໍ່ແຈ້ງລາຄາພາຍໃນ 2 ຊົ່ວໂມງ</p></div>`;
  }catch(ex){ $('fMsg').hidden=false; $('fMsg').textContent='ສົ່ງບໍ່ສຳເລັດ: '+ex.message; b.disabled=false; b.textContent='ສົ່ງແບບ ແລະ ຂໍລາຄາ'; }
}

</script>
</body>
</html>
