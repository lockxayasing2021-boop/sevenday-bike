<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ກະຕ່າສິນຄ້າ — Sevenday Bike</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sevenday.css">
<style>
.page-title{font-size:clamp(28px,3.4vw,42px);font-weight:800;letter-spacing:-.01em;padding:32px 0 20px}
.cart{display:grid;grid-template-columns:1fr 380px;gap:40px;padding-bottom:64px;align-items:start}
.line{display:grid;grid-template-columns:120px 1fr auto;gap:18px;padding:20px 0;border-bottom:1px solid var(--grey-300)}
.line:first-child{border-top:1px solid var(--grey-300)}
.thumb{aspect-ratio:1;background:var(--grey-100);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.thumb svg{width:70%;color:var(--grey-600)}
.line h3{font-size:16px;font-weight:800;line-height:1.3}
.line .meta{font-size:13px;color:var(--grey-600);margin:4px 0 12px}
.line .warn{font-size:13px;font-weight:700;margin-top:8px}
.ctrl{display:flex;gap:14px;align-items:center}
.qty{display:flex;border:1px solid #000;height:40px}
.qty button{width:36px;font-size:18px}.qty span{width:36px;display:grid;place-items:center;font-weight:700}
.rm{font-size:13px;text-decoration:underline;color:var(--grey-600)}
.line-price{text-align:right;font-weight:800;font-size:17px;white-space:nowrap}
.line-price small{display:block;font-weight:500;font-size:12px;color:var(--grey-600)}
.summary{background:var(--grey-100);padding:26px;position:sticky;top:100px}
.summary h2{font-size:20px;font-weight:800;margin-bottom:16px}
.row{display:flex;justify-content:space-between;padding:8px 0;font-size:15px}
.row.total{border-top:2px solid #000;margin-top:10px;padding-top:16px;font-weight:800;font-size:20px}
.coupon{display:flex;margin:16px 0}
.coupon input{flex:1;height:44px;border:1px solid #000;border-right:none;padding:0 12px;font:inherit;min-width:0}
.coupon button{padding:0 16px;background:#000;color:#fff;font-weight:700}
.summary .btn{width:100%;height:54px;border-radius:0;margin-top:8px}
.note{font-size:13px;color:var(--grey-600);margin-top:12px;text-align:center}
.empty{text-align:center;padding:72px 20px 96px}
.empty svg{width:120px;color:var(--grey-300);margin:0 auto 20px}
.empty h2{font-size:26px;font-weight:800;margin-bottom:8px}
.empty p{color:var(--grey-600);margin-bottom:24px}
@media (max-width:860px){
  .cart{grid-template-columns:1fr}
  .line{grid-template-columns:88px 1fr}
  .line-price{grid-column:2;text-align:left}
  .summary{position:static}
}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="page-title">ກະຕ່າສິນຄ້າ <span id="n" style="color:var(--grey-600);font-weight:600;font-size:.6em"></span></h1>
  <div id="root"></div>
  <section class="section" id="recoSec" hidden>
    <div class="sec-head"><h2>ຊື້ຄູ່ກັນເລື້ອຍ</h2><a href="catalogue.html?cat=accessories">ເບິ່ງອຸປະກອນທັງໝົດ</a></div>
    <div class="rail-wrap"><div class="rail" id="reco"></div></div>
  </section>
  <div style="height:56px"></div>
</main>

<script src="layout.js"></script>
<script>
const COUPONS = { SEVENDAY10:0.10 };  // ຕົວຢ່າງ — ແກ້ໄຂໄດ້ຕາມໂປຣໂມຊັນຈິງ
let coupon=null, stockMap={};
try{ coupon=sessionStorage.getItem('sd_coupon'); }catch(_){}

function render(){
  const cart=getCart(), root=document.getElementById('root');
  const count=cart.reduce((s,i)=>s+i.qty,0);
  document.getElementById('n').textContent = count? `(${count} ລາຍການ)` : '';
  if(!cart.length){
    root.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 4h2l2.4 11h11L21 8H7"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
      <h2>ກະຕ່າຍັງວ່າງຢູ່</h2><p>ເລືອກຈັກຍານ ຫຼື ອຸປະກອນ ແລ້ວກົດ "ໃສ່ກະຕ່າ"</p><a class="btn btn-black" href="catalogue.html">ເລືອກຊື້ສິນຄ້າ</a></div>`; return;
  }
  const sub=cart.reduce((s,i)=>s+i.price*i.qty,0), disc=coupon&&COUPONS[coupon]?Math.round(sub*COUPONS[coupon]):0;
  root.innerHTML=`<div class="cart"><div>${cart.map((i,k)=>{
      const st=stockMap[i.sku]; const warn = st!=null && st<i.qty ? `<div class="warn">⚠ ທີ່ຮ້ານເຫຼືອ ${st} — ກະລຸນາປັບຈຳນວນ</div>` : '';
      return `<div class="line">
        <a class="thumb" href="product.html?sku=${encodeURIComponent(i.sku)}">${i.image?`<img src="${i.image}" alt="">`:`<svg viewBox="0 0 120 70"><use href="${iconFor((i.category||'')+' '+i.name)}"/></svg>`}</a>
        <div><h3><a href="product.html?sku=${encodeURIComponent(i.sku)}">${i.name}</a></h3><div class="meta">ລະຫັດ ${i.sku} · ${fmt(i.price)} / ຊິ້ນ</div>
          <div class="ctrl"><div class="qty"><button aria-label="ຫຼຸດ" onclick="chg(${k},-1)">−</button><span>${i.qty}</span><button aria-label="ເພີ່ມ" onclick="chg(${k},1)">+</button></div>
          <button class="rm" onclick="rm(${k})">ລຶບອອກ</button></div>${warn}</div>
        <div class="line-price">${fmt(i.price*i.qty)}</div></div>`; }).join('')}</div>
    <aside class="summary"><h2>ສະຫຼຸບຄຳສັ່ງຊື້</h2>
      <div class="row"><span>ລາຄາສິນຄ້າ</span><span>${fmt(sub)}</span></div>
      ${disc?`<div class="row"><span>ສ່ວນຫຼຸດ (${coupon}) <button class="rm" onclick="setCoupon(null)">ລຶບ</button></span><span>−${fmt(disc)}</span></div>`:''}
      <div class="row"><span>ການຮັບສິນຄ້າ</span><span>ຮັບທີ່ຮ້ານ ຟຣີ</span></div>
      <div class="row total"><span>ລວມທັງໝົດ</span><span>${fmt(sub-disc)}</span></div>
      ${disc?'':`<form class="coupon" onsubmit="event.preventDefault();setCoupon(this.c.value.trim().toUpperCase())"><input name="c" placeholder="ລະຫັດສ່ວນຫຼຸດ" aria-label="ລະຫັດສ່ວນຫຼຸດ"><button>ໃຊ້</button></form>`}
      <a class="btn btn-black" href="checkout.html">ດຳເນີນການສັ່ງຊື້</a>
      <a class="btn btn-line" style="width:100%;border-radius:0;margin-top:8px" href="catalogue.html">ເລືອກຊື້ຕໍ່</a>
      <p class="note">ເຊັກສະຕັອກຈິງອີກຄັ້ງກ່ອນຢືນຢັນຄຳສັ່ງຊື້</p></aside></div>`;
}
function chg(k,d){ const c=getCart(); c[k].qty=Math.max(1,c[k].qty+d); setCart(c); render(); }
function rm(k){ const c=getCart(); const [x]=c.splice(k,1); setCart(c); render(); toast(`ລຶບ ${x.name} ອອກແລ້ວ`); }
function setCoupon(code){
  if(code && !COUPONS[code]){ toast('ລະຫັດນີ້ໃຊ້ບໍ່ໄດ້ ກວດຕົວສະກົດອີກຄັ້ງ'); return; }
  coupon=code; try{ code?sessionStorage.setItem('sd_coupon',code):sessionStorage.removeItem('sd_coupon'); }catch(_){}
  render(); if(code) toast('ໃຊ້ລະຫັດສ່ວນຫຼຸດແລ້ວ');
}
async function checkStock(){
  const cart=getCart(); if(!cart.length) return;
  try{
    const r=await fetch(`${API_URL}?action=checkStock&secret=${API_SECRET}&skus=${cart.map(i=>encodeURIComponent(i.sku)).join(',')}`);
    const j=await r.json(); const list=j.stock||j.data?.stock||j.data||[];
    (Array.isArray(list)?list:[]).forEach(s=>stockMap[s.sku]=Number(s.stock)); render();
  }catch(_){}
}
async function loadReco(){
  try{
    const r=await fetch(`${API_URL}?action=getProducts&secret=${API_SECRET}&limit=300`);
    const inCart=new Set(getCart().map(i=>i.sku));
    const list=apiList(await r.json()).map(mapP).filter(p=>!isService(p)&&p.stock>0&&!inCart.has(p.sku)&&/acc|helmet|light|lock|pump|ອຸປະກອນ|อุปกรณ์|ອາໄຫຼ່|อะไหล่/i.test(p.category)).slice(0,10);
    if(list.length){ window._catalog=list; document.getElementById('reco').innerHTML=list.map(card).join(''); document.getElementById('recoSec').hidden=false; }
  }catch(_){}
}
document.addEventListener('currencychange',()=>{ render(); if(window._catalog.length) document.getElementById('reco').innerHTML=window._catalog.map(card).join(''); });
const _setCart=setCart; setCart=c=>{ _setCart(c); if(document.getElementById('root')) render(); };
render(); checkStock(); loadReco();
</script>
</body>
</html>
