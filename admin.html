<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>Sevenday Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--black:#000;--ink:#1C1C1C;--g6:#6E6E6E;--g3:#D4D4D4;--g2:#E8E8E8;--g1:#F3F3F3;--white:#fff;--ok:#0F7A43;--warn:#9A5B00;--bad:#B3141A;--side:232px;--top:56px;
  --font:'Archivo','Noto Sans Thai','Noto Sans Lao',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--g1);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;font-weight:700;font-size:14px;border:2px solid #000;background:#fff;white-space:nowrap}
.btn.dark{background:#000;color:#fff}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-width:1.5px}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:20px;background:#000}
.login form{width:100%;max-width:380px;background:#fff;padding:32px 28px}
.login .mark{width:46px;height:46px;background:#000;color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;margin-bottom:18px}
.login h1{font-size:26px;font-weight:900;letter-spacing:-.5px}
.login p{color:var(--g6);margin:4px 0 22px}
.login input[type=password]{width:100%;height:50px;border:1px solid var(--g3);padding:0 14px;font:inherit;font-size:16px;margin-bottom:12px}
.login input[type=password]:focus{outline:none;border-color:#000}
.login .btn{width:100%;height:50px}
.login label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--g6);margin-bottom:16px}
.msg{background:#FDECEC;border-left:4px solid var(--bad);padding:10px 12px;font-size:14px;margin-bottom:12px;color:#8A1014}

/* shell */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100%}
.side{background:#000;color:#fff;display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .mark{width:34px;height:34px;background:#fff;color:#000;display:grid;place-items:center;font-weight:900;font-size:17px}
.brand b{display:block;font-weight:900;line-height:1.1}
.brand small{font-size:12px;color:#aaa}
.nav-h{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#888;padding:14px 10px 6px}
.nav a,.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:8px;font-weight:600;font-size:14px;color:#ddd;text-align:left}
.nav a:hover,.nav button:hover{background:#1c1c1c;color:#fff}
.nav a.on{background:#fff;color:#000}
.nav .ic{width:22px;text-align:center;font-size:16px}
.nav .bd{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:#E53935;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.nav a.on .bd{background:#E53935}
.side .grow{flex:1}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.topm{display:none}
.frame{flex:1;width:100%;border:0;background:var(--g1)}

/* dashboard */
.dash{flex:1;overflow-y:auto;padding:28px 32px 48px}
.dash h1{font-size:26px;font-weight:900;letter-spacing:-.5px}
.dash .sub{color:var(--g6);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0 28px}
.kpi{background:#fff;border:1px solid var(--g2);padding:16px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .15s}
.kpi:hover{border-color:#000}
.kpi b{font-size:32px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--g6);font-weight:600}
.kpi.hot b{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.card{background:#fff;border:1px solid var(--g2)}
.card h2{font-size:15px;font-weight:800;padding:14px 16px;border-bottom:1px solid var(--g2);display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.list{list-style:none}
.list li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--g1);cursor:pointer}
.list li:hover{background:var(--g1)}
.list li:last-child{border-bottom:0}
.list .t{flex:1;min-width:0}
.list .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .t small{color:var(--g6);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1.5px solid currentColor}
.pill.new{color:var(--bad)}.pill.mid{color:var(--warn)}.pill.ok{color:var(--ok)}.pill.mute{color:var(--g6)}
.ev{padding:14px 16px;border-bottom:1px solid var(--g1)}
.ev:last-child{border-bottom:0}
.ev-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ev-h b{font-weight:800;font-size:15px}
.ev-h small{color:var(--g6);font-size:12px}
.ev-n{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--g6);margin:6px 0 10px}
.ev-n b{color:var(--ink);font-variant-numeric:tabular-nums}
.ev-n .warn b{color:var(--bad)}
.ev-a{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:28px 16px;text-align:center;color:var(--g6);font-size:14px}
.sk{background:var(--g2);animation:pulse 1.4s ease-in-out infinite;border-radius:4px}
@keyframes pulse{50%{opacity:.5}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#000;color:#fff;padding:12px 18px;font-weight:700;font-size:14px;transition:transform .25s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0)}

/* mobile */
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(84vw,300px);z-index:50;transform:translateX(-100%);transition:transform .22s;padding-top:max(16px,env(safe-area-inset-top))}
  .app.menu .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .topm{display:flex;align-items:center;gap:10px;height:var(--top);padding:0 12px;background:#000;color:#fff;flex-shrink:0;padding-top:env(safe-area-inset-top);box-sizing:content-box}
  .topm .mb{width:40px;height:40px;display:grid;place-items:center;font-size:22px}
  .topm b{flex:1;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topm .bd{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:#E53935;font-size:12px;font-weight:800;display:grid;place-items:center}
  .dash{padding:20px 16px 40px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <form id="lf">
    <div class="mark">7</div>
    <h1>Sevenday Admin</h1>
    <p>ระบบหลังร้าน — ออเดอร์ งานซ่อม และกิจกรรม</p>
    <div id="lmsg"></div>
    <input type="password" id="pw" placeholder="รหัสผ่านแอดมิน" autocomplete="current-password" required>
    <label><input type="checkbox" id="remember" checked> จำการเข้าสู่ระบบในเครื่องนี้ (12 ชม.)</label>
    <button class="btn dark" id="lb">เข้าสู่ระบบ</button>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><div class="mark">7</div><div><b>Sevenday</b><small>Admin</small></div></div>
    <nav class="nav" id="nav">
      <a href="#home" data-p="home"><span class="ic">🏠</span>ภาพรวม</a>
      <div class="nav-h">ร้าน</div>
      <a href="#orders" data-p="orders"><span class="ic">🛒</span>ออเดอร์ &amp; งานซ่อม<span class="bd" id="bdOrders" hidden></span></a>
      <div class="nav-h">กิจกรรม</div>
      <a href="#events" data-p="events"><span class="ic">📅</span>จัดการกิจกรรม</a>
      <a href="#participants" data-p="participants"><span class="ic">👥</span>ผู้สมัคร / ตรวจสลิป<span class="bd" id="bdSlips" hidden></span></a>
      <a href="#checkin" data-p="checkin"><span class="ic">📷</span>Check-in</a>
      <a href="#results" data-p="results"><span class="ic">🏁</span>ผลการแข่งขัน</a>
      <div class="nav-h">อื่นๆ</div>
      <a href="index.html" target="_blank" rel="noopener"><span class="ic">🌐</span>ดูหน้าเว็บ ↗</a>
    </nav>
    <div class="grow"></div>
    <nav class="nav"><button type="button" onclick="logout()"><span class="ic">⎋</span>ออกจากระบบ</button></nav>
  </aside>

  <section class="main">
    <header class="topm">
      <button class="mb" type="button" aria-label="เมนู" onclick="toggleMenu()">☰</button>
      <b id="mTitle">ภาพรวม</b>
      <span class="bd" id="bdM" hidden></span>
    </header>

    <div class="dash" id="dash">
      <h1 id="hello">ภาพรวม</h1>
      <div class="sub" id="today"></div>
      <div class="kpis">
        <button class="kpi" type="button" data-go="orders"><b id="kOrders">–</b><span>ออเดอร์ใหม่</span></button>
        <button class="kpi" type="button" data-go="orders"><b id="kRepair">–</b><span>งานซ่อม / ฟิล์ม ค้าง</span></button>
        <button class="kpi" type="button" data-go="participants"><b id="kSlips">–</b><span>สลิปรอตรวจ</span></button>
        <button class="kpi" type="button" data-go="events"><b id="kEvents">–</b><span>กิจกรรมเปิดรับสมัคร</span></button>
      </div>
      <div class="grid2">
        <div class="card">
          <h2>📥 รายการที่ต้องจัดการ<span class="sp"></span><button class="btn sm" type="button" data-go="orders">ดูทั้งหมด</button></h2>
          <ul class="list" id="todo"><li><div class="sk" style="height:36px;width:100%"></div></li></ul>
        </div>
        <div class="card">
          <h2>📅 กิจกรรม<span class="sp"></span><button class="btn sm dark" type="button" onclick="newEvent()">+ สร้างกิจกรรม</button></h2>
          <div id="evs"><div class="ev"><div class="sk" style="height:60px"></div></div></div>
        </div>
      </div>
    </div>

    <iframe class="frame" id="frame" title="Admin" hidden allow="camera; clipboard-write; fullscreen"></iframe>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* Sevenday Admin Hub — เข้าระบบครั้งเดียว ใช้ได้ทุกหน้า */
if (window.top !== window.self) window.top.location.href = location.href;   // ไม่ให้ hub ซ้อนกันใน iframe

const API_URL = 'https://script.google.com/macros/s/AKfycbyOcu6vlWUnvzRb4GTjEpxz5Amre1KhTYa7wU9PPjVlBd79B8XMzeJER_h-OLrHnxBboA/exec';
const API_SECRET = 'SDdMc3wNjJEevs60n2oMQeGnuI';
const PAGES = {
  home:         { title: 'ภาพรวม' },
  orders:       { title: 'ออเดอร์ & งานซ่อม', file: 'admin-orders.html' },
  events:       { title: 'จัดการกิจกรรม', file: 'admin-events.html' },
  detail:       { title: 'แก้ไขกิจกรรม', file: 'admin-events-detail.html', parent: 'events' },
  participants: { title: 'ผู้สมัคร / ตรวจสลิป', file: 'admin-events-participants.html' },
  checkin:      { title: 'Check-in', file: 'admin-events-checkin.html' },
  results:      { title: 'ผลการแข่งขัน', file: 'admin-events-results.html' },
};
const FILE2P = Object.fromEntries(Object.entries(PAGES).filter(([, v]) => v.file).map(([k, v]) => [v.file, k]));
FILE2P['admin-events-registrations.html'] = 'participants';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k){ try { return sessionStorage.getItem(k) || localStorage.getItem(k) || ''; } catch (_) { return ''; } },
  set(k, v, keep){ try { sessionStorage.setItem(k, v); if (keep) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (_) {} },
  del(k){ try { sessionStorage.removeItem(k); localStorage.removeItem(k); } catch (_) {} },
};
let token = store.get('sd_admin');
if (token) { try { sessionStorage.setItem('sd_admin', token); } catch (_) {} }   // หน้าย่อยอ่านจาก sessionStorage

async function post(action, data){
  const r = await fetch(`${API_URL}?action=${action}&secret=${API_SECRET}`, { method: 'POST', body: JSON.stringify({ action, secret: API_SECRET, token, ...data }) });
  const j = await r.json();
  if (j.ok === false) throw new Error(j.error || 'API error');
  if (j.data && j.data.ok === false) throw new Error(j.data.error || 'API error');
  return j.data;
}
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2600); }

/* ── login ── */
function showLogin(err){
  $('app').hidden = true; $('login').hidden = false;
  $('lmsg').innerHTML = err ? `<div class="msg">${esc(err)}</div>` : '';
  $('pw').value = ''; setTimeout(() => $('pw').focus(), 50);
}
$('lf').onsubmit = async e => {
  e.preventDefault(); const b = $('lb'); b.disabled = true; b.textContent = 'กำลังตรวจสอบ...';
  try {
    const d = await post('adminLogin', { password: $('pw').value });
    token = d.token; store.set('sd_admin', token, $('remember').checked);
    start();
  } catch (x) { showLogin(x.message); }
  finally { b.disabled = false; b.textContent = 'เข้าสู่ระบบ'; }
};
function logout(){
  store.del('sd_admin'); token = '';
  $('frame').src = 'about:blank'; history.replaceState(null, '', location.pathname);
  showLogin();
}

/* ── navigation: #page?query ── */
function parseHash(){
  const h = location.hash.slice(1) || 'home';
  const [p, q] = h.split('?');
  return { p: PAGES[p] ? p : 'home', q: q || '' };
}
function route(){
  const { p, q } = parseHash();
  setActive(p);
  const fr = $('frame');
  if (p === 'home') { fr.hidden = true; $('dash').hidden = false; loadDash(); return; }
  $('dash').hidden = true; fr.hidden = false;
  const want = PAGES[p].file + (q ? '?' + q : '');
  const cur = fr.dataset.at || '';
  if (cur !== want) { fr.dataset.at = want; fr.src = want; }
}
function setActive(p){
  const navP = PAGES[p].parent || p;
  document.querySelectorAll('#nav a[data-p]').forEach(a => a.classList.toggle('on', a.dataset.p === navP));
  $('mTitle').textContent = PAGES[p].title;
  document.title = PAGES[p].title + ' — Sevenday Admin';
  $('app').classList.remove('menu');
}
function go(p, q){ location.hash = p + (q ? '?' + q : ''); }
function toggleMenu(){ $('app').classList.toggle('menu'); }
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go, g.dataset.q || ''); }
  if ($('app').classList.contains('menu') && (e.target.closest('.side a') || (!e.target.closest('.side') && !e.target.closest('.mb')))) $('app').classList.remove('menu');
});

/* ── หน้าย่อยใน iframe: ซ่อนเมนู/ปุ่มออกของหน้าเดิม, sync URL, logout → hub ── */
const EMBED_CSS = `
  .top .mark,.top a.nav-link,.top .crumb,.top a[href^="admin.html"],.top a[href^="admin-events.html"],.top a[href^="admin-orders.html"],
  .top button[onclick^="logout"],.top a[href="index.html"]{display:none!important}
  #loginScreen,#loginGate{display:none!important}
`;
$('frame').addEventListener('load', () => {
  const fr = $('frame'); let w, d;
  try { w = fr.contentWindow; d = fr.contentDocument; } catch (_) { return; }
  if (!d || !w || w.location.href === 'about:blank') return;
  const st = d.createElement('style'); st.textContent = EMBED_CSS; d.head.appendChild(st);
  w.logout = logout;                                    // ปุ่มออกในหน้าย่อย → ออกทั้งระบบ
  d.addEventListener('click', ev => {                  // ลิงก์ไปหน้า hub เอง → อยู่ในกรอบเดิม
    const a = ev.target.closest('a[href]'); if (!a || a.target === '_blank') return;
    const u = new URL(a.getAttribute('href'), w.location.href);
    if (u.origin !== location.origin) return;
    const file = u.pathname.split('/').pop();
    if (file === 'admin.html') { ev.preventDefault(); go('home'); }
    else if (FILE2P[file] && file !== 'admin-events-registrations.html') { ev.preventDefault(); go(FILE2P[file], u.search.slice(1)); }
  }, true);
  // หน้าย่อยเปลี่ยนหน้าเอง (เช่น บันทึกกิจกรรมใหม่) → อัปเดตเมนู/ลิงก์
  const file = w.location.pathname.split('/').pop(), p = FILE2P[file];
  if (p) {
    const at = file + w.location.search; fr.dataset.at = at;
    const h = '#' + p + (w.location.search ? '?' + w.location.search.slice(1) : '');
    if (location.hash !== h) history.replaceState(null, '', h);
    setActive(p);
  }
  // token หมดอายุ: หน้าย่อยจะลบ sd_admin → กลับไปหน้าเข้าระบบของ hub
  const iv = setInterval(() => {
    if (fr.contentWindow !== w) return clearInterval(iv);
    let t = ''; try { t = sessionStorage.getItem('sd_admin') || ''; } catch (_) {}
    if (!t && token) { clearInterval(iv); store.del('sd_admin'); token = ''; showLogin('หมดเวลาเข้าสู่ระบบ — กรุณาเข้าใหม่'); }
  }, 1500);
});

/* ── dashboard ── */
const OPEN = s => !['ສຳເລັດ', 'ຍົກເລີກ'].includes(s);
const TYPE = { order: ['🛒', 'ออเดอร์'], booking: ['🔧', 'จองซ่อม'], film: ['🎨', 'ฟิล์ม'] };
const EV_ST = { DRAFT: ['ร่าง', 'mute'], PUBLISHED: ['ประกาศแล้ว', 'mid'], REGISTRATION_OPEN: ['เปิดรับสมัคร', 'ok'], REGISTRATION_CLOSED: ['ปิดรับสมัคร', 'mid'], EVENT_FINISHED: ['จบแล้ว', 'mute'], CANCELLED: ['ยกเลิก', 'mute'] };
const thDate = d => { if (!d) return ''; const x = new Date(String(d).slice(0, 10) + 'T00:00:00'); return isNaN(x) ? d : x.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }); };
const ago = d => { const m = Math.round((Date.now() - new Date(d)) / 60000); return m < 1 ? 'เมื่อกี้' : m < 60 ? m + ' นาทีที่แล้ว' : m < 1440 ? Math.round(m / 60) + ' ชม.ที่แล้ว' : Math.round(m / 1440) + ' วันที่แล้ว'; };
let dashBusy = false;
async function loadDash(){
  if (dashBusy) return; dashBusy = true;
  $('today').textContent = new Date().toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const [inbox, sum] = await Promise.allSettled([post('adminList', { days: 60 }), post('evt.adminSummary', {})]);
  dashBusy = false;
  const auth = [inbox, sum].some(r => r.status === 'rejected' && /ADMIN_AUTH/.test(r.reason.message));
  if (auth) { store.del('sd_admin'); token = ''; return showLogin('หมดเวลาเข้าสู่ระบบ — กรุณาเข้าใหม่'); }
  // ร้าน
  if (inbox.status === 'fulfilled') {
    const items = inbox.value.items || [];
    const nNew = items.filter(i => i.type === 'order' && i.status === 'ໃໝ່').length;
    const nRep = items.filter(i => i.type !== 'order' && OPEN(i.status)).length;
    $('kOrders').textContent = nNew; $('kRepair').textContent = nRep;
    $('kOrders').parentElement.classList.toggle('hot', nNew > 0);
    badge('bdOrders', items.filter(i => i.status === 'ໃໝ່').length);
    const todo = items.filter(i => OPEN(i.status)).sort((a, b) => (b.status === 'ໃໝ່') - (a.status === 'ໃໝ່') || new Date(b.date) - new Date(a.date)).slice(0, 8);
    $('todo').innerHTML = todo.length ? todo.map(i => `<li data-go="orders">
        <span style="font-size:20px">${(TYPE[i.type] || TYPE.booking)[0]}</span>
        <div class="t"><b>${esc(i.name || '-')} · ${esc((TYPE[i.type] || TYPE.booking)[1])}</b><small>${esc(String(i.details || '').split('\n')[0])} · ${ago(i.date)}</small></div>
        <span class="pill ${i.status === 'ໃໝ່' ? 'new' : 'mid'}">${esc(i.status)}</span></li>`).join('')
      : '<li class="empty" style="cursor:default">ไม่มีงานค้าง 🎉</li>';
  } else {
    $('todo').innerHTML = `<li class="empty" style="cursor:default">โหลดออเดอร์ไม่ได้: ${esc(inbox.reason.message)}</li>`;
  }
  // กิจกรรม
  if (sum.status === 'fulfilled') {
    const evs = sum.value.events || [];
    $('kSlips').textContent = sum.value.slips_total || 0;
    $('kSlips').parentElement.classList.toggle('hot', sum.value.slips_total > 0);
    badge('bdSlips', sum.value.slips_total || 0);
    $('kEvents').textContent = evs.filter(e => e.status === 'REGISTRATION_OPEN').length;
    const today = new Date().toISOString().slice(0, 10);
    const show = evs.filter(e => e.status !== 'CANCELLED')
      .sort((a, b) => (b.event_date >= today) - (a.event_date >= today) || (a.event_date >= today ? String(a.event_date).localeCompare(b.event_date) : String(b.event_date).localeCompare(a.event_date)))
      .slice(0, 6);
    $('evs').innerHTML = show.length ? show.map(e => {
      const st = EV_ST[e.status] || [e.status, 'mute'], q = 'event_id=' + encodeURIComponent(e.event_id);
      const dayOf = e.event_date === today;
      return `<div class="ev">
        <div class="ev-h"><b>${esc(e.event_name)}</b><span class="pill ${st[1]}">${esc(st[0])}</span><small>${esc(thDate(e.event_date))}</small></div>
        <div class="ev-n"><span>สมัคร <b>${e.registered}${e.capacity ? '/' + e.capacity : ''}</b></span><span>ชำระแล้ว <b>${e.paid}</b></span>
          <span class="${e.slips ? 'warn' : ''}">สลิปรอตรวจ <b>${e.slips}</b></span><span>Check-in <b>${e.checked_in}</b></span>
          <span>รายรับ <b>₭${Math.round(e.revenue_lak).toLocaleString('en-US')}</b></span></div>
        <div class="ev-a">
          <button class="btn sm ${e.slips ? 'dark' : ''}" type="button" data-go="participants" data-q="${q}">👥 ผู้สมัคร${e.slips ? ' · ตรวจสลิป ' + e.slips : ''}</button>
          <button class="btn sm ${dayOf ? 'dark' : ''}" type="button" data-go="checkin" data-q="${q}">📷 Check-in</button>
          <button class="btn sm" type="button" data-go="results" data-q="${q}">🏁 ผล</button>
          <button class="btn sm" type="button" data-go="detail" data-q="${q}">✏️ แก้ไข</button>
        </div></div>`;
    }).join('') : '<div class="empty">ยังไม่มีกิจกรรม — กด “+ สร้างกิจกรรม”</div>';
  } else {
    $('evs').innerHTML = `<div class="empty">โหลดกิจกรรมไม่ได้: ${esc(sum.reason.message)}</div>`;
  }
  const tot = (+$('bdOrders').textContent || 0) + (+$('bdSlips').textContent || 0);
  $('bdM').hidden = !tot; $('bdM').textContent = tot;
}
function badge(id, n){ const el = $(id); el.hidden = !n; el.textContent = n; }
function newEvent(){ go('detail'); }

/* ── start ── */
async function start(){
  $('login').hidden = true; $('app').hidden = false;
  route();
  if (parseHash().p !== 'home') loadDash();   // อัปเดตตัวเลขบนเมนู
}
setInterval(() => { if (token && !$('app').hidden) loadDash(); }, 120000);
if (token) start(); else showLogin();
</script>
</body>
