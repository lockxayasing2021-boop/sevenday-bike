<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ສັ່ງຊື້ — Sevenday Bike</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sevenday.css">
<style>
.crumbs{font-size:13px;color:var(--grey-600);padding:18px 0 6px}
.crumbs a:hover{text-decoration:underline}
.page-title{font-size:clamp(28px,3.4vw,44px);font-weight:800;letter-spacing:-.01em;line-height:1.05}
.page-sub{color:var(--grey-600);margin:8px 0 0;max-width:62ch}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input,.field select,.field textarea{height:48px;border:1px solid var(--grey-300);padding:0 14px;font:inherit;background:#fff;border-radius:0}
.field textarea{height:96px;padding:12px 14px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#000;box-shadow:0 0 0 1px #000}
.field .err{font-size:13px;font-weight:600;display:none}
.field.invalid input,.field.invalid select{border-color:#000;border-width:2px}
.field.invalid .err{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--grey-300);padding:16px;cursor:pointer}
.choice:has(input:checked){border:2px solid #000;padding:15px}
.choice input{width:20px;height:20px;accent-color:#000;margin-top:2px}
.choice b{display:block}.choice small{color:var(--grey-600)}
.alert{background:var(--grey-100);border-left:4px solid #000;padding:14px 16px;font-size:14px}
@media (max-width:860px){.row2{grid-template-columns:1fr}}

.co{display:grid;grid-template-columns:1fr 400px;gap:48px;padding:24px 0 72px;align-items:start}
.step{border-top:2px solid #000;padding:22px 0 30px}
.step h2{font-size:20px;font-weight:800;margin-bottom:18px;display:flex;gap:12px;align-items:center}
.step h2 i{font-style:normal;width:28px;height:28px;background:#000;color:#fff;display:grid;place-items:center;font-size:14px;border-radius:50%}
.stack{display:flex;flex-direction:column;gap:14px}
.sum{background:var(--grey-100);padding:24px;position:sticky;top:100px}
.sum h2{font-size:20px;font-weight:800;margin-bottom:14px}
.it{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--grey-300);font-size:14px}
.it .th{aspect-ratio:1;background:#fff;display:grid;place-items:center;position:relative}
.it .th svg{width:80%;color:var(--grey-600)}.it .th img{width:100%;height:100%;object-fit:contain}
.it .th span{position:absolute;top:-6px;right:-6px;background:#000;color:#fff;font-size:11px;font-weight:700;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.it b{font-weight:700}
.r{display:flex;justify-content:space-between;padding:7px 0}
.r.t{border-top:2px solid #000;margin-top:10px;padding-top:14px;font-weight:800;font-size:20px}
.sum .btn{width:100%;height:56px;border-radius:0;margin-top:16px}
.secure{font-size:12px;color:var(--grey-600);text-align:center;margin-top:10px}
.done{max-width:620px;margin:0 auto;text-align:center;padding:72px 0 96px}
.done .ok{width:72px;height:72px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;margin:0 auto 20px;font-size:34px}
.done h1{font-size:34px;font-weight:800;letter-spacing:-.01em;margin-bottom:10px}
.done .bill{display:inline-block;border:2px solid #000;padding:10px 18px;font-weight:800;font-size:20px;margin:14px 0 22px}
.done ol{text-align:left;background:var(--grey-100);padding:20px 20px 20px 40px;margin:0 0 28px;line-height:1.9}
@media (max-width:860px){.co{grid-template-columns:1fr}.sum{position:static;order:-1}}

</style>
</head>
<body>

<main class="wrap" id="main">
  <nav class="crumbs"><a href="cart.html">ກະຕ່າ</a> / ສັ່ງຊື້</nav>
  <h1 class="page-title">ສັ່ງຊື້</h1>
  <div class="co">
    <form id="form" novalidate onsubmit="event.preventDefault()">
      <section class="step"><h2><i>1</i>ຂໍ້ມູນຜູ້ສັ່ງ</h2>
        <div class="stack">
          <div class="row2">
            <div class="field"><label for="name">ຊື່ ແລະ ນາມສະກຸນ</label><input id="name" autocomplete="name" required><span class="err">ໃສ່ຊື່ຜູ້ຮັບສິນຄ້າ</span></div>
            <div class="field"><label for="phone">ເບີໂທ / WhatsApp</label><input id="phone" type="tel" autocomplete="tel" placeholder="020XXXXXXXX" required><span class="err">ໃສ່ເບີໂທ 8 ໂຕຂຶ້ນໄປ</span></div>
          </div>
          <div class="field"><label for="email">ອີເມວ (ບໍ່ບັງຄັບ)</label><input id="email" type="email" autocomplete="email"></div>
          <p id="loginHint" style="font-size:14px">ມີບັນຊີແລ້ວ? <a href="login.html" style="text-decoration:underline;font-weight:700">ເຂົ້າສູ່ລະບົບ</a> ເພື່ອສະສົມແຕ້ມ</p>
        </div>
      </section>
      <section class="step"><h2><i>2</i>ການຮັບສິນຄ້າ</h2>
        <div class="stack">
          <label class="choice"><input type="radio" name="del" value="ຮັບທີ່ຮ້ານ" checked><div><b>ຮັບທີ່ຮ້ານ — ຟຣີ</b><small><span data-shop="address"></span> · ກຽມໃຫ້ພາຍໃນ 1 ວັນ</small></div></label>
          <label class="choice"><input type="radio" name="del" value="ສົ່ງໃນວຽງຈັນ"><div><b>ສົ່ງໃນນະຄອນຫຼວງວຽງຈັນ</b><small>ຮ້ານຈະໂທແຈ້ງຄ່າສົ່ງກ່ອນອອກເດີນທາງ</small></div></label>
          <div class="field" id="addrBox" hidden><label for="addr">ທີ່ຢູ່ຈັດສົ່ງ</label><textarea id="addr" placeholder="ບ້ານ, ເມືອງ, ຈຸດສັງເກດ"></textarea><span class="err">ໃສ່ທີ່ຢູ່ຈັດສົ່ງ</span></div>
        </div>
      </section>
      <section class="step"><h2><i>3</i>ການຊຳລະເງິນ</h2>
        <div class="stack">
          <label class="choice"><input type="radio" name="pay" value="ໂອນ BCEL One" checked><div><b>ໂອນຜ່ານ BCEL One</b><small>ຮ້ານຈະສົ່ງ QR ໃຫ້ທາງ WhatsApp ຫຼັງຢືນຢັນ</small></div></label>
          <label class="choice"><input type="radio" name="pay" value="ຈ່າຍທີ່ຮ້ານ"><div><b>ຈ່າຍທີ່ຮ້ານ ຕອນຮັບສິນຄ້າ</b><small>ເງິນສົດ LAK, THB ຫຼື USD</small></div></label>
          <div class="field"><label for="notes">ໝາຍເຫດເຖິງຮ້ານ (ບໍ່ບັງຄັບ)</label><textarea id="notes" placeholder="ເຊັ່ນ ເວລາທີ່ຈະມາຮັບ"></textarea></div>
        </div>
      </section>
    </form>
    <aside class="sum">
      <h2>ຄຳສັ່ງຊື້ຂອງທ່ານ</h2>
      <div id="items"></div>
      <div id="totals"></div>
      <div class="alert" id="stockMsg" hidden></div>
      <button class="btn btn-black" id="placeBtn" onclick="placeOrder()">ຢືນຢັນຄຳສັ່ງຊື້</button>
      <p class="secure">ກວດສະຕັອກຈິງກ່ອນບັນທຶກຄຳສັ່ງຊື້</p>
    </aside>
  </div>
</main>

<script src="layout.js"></script>
<script>

const COUPONS={SEVENDAY10:0.10};
let coupon=null; try{coupon=sessionStorage.getItem('sd_coupon');}catch(_){}
const $=id=>document.getElementById(id);
function totals(){ const c=getCart(); const sub=c.reduce((s,i)=>s+i.price*i.qty,0); const d=coupon&&COUPONS[coupon]?Math.round(sub*COUPONS[coupon]):0; return {sub,d,total:sub-d}; }
function renderSum(){
  const c=getCart();
  if(!c.length){ $('main').innerHTML='<div class="done"><h1>ກະຕ່າຍັງວ່າງຢູ່</h1><p style="color:var(--grey-600);margin-bottom:24px">ເລືອກສິນຄ້າກ່ອນ ແລ້ວຈຶ່ງສັ່ງຊື້</p><a class="btn btn-black" href="catalogue.html">ເລືອກຊື້ສິນຄ້າ</a></div>'; return; }
  $('items').innerHTML=c.map(i=>`<div class="it"><div class="th">${i.image?`<img src="${i.image}" alt="">`:`<svg viewBox="0 0 120 70"><use href="${iconFor((i.category||'')+' '+i.name)}"/></svg>`}<span>${i.qty}</span></div><b>${i.name}</b><span>${fmt(i.price*i.qty)}</span></div>`).join('');
  const t=totals();
  $('totals').innerHTML=`<div class="r" style="margin-top:10px"><span>ລາຄາສິນຄ້າ</span><span>${fmt(t.sub)}</span></div>${t.d?`<div class="r"><span>ສ່ວນຫຼຸດ ${coupon}</span><span>−${fmt(t.d)}</span></div>`:''}<div class="r"><span>ຄ່າສົ່ງ</span><span id="shipTxt">ຟຣີ</span></div><div class="r t"><span>ລວມ</span><span>${fmt(t.total)}</span></div><div style="font-size:12px;color:var(--grey-600);text-align:right">${currency==='THB'?'≈ ₭'+Math.round(t.total*THB_TO_LAK).toLocaleString():'≈ ฿'+Math.round(t.total).toLocaleString()}</div>`;
  shipTxt();
}
function shipTxt(){ const el=$('shipTxt'); if(el) el.textContent=document.querySelector('[name=del]:checked').value==='ຮັບທີ່ຮ້ານ'?'ຟຣີ':'ແຈ້ງພາຍຫຼັງ'; }
document.querySelectorAll('[name=del]').forEach(r=>r.onchange=()=>{ $('addrBox').hidden=document.querySelector('[name=del]:checked').value==='ຮັບທີ່ຮ້ານ'; shipTxt(); });

try{ const u=JSON.parse(sessionStorage.getItem('sd_user')||'null'); if(u){ $('name').value=u.name||''; $('phone').value=u.phone||''; $('email').value=u.email||''; $('loginHint').textContent='ເຂົ້າສູ່ລະບົບແລ້ວ — ຄຳສັ່ງຊື້ນີ້ຈະໄດ້ແຕ້ມສະສົມ'; } }catch(_){}

function setErr(id,bad){ $(id).closest('.field').classList.toggle('invalid',bad); return bad; }
function validate(){
  const ship = document.querySelector('[name=del]:checked').value!=='ຮັບທີ່ຮ້ານ';
  const bad = [setErr('name', !$('name').value.trim()), setErr('phone', $('phone').value.replace(/\D/g,'').length<8), setErr('addr', ship && !$('addr').value.trim())].some(Boolean);
  if(bad) document.querySelector('.invalid input,.invalid textarea')?.focus();
  return !bad;
}
async function placeOrder(){
  if(!validate()) return;
  const btn=$('placeBtn'), msg=$('stockMsg');
  btn.disabled=true; btn.textContent='ກຳລັງກວດສະຕັອກ...'; msg.hidden=true;
  const cart=getCart();
  try{
    const r=await fetch(`${API_URL}?action=checkStock&secret=${API_SECRET}&skus=${cart.map(i=>encodeURIComponent(i.sku)).join(',')}`);
    const j=await r.json(); const list=j.stock||j.data?.stock||j.data||[]; const m={}; (Array.isArray(list)?list:[]).forEach(s=>m[s.sku]=Number(s.stock));
    const short=cart.filter(i=>m[i.sku]!=null && m[i.sku]<i.qty);
    if(short.length){ msg.hidden=false; msg.innerHTML='ສິນຄ້າບໍ່ພໍ: '+short.map(i=>`<b>${i.name}</b> (ເຫຼືອ ${m[i.sku]})`).join(', ')+' — <a href="cart.html" style="text-decoration:underline">ປັບຈຳນວນໃນກະຕ່າ</a>'; btn.disabled=false; btn.textContent='ຢືນຢັນຄຳສັ່ງຊື້'; return; }
  }catch(_){}
  btn.textContent='ກຳລັງບັນທຶກຄຳສັ່ງຊື້...';
  const t=totals(), del=document.querySelector('[name=del]:checked').value, pay=document.querySelector('[name=pay]:checked').value;
  const k = t.d ? 1-COUPONS[coupon] : 1;
  try{
    const res=await apiPost('createSale',{
      items: cart.map(i=>({sku:i.sku,name:i.name,qty:i.qty,price_thb:Math.round(i.price*k)})),
      customer:{name:$('name').value.trim(),phone:$('phone').value.trim(),email:$('email').value.trim()},
      payment_method:pay, delivery_method:del+($('addr').value.trim()?' — '+$('addr').value.trim():''),
      currency, notes:[$('notes').value.trim(), coupon?'ລະຫັດສ່ວນຫຼຸດ: '+coupon:''].filter(Boolean).join(' | ')
    });
    setCart([]); try{sessionStorage.removeItem('sd_coupon');}catch(_){}
    showDone(res.bill_id, pay, t.total);
  }catch(e){
    msg.hidden=false; msg.innerHTML=`ບັນທຶກຄຳສັ່ງຊື້ບໍ່ສຳເລັດ (${e.message}). ລອງອີກຄັ້ງ ຫຼື <a data-shop="whatsapp" style="text-decoration:underline">ສົ່ງ WhatsApp ຫາຮ້ານ</a>`; fillShop();
    btn.disabled=false; btn.textContent='ຢືນຢັນຄຳສັ່ງຊື້';
  }
}
function showDone(bill,pay,total){
  scrollTo(0,0);
  $('main').innerHTML=`<div class="done"><div class="ok">✓</div><h1>ໄດ້ຮັບຄຳສັ່ງຊື້ແລ້ວ</h1><p>ເລກທີ່ຄຳສັ່ງຊື້ຂອງທ່ານ</p><div class="bill">${bill||'—'}</div>
   <ol><li>ຮ້ານຈະໂທ ຫຼື WhatsApp ຢືນຢັນພາຍໃນ 2 ຊົ່ວໂມງ (ເວລາເປີດຮ້ານ)</li>${pay.includes('BCEL')?`<li>ໂອນ ${fmt(total)} ຕາມ QR ທີ່ຮ້ານສົ່ງໃຫ້</li>`:`<li>ຈ່າຍ ${fmt(total)} ຕອນມາຮັບສິນຄ້າ</li>`}<li>ສະແດງເລກທີ່ຄຳສັ່ງຊື້ນີ້ເມື່ອມາຮັບທີ່ຮ້ານ</li></ol>
   <a class="btn btn-black" href="index.html">ກັບໜ້າຫຼັກ</a> <a class="btn btn-line" href="account.html" style="margin-left:8px">ເບິ່ງປະຫວັດການສັ່ງຊື້</a></div>`;
}
document.addEventListener('currencychange',renderSum);
renderSum();

</script>
</body>
</html>
