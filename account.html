<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ບັນຊີຂອງຂ້ອຍ — Sevenday Bike</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --black:#000;--ink:#1C1C1C;--grey-900:#2B2B2B;--grey-600:#6E6E6E;--grey-300:#D4D4D4;
  --grey-100:#F3F3F3;--white:#FFF;
  --font:'Archivo','Noto Sans Lao',system-ui,sans-serif;
  --wrap:1320px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--ink);background:var(--white);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--black);outline-offset:2px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ── Announcement ── */
.announce{background:var(--black);color:var(--white);font-size:13px;text-align:center;padding:8px 20px}
.announce a{text-decoration:underline;text-underline-offset:3px}

/* ── Header ── */
.header{background:var(--white);border-bottom:1px solid var(--grey-300);position:sticky;top:0;z-index:50}
.header-row{display:flex;align-items:center;gap:24px;height:76px}
.menu-btn{display:none;width:40px;height:40px;align-items:center;justify-content:center}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mark{width:42px;height:42px;background:var(--black);color:var(--white);display:grid;place-items:center;font-weight:900;font-size:20px;letter-spacing:-1px}
.logo-text{font-weight:900;font-size:22px;letter-spacing:-.5px;line-height:1}
.logo-text small{display:block;font-size:11px;font-weight:500;color:var(--grey-600);letter-spacing:0;margin-top:3px}
.search{flex:1;display:flex;max-width:640px;border:2px solid var(--black);border-radius:999px;overflow:hidden;height:46px}
.search input{flex:1;border:none;padding:0 20px;font:inherit;font-size:15px;outline:none;min-width:0}
.search button{width:56px;background:var(--black);color:var(--white);display:grid;place-items:center}
.hdr-links{display:flex;align-items:center;gap:4px;margin-left:auto}
.hdr-link{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;position:relative}
.hdr-link:hover{background:var(--grey-100)}
.hdr-link svg{width:24px;height:24px}
.cart-count{position:absolute;top:0;right:4px;background:var(--black);color:var(--white);font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.cur-toggle{display:flex;border:1px solid var(--grey-300);border-radius:999px;overflow:hidden;font-size:12px;font-weight:700;margin-right:6px}
.cur-toggle button{padding:6px 10px}
.cur-toggle button.on{background:var(--black);color:var(--white)}

/* ── Mega nav ── */
.nav{background:var(--black);color:var(--white);position:relative}
.nav-list{display:flex;list-style:none;height:50px}
.nav-item{position:static}
.nav-item>a{display:flex;align-items:center;height:100%;padding:0 16px;font-weight:700;font-size:14px;white-space:nowrap}
.nav-item>a:hover,.nav-item:focus-within>a{background:var(--grey-900)}
.nav-item.sale>a{background:var(--white);color:var(--black);margin-left:auto}
.nav-list .push{margin-left:auto}
.mega{position:absolute;left:0;right:0;top:100%;background:var(--white);color:var(--ink);border-bottom:1px solid var(--grey-300);box-shadow:0 18px 30px -18px rgba(0,0,0,.35);display:none}
.nav-item:hover .mega,.nav-item:focus-within .mega{display:block}
.mega-inner{display:grid;grid-template-columns:repeat(4,1fr) 1.3fr;gap:32px;padding:28px 20px 36px}
.mega h4{font-size:15px;font-weight:800;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--black)}
.mega ul{list-style:none}
.mega li a{display:block;padding:5px 0;font-size:14px;color:var(--grey-900)}
.mega li a:hover{text-decoration:underline}
.mega-feature{background:var(--black);color:var(--white);padding:24px;display:flex;flex-direction:column;justify-content:flex-end;min-height:200px}
.mega-feature b{font-size:22px;font-weight:900;line-height:1.15;margin-bottom:12px}
.mega-feature span{font-size:13px;text-decoration:underline}

/* ── Collect strip ── */
.collect{background:var(--grey-100);font-size:13px}
.collect .wrap{display:flex;align-items:center;gap:10px;height:42px}
.collect strong{font-weight:700}
.collect a{margin-left:auto;text-decoration:underline;font-weight:600}

/* ── Hero carousel ── */
.hero{position:relative;overflow:hidden;background:var(--black)}
.hero-track{display:flex;transition:transform .6s cubic-bezier(.7,0,.3,1)}
.slide{min-width:100%;height:440px;display:grid;grid-template-columns:1fr 1fr;align-items:center}
.slide-text{padding:0 0 0 max(20px,calc((100vw - var(--wrap))/2 + 20px))}
.slide h2{font-size:clamp(34px,4.6vw,64px);font-weight:900;line-height:1.02;letter-spacing:-1.5px;margin-bottom:16px}
.slide p{font-size:17px;max-width:440px;margin-bottom:28px;opacity:.85}
.slide-art{height:100%;display:grid;place-items:center}
.slide-art svg{width:min(520px,90%);height:auto}
.s-dark{background:var(--black);color:var(--white)}
.s-grey{background:var(--grey-100);color:var(--black)}
.s-mid{background:#3A3A3A;color:var(--white)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 28px;border-radius:999px;font-weight:700;font-size:15px;transition:background .2s,color .2s}
.btn-white{background:var(--white);color:var(--black)}
.btn-white:hover{background:var(--grey-300)}
.btn-black{background:var(--black);color:var(--white)}
.btn-black:hover{background:var(--grey-900)}
.btn-line{border:2px solid currentColor}
.hero-dots{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.hero-dots button{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.4);border:1px solid rgba(0,0,0,.2)}
.hero-dots button.on{background:var(--white);width:28px;border-radius:5px}
.hero-arrow{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:var(--white);color:var(--black);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.hero-arrow.prev{left:16px}.hero-arrow.next{right:16px}

/* ── Sections ── */
.section{padding:56px 0 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.sec-head h2{font-size:clamp(24px,2.6vw,32px);font-weight:900;letter-spacing:-.6px;line-height:1.1}
.sec-head a{font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:4px;white-space:nowrap}

/* Categories */
.cats{display:grid;grid-template-columns:repeat(9,1fr);gap:16px}
.cat{text-align:center}
.cat-circle{aspect-ratio:1;border-radius:50%;background:var(--grey-100);display:grid;place-items:center;margin-bottom:10px;transition:background .2s}
.cat:hover .cat-circle{background:var(--grey-300)}
.cat-circle svg{width:56%;height:auto}
.cat span{font-weight:700;font-size:14px;line-height:1.25;display:block}

/* Promo tiles */
.promo-sm{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{position:relative;aspect-ratio:4/3;padding:22px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.tile b{font-size:22px;font-weight:900;line-height:1.1;letter-spacing:-.4px;position:relative;z-index:1}
.tile span{font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;position:relative;z-index:1}
.tile .big{font-size:44px;font-weight:900;letter-spacing:-1.5px;line-height:1}
.tile svg.bg{position:absolute;right:-10%;bottom:-12%;width:70%;opacity:.18}
.t-black{background:var(--black);color:var(--white)}
.t-grey{background:var(--grey-100)}
.t-line{border:2px solid var(--black)}
.t-mid{background:#3A3A3A;color:var(--white)}
.promo-lg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.promo-lg .tile{aspect-ratio:16/8;padding:32px}
.promo-lg .tile b{font-size:clamp(24px,2.8vw,36px)}

/* Product rail */
.rail-wrap{position:relative}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 64px)/5);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.rail::-webkit-scrollbar{display:none}
.rail-btn{position:absolute;top:34%;width:42px;height:42px;border-radius:50%;background:var(--white);border:1px solid var(--grey-300);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:2}
.rail-btn.prev{left:-14px}.rail-btn.next{right:-14px}
.card{scroll-snap-align:start;display:flex;flex-direction:column;position:relative}
.card-img{aspect-ratio:1;background:var(--grey-100);display:grid;place-items:center;margin-bottom:12px;position:relative;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;transition:transform .3s}
.card:hover .card-img img{transform:scale(1.04)}
.card-img svg{width:70%;color:var(--grey-600)}
.badges{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;z-index:1}
.badge{font-size:12px;font-weight:800;padding:4px 8px;line-height:1.2}
.b-off{background:var(--black);color:var(--white)}
.b-low{background:var(--white);color:var(--black);border:1px solid var(--black)}
.b-new{background:var(--grey-300);color:var(--black)}
.b-out{background:var(--grey-600);color:var(--white)}
.card-brand{font-size:13px;color:var(--grey-600);font-weight:600}
.card-name{font-weight:700;font-size:15px;line-height:1.3;margin:2px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.card-name:hover{text-decoration:underline}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price .now{font-size:18px;font-weight:900}
.price .was{font-size:13px;color:var(--grey-600);text-decoration:line-through}
.card.on-sale .price .now{background:var(--black);color:var(--white);padding:0 6px}
.sizes{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sizes span{font-size:11px;font-weight:700;border:1px solid var(--grey-300);padding:3px 7px}
.add-btn{margin-top:12px;height:40px;border:2px solid var(--black);border-radius:999px;font-weight:700;font-size:14px;transition:background .2s,color .2s}
.add-btn:hover{background:var(--black);color:var(--white)}
.add-btn:disabled{border-color:var(--grey-300);color:var(--grey-600);cursor:not-allowed;background:none}
.skeleton .card-img{animation:pulse 1.2s infinite}
.skeleton .card-name,.skeleton .price{background:var(--grey-100);color:transparent;min-height:16px}
@keyframes pulse{50%{opacity:.5}}

/* Brands */
.brands{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--grey-300);border-left:1px solid var(--grey-300)}
.brands a{height:96px;display:grid;place-items:center;border-right:1px solid var(--grey-300);border-bottom:1px solid var(--grey-300);font-weight:900;font-size:20px;letter-spacing:-.5px;color:var(--grey-600);transition:color .2s,background .2s}
.brands a:hover{color:var(--black);background:var(--grey-100)}

/* Workshop band */
.workshop{background:var(--black);color:var(--white);margin-top:56px}
.workshop .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;padding-top:56px;padding-bottom:56px;align-items:center}
.workshop h2{font-size:clamp(28px,3.4vw,44px);font-weight:900;letter-spacing:-1px;line-height:1.05;margin-bottom:14px}
.workshop p{opacity:.8;max-width:480px;margin-bottom:24px}
.pkgs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--grey-900);border:1px solid var(--grey-900)}
.pkg{background:var(--black);padding:22px 18px}
.pkg b{display:block;font-size:17px;font-weight:800;margin-bottom:4px}
.pkg .p{font-size:22px;font-weight:900;margin:8px 0}
.pkg small{display:block;font-size:12px;opacity:.65;line-height:1.45}

/* USP */
.usp{border-top:1px solid var(--grey-300);border-bottom:1px solid var(--grey-300);margin-top:56px}
.usp .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.usp a{display:flex;gap:14px;align-items:center;padding:26px 16px}
.usp a+a{border-left:1px solid var(--grey-300)}
.usp svg{width:34px;height:34px;flex-shrink:0}
.usp b{display:block;font-size:15px;font-weight:800}
.usp small{color:var(--grey-600);font-size:13px}

/* SEO / FAQ */
.about-shop{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.about-shop p{color:var(--grey-900);margin-bottom:12px;max-width:62ch}
.faq details{border-bottom:1px solid var(--grey-300)}
.faq summary{font-weight:700;padding:16px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::after{content:'+';font-size:22px;line-height:1}
.faq details[open] summary::after{content:'–'}
.faq details p{padding-bottom:16px;color:var(--grey-900)}

/* Newsletter */
.news{background:var(--grey-100);margin-top:56px}
.news .wrap{display:flex;align-items:center;justify-content:space-between;gap:32px;padding-top:36px;padding-bottom:36px;flex-wrap:wrap}
.news h3{font-size:24px;font-weight:900;letter-spacing:-.4px}
.news small{color:var(--grey-600)}
.news form{display:flex;flex:1;max-width:520px;min-width:260px}
.news input{flex:1;height:50px;border:2px solid var(--black);border-right:none;padding:0 18px;font:inherit;min-width:0}
.news button{height:50px;padding:0 26px;background:var(--black);color:var(--white);font-weight:700}

/* Footer */
.footer{background:var(--black);color:#BDBDBD;font-size:14px}
.foot-grid{display:grid;grid-template-columns:1.4fr repeat(5,1fr);gap:32px;padding:56px 0 40px}
.footer h4{color:var(--white);font-size:15px;font-weight:800;margin-bottom:14px}
.footer ul{list-style:none}
.footer li{margin-bottom:9px}
.footer a:hover{color:var(--white);text-decoration:underline}
.foot-brand p{margin:14px 0;max-width:300px;line-height:1.6}
.foot-brand .logo-mark{background:var(--white);color:var(--black)}
.foot-brand .logo-text{color:var(--white)}
.social{display:flex;gap:10px}
.social a{width:38px;height:38px;border:1px solid #444;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--white)}
.foot-bottom{border-top:1px solid #333;padding:22px 0;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px}
.pay{display:flex;gap:8px;flex-wrap:wrap}
.pay span{border:1px solid #444;padding:4px 10px;font-weight:700;font-size:12px;color:var(--white)}

/* Drawer (mobile) */
.drawer{position:fixed;inset:0;z-index:100;display:none}
.drawer.open{display:block}
.drawer-bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.drawer-panel{position:absolute;top:0;left:0;bottom:0;width:min(360px,88vw);background:var(--white);overflow-y:auto;padding-bottom:40px}
.drawer-top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--black);color:var(--white);font-weight:800}
.drawer details{border-bottom:1px solid var(--grey-300)}
.drawer summary,.drawer .d-link{display:flex;justify-content:space-between;padding:16px 20px;font-weight:700;list-style:none;cursor:pointer}
.drawer summary::after{content:'+'}
.drawer details[open] summary::after{content:'–'}
.drawer details ul{list-style:none;padding:0 20px 12px 32px}
.drawer details li a{display:block;padding:7px 0;color:var(--grey-900)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:var(--black);color:var(--white);padding:14px 22px;font-weight:600;z-index:200;transition:transform .3s,visibility .3s;display:flex;gap:14px;align-items:center;visibility:hidden}
.toast.show{transform:translate(-50%,0);visibility:visible}
.toast a{text-decoration:underline}

/* ── Responsive ── */
@media (max-width:1100px){
  .rail{grid-auto-columns:calc((100% - 48px)/4)}
  .cats{grid-template-columns:repeat(9,120px);overflow-x:auto;scrollbar-width:none}
  .mega-inner{grid-template-columns:repeat(3,1fr)}
  .mega-feature{display:none}
  .foot-grid{grid-template-columns:repeat(3,1fr)}
  .foot-brand{grid-column:1/-1}
}
@media (max-width:860px){
  .nav,.hdr-link.hide-m,.cur-toggle{display:none}
  .menu-btn{display:flex}
  .header-row{flex-wrap:wrap;height:auto;padding:10px 0;gap:10px 14px}
  .search{order:5;max-width:none;flex-basis:100%;height:42px}
  .logo-text small{display:none}
  .logo-text{font-size:17px}
  .logo-mark{width:36px;height:36px;font-size:17px}
  .hdr-link{padding:4px 6px;font-size:11px}
  .header-row{flex-wrap:wrap}
  .hdr-links{flex-shrink:0}
  .cats{grid-template-columns:repeat(9,96px)}
  .slide{grid-template-columns:1fr;height:auto;padding:40px 0 56px}
  .slide-text{padding:0 20px}
  .slide-art{display:none}
  .hero-arrow{display:none}
  .rail{grid-auto-columns:calc((100% - 16px)/2.2)}
  .rail-btn{display:none}
  .promo-sm{grid-template-columns:1fr 1fr}
  .promo-lg{grid-template-columns:1fr}
  .brands{grid-template-columns:repeat(3,1fr)}
  .workshop .wrap{grid-template-columns:1fr}
  .pkgs{grid-template-columns:1fr}
  .usp .wrap{grid-template-columns:1fr 1fr}
  .usp a+a{border-left:none}
  .about-shop{grid-template-columns:1fr}
  .foot-grid{grid-template-columns:1fr 1fr}
  .collect a{display:none}
}

/* ── Page hero (ແບບດຽວກັບ hero ໜ້າໂຮມ) ── */
.phero{background:var(--black);color:var(--white);overflow:hidden}
.phero.g{background:var(--grey-100);color:var(--black)}
.phero-in{display:grid;grid-template-columns:1.4fr 1fr;align-items:center;gap:24px;min-height:240px;padding-top:36px;padding-bottom:36px}
.phero .crumbs-h{font-size:13px;opacity:.75;margin-bottom:14px}
.phero .crumbs-h a{text-decoration:underline;text-underline-offset:3px}
.phero h1{font-size:clamp(34px,4.6vw,60px);font-weight:900;line-height:1.02;letter-spacing:-1.5px}
.phero p{font-size:17px;opacity:.85;margin-top:14px;max-width:520px}
.phero-art{justify-self:end;width:min(360px,100%);height:auto;opacity:.95}
.phero .btn{margin-top:22px}
@media (max-width:860px){.phero-in{grid-template-columns:1fr;min-height:0;padding-top:28px;padding-bottom:28px}.phero-art{display:none}}
main.wrap{padding-top:8px}

.crumbs{font-size:13px;color:var(--grey-600);padding:18px 0 6px}
.crumbs a:hover{text-decoration:underline}
.page-title{font-size:clamp(28px,3.4vw,44px);font-weight:900;letter-spacing:-1px;line-height:1.05}
.page-sub{color:var(--grey-600);margin:8px 0 0;max-width:62ch}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input,.field select,.field textarea{height:48px;border:1px solid var(--grey-300);padding:0 14px;font:inherit;background:#fff;border-radius:0}
.field textarea{height:96px;padding:12px 14px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#000;box-shadow:0 0 0 1px #000}
.field .err{font-size:13px;font-weight:600;display:none}
.field.invalid input,.field.invalid select{border-color:#000;border-width:2px}
.field.invalid .err{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--grey-300);padding:16px;cursor:pointer}
.choice:has(input:checked){border:2px solid #000;padding:15px}
.choice input{width:20px;height:20px;accent-color:#000;margin-top:2px}
.choice b{display:block}.choice small{color:var(--grey-600)}
.alert{background:var(--grey-100);border-left:4px solid #000;padding:14px 16px;font-size:14px}
@media (max-width:860px){.row2{grid-template-columns:1fr}}

.acc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding:28px 0 24px;border-bottom:2px solid #000}
.acc-head small{color:var(--grey-600)}
.pts{background:#000;color:#fff;padding:18px 24px;text-align:right}
.pts b{display:block;font-size:34px;font-weight:800;line-height:1}
.pts span{font-size:13px;opacity:.75}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--grey-300);margin:24px 0;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;white-space:nowrap;padding:14px 18px;font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{border-color:#000}
.list{display:flex;flex-direction:column;gap:12px;padding-bottom:72px}
.order{border:1px solid var(--grey-300);padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:8px 20px}
.order b{font-size:16px}
.order .meta{font-size:13px;color:var(--grey-600)}
.order .amt{font-weight:800;font-size:18px;text-align:right}
.order .items{grid-column:1/-1;font-size:14px;color:var(--grey-900)}
.st{display:inline-block;font-size:12px;font-weight:800;padding:3px 8px;border:1px solid #000;margin-left:8px}
.st.done{background:#000;color:#fff}
.cs-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--grey-300);border:1px solid var(--grey-300);margin-bottom:6px}
.cs-sum div{background:#fff;padding:16px 18px}.cs-sum b{display:block;font-size:18px;font-weight:800}.cs-sum small{color:var(--grey-600)}
.cs-sale{grid-column:1/-1;background:var(--grey-100);padding:10px 12px;font-size:13px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 16px}
.cs-sale span{color:var(--grey-600)}.cs-sale b{display:block;color:var(--ink)}
.cs-hd{font-size:13px;color:var(--grey-600);margin:10px 0 2px}
.co-pay{grid-column:1/-1;background:var(--grey-100);padding:10px 12px;font-size:13px;white-space:pre-wrap}
.co-acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.co-acts .btn{height:40px;padding:0 18px;font-size:14px}
.co-err{grid-column:1/-1;color:#b00020;font-size:13px;font-weight:600}

.cp-cur{height:40px;padding:0 10px;border:1.5px solid var(--grey-300);border-radius:10px;font:inherit;font-size:14px;background:#fff}
.cp-box{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--grey-300);padding:14px;font-size:14px}
.cp-box.ok{background:#e8f5e9;border-color:#a5d6a7;font-weight:700}
.cp-tqr{display:flex;flex-direction:column;gap:8px;margin-top:10px;white-space:normal}
.cp-qr{width:200px;max-width:100%;height:auto;align-self:flex-start}
.cp-ref{font-size:12.5px;color:#777;word-break:break-all}.cp-wait{font-size:13px;color:#555}
.cm-wrap{display:flex;flex-direction:column;gap:10px}
.cm-hint{font-size:13px;color:var(--grey-600,#666);line-height:1.5}
.cm-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--grey-300);padding:14px 16px;cursor:pointer;background:#fff;text-align:left;width:100%}
.cm-row b{display:block;font-size:15px}.cm-row small{display:block;color:#777;margin-top:3px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.cm-dot{background:#d32f2f;color:#fff;border-radius:10px;font-size:12px;font-weight:700;padding:2px 8px;flex:none}
.tabs button .cm-dot{margin-left:6px;font-size:11px;padding:1px 6px;vertical-align:middle}
.cm-box{border:1.5px solid var(--grey-300);display:flex;flex-direction:column;height:min(70vh,560px)}
.cm-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--grey-300)}
.cm-top b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--grey-100)}
.cm-m{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.cm-m.me{align-self:flex-end;background:#000;color:#fff}.cm-m.shop{align-self:flex-start;background:#fff;border:1px solid var(--grey-300)}
.cm-m time{display:block;font-size:10.5px;opacity:.6;margin-top:3px}
.cm-warn{background:#fff3e0;color:#8a4b00;padding:8px 12px;font-size:12.5px;font-weight:600}
.cm-send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--grey-300)}
.cm-send textarea{flex:1;font:inherit;padding:9px 12px;border:1.5px solid var(--grey-300);border-radius:10px;resize:none;height:44px;min-height:44px}
.cm-send .btn{height:44px;padding:0 18px}
.cm-closed{padding:12px;text-align:center;font-size:13px;color:#777;border-top:1px solid var(--grey-300)}
.cr-form{display:flex;flex-direction:column;gap:12px;border:1.5px solid var(--grey-300);padding:20px;margin-bottom:24px}
.cr-form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.cr-form input:not([type=checkbox]),.cr-form select,.cr-form textarea{font:inherit;font-weight:400;padding:10px 12px;border:1.5px solid var(--grey-300);border-radius:10px;background:#fff}
.cr-form textarea{min-height:76px;resize:vertical}
.cr-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cr-ck{flex-direction:row!important;align-items:flex-start;gap:8px!important;font-weight:400!important;font-size:13px!important}
.cr-ck input{margin-top:3px}
.cr-note{font-size:13px;color:var(--grey-600)}
.cr-ok{font-weight:800;color:#0a7a3b}
@media(max-width:560px){.cr-row{grid-template-columns:1fr}}
.empty{border:1px dashed var(--grey-300);padding:48px;text-align:center}
.empty p{color:var(--grey-600);margin:6px 0 18px}
.ptsbox{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--grey-300);border:1px solid var(--grey-300)}
.ptsbox div{background:#fff;padding:22px}
.ptsbox b{display:block;font-size:18px;font-weight:800;margin-bottom:4px}
.ptsbox small{color:var(--grey-600)}
@media (max-width:860px){.ptsbox{grid-template-columns:1fr}}

</style>

<script>

function subscribe(e){ e.preventDefault(); e.target.reset(); toast('ລົງທະບຽນແລ້ວ — ຈະສົ່ງໂປຣໂມຊັນໃຫ້ທາງອີເມວ'); }

<script>

const $=id=>document.getElementById(id);
const user=JSON.parse(sessionStorage.getItem('sd_user')||'null');
if(!user) location.replace('login.html');
let data={orders:[],repairs:[],points:user?.points||0}, tab='orders';
$('uName').textContent=user?.name||''; $('uMeta').textContent=[user?.email,user?.phone].filter(Boolean).join(' · ');
const d8=d=>{ try{ return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }catch(_){ return String(d).slice(0,10); } };
function render(){
  $('uPts').textContent=Number(data.points||0).toLocaleString();
  document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const L=$('list');
  if(tab==='consign'){ renderConsign(); return; }
  if(tab==='corders'){ renderCOrders(); return; }
  if(tab==='creq'){ renderCReq(); return; }
  if(tab==='msg'){ renderMsg(); return; }
  if(tab==='orders') L.innerHTML = data.orders.length ? data.orders.slice().reverse().map(o=>`<div class="order"><div><b>${o.bill_id}</b>${o.status?`<span class="st ${o.status==='ສຳເລັດ'?'done':''}">${o.status}</span>`:''}<div class="meta">${d8(o.date)} · ${o.payment||''}</div></div><div class="amt">${fmt(o.total)}</div><div class="items">${(o.items||[]).map(i=>`${i.name} ×${i.qty}`).join(', ')}</div></div>`).join('')
    : `<div class="empty"><b>ຍັງບໍ່ມີການສັ່ງຊື້</b><p>ຄຳສັ່ງຊື້ຈາກເວັບ ແລະ ທີ່ຮ້ານ ຈະສະແດງຢູ່ບ່ອນນີ້</p><a class="btn btn-black" href="catalogue.html">ເລືອກຊື້ສິນຄ້າ</a></div>`;
  if(tab==='repairs') L.innerHTML = data.repairs.length ? data.repairs.slice().reverse().map(r=>`<div class="order"><div><b>${r.bike||'ລົດຖີບ'}</b><span class="st ${/ສຳເລັດ|สำเร็จ|รับรถ|done|complete/i.test(r.status)?'done':''}">${r.status||'-'}</span><div class="meta">${r.job_id} · ${d8(r.date)}</div></div><div class="amt">${r.total?fmt(r.total):''}</div><div class="items">${r.symptoms||''}</div></div>`).join('')
    : `<div class="empty"><b>ຍັງບໍ່ມີປະຫວັດການສ້ອມ</b><p>ຈອງຄິວອອນລາຍ ແລ້ວຕິດຕາມສະຖານະໄດ້ບ່ອນນີ້</p><a class="btn btn-black" href="service.html#book">ຈອງຄິວ Workshop</a></div>`;
  if(tab==='points') L.innerHTML = `<div class="ptsbox"><div><b>${Number(data.points||0).toLocaleString()} ແຕ້ມ</b><small>ແຕ້ມທີ່ມີຕອນນີ້</small></div><div><b>฿1 = 1 ແຕ້ມ</b><small>ໄດ້ທຸກການຊື້ ແລະ ການສ້ອມ</small></div><div><b>ແລກສ່ວນຫຼຸດທີ່ຮ້ານ</b><small>ແຈ້ງພະນັກງານຕອນຊຳລະເງິນ</small></div></div>`;
}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ if(tab==='msg'&&b.dataset.t!=='msg'){ cmStop(); cmCur=null; } tab=b.dataset.t; render(); });

/* ── ຂອງຝາກຂາຍຂອງຂ້ອຍ (ສະແດງສະເພາະຜູ້ຝາກ) — consign-web ?op=mine, ບໍ່ມີຂໍ້ມູນຜູ້ຊື້ ── */
const CW_API='https://xukczixtojfmqhxepxwi.supabase.co/functions/v1/consign-web';
const CT={
  tab:{lo:'ຂອງຝາກຂາຍ',th:'ของฝากขาย',en:'My consignments'},
  recv:{lo:'ຮັບຝາກ',th:'รับฝาก',en:'Received'},exp:{lo:'ໝົດສັນຍາ',th:'หมดสัญญา',en:'Expires'},
  held:{lo:'ລໍຖ້າຮັບເງິນ',th:'รอรับเงิน',en:'Awaiting payout'},paid:{lo:'ຮັບເງິນແລ້ວ',th:'รับเงินแล้ว',en:'Paid'},
  agreed:{lo:'ລາຄາຕົກລົງ',th:'ราคาตกลง',en:'Agreed price'},sold:{lo:'ລາຄາຂາຍ',th:'ราคาขาย',en:'Sold at'},
  comm:{lo:'ຄ່າຄອມ',th:'ค่าคอม',en:'Commission'},net:{lo:'ຍອດທີ່ໄດ້ຮັບ',th:'ยอดที่ได้รับ',en:'You receive'},
  hold:{lo:'ຄົບພັກເງິນ',th:'ครบพักเงิน',en:'Hold ends'},paidOn:{lo:'ຈ່າຍແລ້ວ',th:'จ่ายแล้ว',en:'Paid on'},
  ready:{lo:'ພ້ອມຈ່າຍ — ຕິດຕໍ່ຮ້ານ',th:'พร้อมจ่าย — ติดต่อร้าน',en:'Ready — contact the shop'},
  noRenew:{lo:'ບໍ່ຕໍ່ສັນຍາ',th:'ไม่ต่อสัญญา',en:'Not renewing'},
  none:{lo:'ຍັງບໍ່ມີຂອງຝາກ',th:'ยังไม่มีของฝาก',en:'No consigned items'},
  st:{received:['ຮັບແລ້ວ','รับแล้ว','Received'],inspecting:['ກຳລັງກວດ','กำลังตรวจ','Inspecting'],approved:['ກວດຜ່ານ','ตรวจผ่าน','Approved'],rejected:['ບໍ່ຜ່ານ','ไม่ผ่าน','Rejected'],listed:['ກຳລັງຂາຍ','วางขายอยู่','Listed'],reserved:['ຈອງແລ້ວ','จองแล้ว','Reserved'],sold:['ຂາຍແລ້ວ','ขายแล้ว','Sold'],returned:['ສົ່ງຄືນແລ້ວ','คืนแล้ว','Returned'],cancelled:['ຍົກເລີກ','ยกเลิก','Cancelled']}
};
const cL=()=>({lo:0,th:1,en:2}[(typeof sdLang==='function'?sdLang():'lo')]||0);
const ct=k=>(CT[k]||{})[typeof sdLang==='function'?sdLang():'lo']||(CT[k]||{}).lo||k;
const cst=s=>((CT.st[s]||[s,s,s])[cL()]);
const cesc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cmoney=(n,cur)=>Number(n||0).toLocaleString('en-US')+' '+cesc(cur||'THB');
let cons=null;
function renderConsign(){
  const L=$('list'); if(!cons||!cons.consignments||!cons.consignments.length){ L.innerHTML='<div class="empty"><b>'+cesc(ct('none'))+'</b></div>'; return; }
  const tot=(cons.totals||[]).map(t=>'<div><b>'+cmoney(t.held,t.currency)+'</b><small>'+cesc(ct('held'))+'</small></div><div><b>'+cmoney(t.paid,t.currency)+'</b><small>'+cesc(ct('paid'))+'</small></div>').join('');
  L.innerHTML=(tot?'<div class="cs-sum">'+tot+'</div>':'')+cons.consignments.map(c=>
    '<div class="cs-hd">'+cesc(c.id)+' · '+cesc(ct('recv'))+' '+cesc(c.receivedDate||'')+' · '+cesc(ct('exp'))+' '+cesc(c.expiresDate||'')+(c.noRenew?' · '+cesc(ct('noRenew')):'')+' <button class="btn btn-line" type="button" style="height:32px;padding:0 12px;font-size:12px" data-msgopen="consignmentId" data-ref="'+cesc(c.id)+'">'+cesc(cm('toShop'))+'</button></div>'+
    (c.items||[]).map(i=>{ const s=i.sale;
      return '<div class="order"><div><b>'+cesc(i.name)+'</b><span class="st '+(i.status==='sold'?'done':'')+'">'+cesc(cst(i.status))+'</span><div class="meta">'+cesc(i.code)+(i.grade?' · '+cesc(i.grade):'')+'</div></div>'+
      '<div class="amt">'+(s?cesc(fmt(Number(s.priceThb))):(i.agreedPrice!=null?cesc(fmt(Number(i.agreedPrice))):''))+'</div>'+
      (s?'<div class="cs-sale"><div><span>'+cesc(ct('sold'))+' '+cesc(s.soldDate||'')+'</span><b>'+cesc(fmt(Number(s.priceThb)))+'</b></div>'+
        '<div><span>'+cesc(ct('comm'))+(s.pct!=null?' '+cesc(s.pct)+'%':'')+'</span><b>'+cesc(fmt(Number(s.commissionThb)))+'</b></div>'+
        '<div><span>'+cesc(ct('net'))+'</span><b>'+cmoney(s.netPayout,s.currency)+'</b></div>'+
        '<div><span>'+cesc(s.paid?ct('paidOn'):ct('hold'))+'</span><b>'+cesc(s.paid?(s.paidDate||''):(s.holdUntil||''))+(!s.paid&&s.holdOver?' ✓ '+cesc(ct('ready')):'')+'</b></div></div>':'')+'</div>'; }).join('')).join('');
}
async function loadConsign(){
  try{ const r=await fetch(CW_API+'?op=mine',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:user.token})}); const j=await r.json();
    if(r.ok&&j.ok&&j.isConsignor){ cons=j; const b=$('tabConsign'); b.hidden=false; b.textContent=ct('tab'); if(tab==='consign') renderConsign(); } }
  catch(_){ /* ບໍ່ແຈ້ງຜິດພາດ: ລູກຄ້າທົ່ວໄປບໍ່ຕ້ອງເຫັນ */ }
}

/* ຍ່ອຮູບສະລິບ (≤1400px JPEG) ກ່ອນສົ່ງ — ເຊີບເວີຮັບ ≤2 MB ແລະກວດຊະນິດໄຟລ໌ຈາກໄບຕ໌ */
async function coShrink(file){
  const bmp=await createImageBitmap(file); const k=Math.min(1,1400/Math.max(bmp.width,bmp.height));

  for(const q of [0.85,0.7,0.55,0.4]){ const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',q)); if(b&&b.size<=1500*1024) return b; }
  throw new Error(co('bad'));
}

    '<div class="cr-row"><label>'+cesc(cr('cur'))+'<select name="payoutCurrency"><option value="LAK">LAK ₭</option><option value="THB">THB ฿</option><option value="USD">USD $</option></select></label>'+

      if(r.photoCount>=1) acts.push('<button class="btn btn-black" type="button" data-cra="submit" data-id="'+cesc(r.id)+'">'+cesc(cr('submitB'))+'</button>'); }

      '<div class="amt">'+(r.wantPriceThb==null?'':cesc(fmt(Number(r.wantPriceThb))))+'</div>'+

async function crPhotos(id,files,from,total){
  for(let i=0;i<files.length;i++){ crMsg=''; const e=$('crErr'); if(e&&id===crPhotos.cur) e.textContent=cr('photoN')+' '+(from+i+1)+'/'+total;
    const blob=await coShrink(files[i]); await coPost('request_photo',{request:id,image:await coB64(blob)}); }
}
async function loadCReq(){ try{ creq=await coPost('requests',{}); }catch(_){ creq=creq||{requests:[]}; } if(tab==='creq') renderCReq(); }
document.addEventListener('change',e=>{
  const f=e.target.closest('#crForm input[name=photos]'); if(f){ const n=f.files.length; $('crPicked').textContent=n?(n+' '+cr('picked')+(n>6?' ⚠ max 6':'')):''; return; }
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='crForm') return; e.preventDefault(); if(crBusy) return; const f=e.target, err=$('crErr'); err.textContent=''; crMsg='';
  const files=[...f.photos.files];
  if(!f.title.value.trim()||files.length<1||files.length>6||!f.consent.checked){ err.textContent=cr('need'); return; }
  crBusy=true; const b=$('crGo'); b.disabled=true; b.textContent=cr('sending'); let id=null;
  try{
    const r=await coPost('request',{kind:f.kind.value,title:f.title.value,yearBought:f.yearBought.value,conditionNote:f.conditionNote.value,wantPriceThb:f.wantPriceThb.value,payoutCurrency:f.payoutCurrency.value,consent:true});
    id=r.request.id; crPhotos.cur=id; await crPhotos(id,files,0,files.length);
    await coPost('request_submit',{request:id}); crMsg=cr('done'); creq=await coPost('requests',{}); crBusy=false; renderCReq();
  }catch(er){
    crBusy=false; if(er.message==='SESSION_EXPIRED') return;
    if(id){ crMsg=''; try{ creq=await coPost('requests',{}); }catch(_){} renderCReq(); const e2=$('crErr'); if(e2) e2.textContent=er.message+' — '+cr('partial'); }
    else { err.textContent=er.message; b.disabled=false; b.textContent=cr('send'); }
  }
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-cra]'); if(!b||crBusy) return; const id=b.dataset.id; delete crErr[id];
  if(b.dataset.cra==='cancel'&&!confirm(cr('cancelAsk'))) return;
  crBusy=true;
  try{ await coPost(b.dataset.cra==='submit'?'request_submit':'request_cancel',{request:id}); creq=await coPost('requests',{}); }
  catch(er){ if(er.message!=='SESSION_EXPIRED') crErr[id]=er.message; }
  crBusy=false; renderCReq();
});
document.addEventListener('change',async e=>{
  const inp=e.target.closest('[data-crph]'); if(!inp||!inp.files||!inp.files.length||crBusy) return; const id=inp.dataset.crph, files=[...inp.files]; inp.value='';
  const r=((creq&&creq.requests)||[]).find(x=>x.id===id); if(!r) return;
  if(r.photoCount+files.length>6){ crErr[id]=cr('photos'); renderCReq(); return; }
  crBusy=true; delete crErr[id]; crErr[id]=cr('sending'); renderCReq();
  try{ await crPhotos(id,files,0,files.length); delete crErr[id]; creq=await coPost('requests',{}); }
  catch(er){ if(er.message!=='SESSION_EXPIRED') crErr[id]=er.message; try{ creq=await coPost('requests',{}); }catch(_){} }
  crBusy=false; renderCReq();
});
document.addEventListener('langchange',()=>{ const b=$('tabCReq'); if(b&&!b.hidden){ b.textContent=cr('tab'); if(tab==='creq'&&!crBusy) renderCReq(); } });

  if(reset||add.length) drawChat(true);
  const l=(cmThreads&&cmThreads.threads)||[]; const t=l.find(x=>x.id===cmCur.id); if(t){ t.unread=0; cmTab(); }
}
async function cmOpenThread(id){
  const l=(cmThreads&&cmThreads.threads)||[]; cmCur=l.find(x=>x.id===id)||{id:id}; cmWarn=''; cmErr='';
  try{ await cmFetch(true); }catch(er){ if(er.message!=='SESSION_EXPIRED'){ cmErr=er.message; } }
  cmPoll(); render();
}
function drawChat(keepBox){
  if(tab!=='msg'||!cmCur) return; const L=$('list'); const open=cmCur.status!=='closed';
  const prev=$('cmMsgs'), near=!prev||prev.scrollHeight-prev.scrollTop-prev.clientHeight<80, draft=($('cmIn')||{}).value||'';
  L.innerHTML='<div class="cm-box"><div class="cm-top"><button class="btn btn-line" type="button" style="height:34px;padding:0 14px;font-size:13px" data-cmback="1">'+cesc(cm('back'))+'</button><b>'+cesc(cmCur.title||'')+'</b></div>'+
    (cmWarn?'<div class="cm-warn" role="alert">'+cesc(cmWarn)+'</div>':'')+
    '<div class="cm-msgs" id="cmMsgs">'+cmMsgs.map(m=>'<div class="cm-m '+(m.sender==='customer'?'me':'shop')+'">'+cesc(m.body)+'<time>'+(m.sender==='customer'?'':cesc(cm('shop'))+' · ')+cesc(cmTime(m.createdAt))+'</time></div>').join('')+'</div>'+
    (cmErr?'<div class="co-err" role="alert" style="padding:6px 14px">'+cesc(cmErr)+'</div>':'')+
    (open?'<form class="cm-send" id="cmForm"><textarea id="cmIn" maxlength="1000" placeholder="'+cesc(cm('ph'))+'"></textarea><button class="btn btn-black" type="submit">'+cesc(cm('send'))+'</button></form>':'<div class="cm-closed">'+cesc(cm('closed'))+'</div>')+'</div>';
  const box=$('cmMsgs'); if(box&&near) box.scrollTop=box.scrollHeight; const inp=$('cmIn'); if(inp&&draft) inp.value=draft;
}
function renderMsg(){
  const L=$('list'); if(cmCur){ drawChat(); return; }
  const l=(cmThreads&&cmThreads.threads)||[];
  L.innerHTML='<div class="cm-wrap"><div class="cm-hint">'+cesc(cm('hint'))+'</div>'+(l.length?l.map(t=>'<button type="button" class="cm-row" data-cmth="'+cesc(t.id)+'"><div><b>'+cesc(t.title||'')+'</b><small>'+cesc(t.last||'')+'</small></div>'+(Number(t.unread)?'<span class="cm-dot">'+t.unread+'</span>':'')+'</button>').join(''):'<div class="empty"><b>'+cesc(cm('none'))+'</b></div>')+'</div>';
}
document.addEventListener('click',async e=>{
  const th=e.target.closest('[data-cmth]'); if(th){ await cmOpenThread(th.dataset.cmth); return; }
  if(e.target.closest('[data-cmback]')){ cmStop(); cmCur=null; cmWarn=''; cmErr=''; await loadMsg(); render(); return; }
  const op=e.target.closest('[data-msgopen]'); if(op&&!cmBusy){ cmBusy=true;
    try{ const r=await coPost('thread_open',{kind:'consignor',[op.dataset.msgopen]:op.dataset.ref}); await loadMsg(); tab='msg'; cmCur=r.thread; cmWarn=''; cmErr=''; await cmFetch(true); cmPoll(); render(); }
    catch(er){ if(er.message!=='SESSION_EXPIRED') alert(er.message); } cmBusy=false; }
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='cmForm') return; e.preventDefault(); if(cmBusy) return; const inp=$('cmIn'), body=inp.value.trim(); if(!body) return;
  cmBusy=true; cmErr=''; cmWarn='';
  try{ const r=await coPost('thread_send',{thread:cmCur.id,body}); inp.value=''; if(r.warning) cmWarn=cm('warn'); await cmFetch(false); drawChat(true); }
  catch(er){ if(er.message!=='SESSION_EXPIRED'){ cmErr=er.message; drawChat(true); } }
  cmBusy=false;
});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&tab==='msg'&&cmCur&&!cmBusy) cmFetch(false).catch(()=>{}); });
document.addEventListener('langchange',()=>{ cmTab(); if(tab==='msg'&&!cmBusy) renderMsg(); });
function logout(){ sessionStorage.removeItem('sd_user'); location.href='login.html'; }
async function load(){
  try{ const d=await apiPost('getCustomerOrders',{token:user.token}); data={orders:d.orders||[],repairs:d.repairs||[],points:d.points??user.points}; }
  catch(e){ if(/SESSION_EXPIRED/.test(e.message)||!user.token){ sessionStorage.removeItem('sd_user'); location.replace('login.html'); return; } $('list').innerHTML=`<div class="empty"><b>ໂຫຼດຂໍ້ມູນບໍ່ໄດ້</b><p>${e.message}</p><button class="btn btn-black" onclick="load()">ລອງອີກຄັ້ງ</button></div>`; return; }
  render();
}
document.addEventListener('currencychange',()=>{ if(tab==='consign') renderConsign(); else if(tab==='corders') renderCOrders(); else if(tab==='creq'&&!crBusy) renderCReq(); else render(); });
if(user){ load(); if(user.token){ loadConsign(); loadCOrders(); loadPayCfg(); const tb=$('tabCReq'); tb.hidden=false; tb.textContent=cr('tab'); if(new URLSearchParams(location.search).get('tab')==='creq'){ tab='creq'; } loadCReq(); loadMsg(); const qs=new URLSearchParams(location.search); if(qs.get('tab')==='msg'){ tab='msg'; render(); const th=qs.get('th'); if(th&&/^[0-9a-f-]{36}$/.test(th)) coPost('threads',{}).then(j=>{ cmThreads=j; cmTab(); cmOpenThread(th); }).catch(()=>{}); } } }

</script>
</body>
