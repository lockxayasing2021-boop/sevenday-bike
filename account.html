<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ບັນຊີຂອງຂ້ອຍ — Sevenday Bike</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sevenday.css">
<style>
.crumbs{font-size:13px;color:var(--grey-600);padding:18px 0 6px}
.crumbs a:hover{text-decoration:underline}
.page-title{font-size:clamp(28px,3.4vw,44px);font-weight:800;letter-spacing:-.01em;line-height:1.05}
.page-sub{color:var(--grey-600);margin:8px 0 0;max-width:62ch}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input,.field select,.field textarea{height:48px;border:1px solid var(--grey-300);padding:0 14px;font:inherit;background:#fff;border-radius:0}
.field textarea{height:96px;padding:12px 14px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#000;box-shadow:0 0 0 1px #000}
.field .err{font-size:13px;font-weight:600;display:none}
.field.invalid input,.field.invalid select{border-color:#000;border-width:2px}
.field.invalid .err{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--grey-300);padding:16px;cursor:pointer}
.choice:has(input:checked){border:2px solid #000;padding:15px}
.choice input{width:20px;height:20px;accent-color:#000;margin-top:2px}
.choice b{display:block}.choice small{color:var(--grey-600)}
.alert{background:var(--grey-100);border-left:4px solid #000;padding:14px 16px;font-size:14px}
@media (max-width:860px){.row2{grid-template-columns:1fr}}

.acc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding:28px 0 24px;border-bottom:2px solid #000}
.acc-head small{color:var(--grey-600)}
.pts{background:#000;color:#fff;padding:18px 24px;text-align:right}
.pts b{display:block;font-size:34px;font-weight:800;line-height:1}
.pts span{font-size:13px;opacity:.75}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--grey-300);margin:24px 0}
.tabs button{padding:14px 18px;font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{border-color:#000}
.list{display:flex;flex-direction:column;gap:12px;padding-bottom:72px}
.order{border:1px solid var(--grey-300);padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:8px 20px}
.order b{font-size:16px}
.order .meta{font-size:13px;color:var(--grey-600)}
.order .amt{font-weight:800;font-size:18px;text-align:right}
.order .items{grid-column:1/-1;font-size:14px;color:var(--grey-900)}
.st{display:inline-block;font-size:12px;font-weight:800;padding:3px 8px;border:1px solid #000;margin-left:8px}
.st.done{background:#000;color:#fff}
.empty{border:1px dashed var(--grey-300);padding:48px;text-align:center}
.empty p{color:var(--grey-600);margin:6px 0 18px}
.ptsbox{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--grey-300);border:1px solid var(--grey-300)}
.ptsbox div{background:#fff;padding:22px}
.ptsbox b{display:block;font-size:18px;font-weight:800;margin-bottom:4px}
.ptsbox small{color:var(--grey-600)}
@media (max-width:860px){.ptsbox{grid-template-columns:1fr}}

</style>
</head>
<body>

<main class="wrap">
  <div class="acc-head">
    <div><small>ບັນຊີຂອງຂ້ອຍ</small><h1 class="page-title" id="uName">...</h1><small id="uMeta"></small></div>
    <div style="display:flex;gap:12px;align-items:stretch"><div class="pts"><b id="uPts">0</b><span>ແຕ້ມສະສົມ</span></div>
      <button class="btn btn-line" style="border-radius:0;height:auto" onclick="logout()">ອອກຈາກລະບົບ</button></div>
  </div>
  <div class="tabs" role="tablist">
    <button class="on" data-t="orders">ປະຫວັດການສັ່ງຊື້</button><button data-t="repairs">ປະຫວັດການສ້ອມ</button><button data-t="points">ແຕ້ມສະສົມ</button>
  </div>
  <div class="list" id="list"><div class="empty">ກຳລັງໂຫຼດ...</div></div>
</main>

<script src="layout.js"></script>
<script>

const $=id=>document.getElementById(id);
const user=JSON.parse(sessionStorage.getItem('sd_user')||'null');
if(!user) location.replace('login.html');
let data={orders:[],repairs:[],points:user?.points||0}, tab='orders';
$('uName').textContent=user?.name||''; $('uMeta').textContent=[user?.email,user?.phone].filter(Boolean).join(' · ');
const d8=d=>{ try{ return new Date(d).toLocaleDateString('lo-LA',{day:'numeric',month:'short',year:'numeric'}); }catch(_){ return String(d).slice(0,10); } };
function render(){
  $('uPts').textContent=Number(data.points||0).toLocaleString();
  document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const L=$('list');
  if(tab==='orders') L.innerHTML = data.orders.length ? data.orders.slice().reverse().map(o=>`<div class="order"><div><b>${o.bill_id}</b><div class="meta">${d8(o.date)} · ${o.payment||''}</div></div><div class="amt">${fmt(o.total)}</div><div class="items">${(o.items||[]).map(i=>`${i.name} ×${i.qty}`).join(', ')}</div></div>`).join('')
    : `<div class="empty"><b>ຍັງບໍ່ມີການສັ່ງຊື້</b><p>ຄຳສັ່ງຊື້ຈາກເວັບ ແລະ ທີ່ຮ້ານ ຈະສະແດງຢູ່ບ່ອນນີ້</p><a class="btn btn-black" href="catalogue.html">ເລືອກຊື້ສິນຄ້າ</a></div>`;
  if(tab==='repairs') L.innerHTML = data.repairs.length ? data.repairs.slice().reverse().map(r=>`<div class="order"><div><b>${r.bike||'ຈັກຍານ'}</b><span class="st ${/ສຳເລັດ|สำเร็จ|รับรถ|done|complete/i.test(r.status)?'done':''}">${r.status||'-'}</span><div class="meta">${r.job_id} · ${d8(r.date)}</div></div><div class="amt">${r.total?fmt(r.total):''}</div><div class="items">${r.symptoms||''}</div></div>`).join('')
    : `<div class="empty"><b>ຍັງບໍ່ມີປະຫວັດການສ້ອມ</b><p>ຈອງຄິວອອນລາຍ ແລ້ວຕິດຕາມສະຖານະໄດ້ບ່ອນນີ້</p><a class="btn btn-black" href="service.html#book">ຈອງຄິວ Workshop</a></div>`;
  if(tab==='points') L.innerHTML = `<div class="ptsbox"><div><b>${Number(data.points||0).toLocaleString()} ແຕ້ມ</b><small>ແຕ້ມທີ່ມີຕອນນີ້</small></div><div><b>฿1 = 1 ແຕ້ມ</b><small>ໄດ້ທຸກການຊື້ ແລະ ການສ້ອມ</small></div><div><b>ແລກສ່ວນຫຼຸດທີ່ຮ້ານ</b><small>ແຈ້ງພະນັກງານຕອນຊຳລະເງິນ</small></div></div>`;
}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; render(); });
function logout(){ sessionStorage.removeItem('sd_user'); location.href='login.html'; }
async function load(){
  try{ const d=await apiPost('getCustomerOrders',{customer_id:user.customer_id}); data={orders:d.orders||[],repairs:d.repairs||[],points:d.points??user.points}; }
  catch(e){ $('list').innerHTML=`<div class="empty"><b>ໂຫຼດຂໍ້ມູນບໍ່ໄດ້</b><p>${e.message}</p><button class="btn btn-black" onclick="load()">ລອງອີກຄັ້ງ</button></div>`; return; }
  render();
}
document.addEventListener('currencychange',render);
if(user) load();

</script>
</body>
</html>
