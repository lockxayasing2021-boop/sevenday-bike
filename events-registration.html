<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>ລາຍລະອຽດການສະໝັກ</title>
<link rel="stylesheet" href="Sevenday.css">
<style>
:root {
  --accent: #FF3B00;
  --accent-dim: rgba(255,59,0,.12);
  --radius: 12px;
}

.reg-wrap {
  max-width: 680px;
  margin: 2rem auto;
  padding: 0 1rem 4rem;
}

/* Status badge */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: .35rem .85rem;
  border-radius: 999px;
}
.status-badge.pending   { background:#FFF3CD; color:#856404; }
.status-badge.approved  { background:#D1FAE5; color:#065F46; }
.status-badge.rejected  { background:#FEE2E2; color:#991B1B; }
.status-badge.checked   { background:#DBEAFE; color:#1E40AF; }

/* Card */
.reg-card {
  background: var(--white);
  border: 1px solid var(--grey-300);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 1.5rem;
}
.reg-card-header {
  background: var(--accent);
  color: #fff;
  padding: 1.25rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: .75rem;
}
.reg-card-header h2 { margin: 0; font-size: 1.15rem; }
.reg-card-body { padding: 1.5rem; }

/* QR block */
.qr-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1.5rem;
  gap: 1rem;
  border-bottom: 1px solid var(--grey-300);
}
#qr-canvas { width: 200px; height: 200px; }
.qr-caption {
  font-size: .8rem;
  color: var(--grey-600);
  text-align: center;
}

/* Detail rows */
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .75rem 1.25rem;
  padding: 1.25rem 1.5rem;
}
@media(max-width:520px){ .detail-grid{ grid-template-columns:1fr; } }
.detail-item label {
  display: block;
  font-size: .72rem;
  color: var(--grey-600);
  letter-spacing: .04em;
  text-transform: uppercase;
  margin-bottom: .2rem;
}
.detail-item span {
  font-size: .95rem;
  color: var(--grey-900);
  font-weight: 500;
}

/* Actions */
.reg-actions {
  display: flex;
  gap: .75rem;
  flex-wrap: wrap;
  padding: 1.25rem 1.5rem;
  border-top: 1px solid var(--grey-300);
}
.btn-primary {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: .65rem 1.25rem;
  font-size: .9rem;
  font-weight: 600;
  cursor: pointer;
}
.btn-ghost {
  background: transparent;
  color: var(--accent);
  border: 1.5px solid var(--accent);
  border-radius: 8px;
  padding: .65rem 1.25rem;
  font-size: .9rem;
  font-weight: 600;
  cursor: pointer;
}

/* Skeleton */
.skeleton {
  background: linear-gradient(90deg, var(--grey-100) 25%, var(--grey-300) 50%, var(--grey-100) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 6px;
  height: 1.1rem;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* Error/notice */
.notice {
  padding: 1.25rem 1.5rem;
  border-radius: var(--radius);
  margin-bottom: 1.5rem;
  font-size: .95rem;
}
.notice.error { background:#FEE2E2; color:#991B1B; border:1px solid #FCA5A5; }
.notice.info  { background:#EFF6FF; color:#1E40AF; border:1px solid #BFDBFE; }

/* Timeline */
.timeline {
  padding: 1.25rem 1.5rem;
  border-top: 1px solid var(--grey-300);
}
.timeline h4 { font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: var(--grey-600); margin: 0 0 .9rem; }
.tl-item {
  display: flex;
  gap: .75rem;
  align-items: flex-start;
  padding: .5rem 0;
}
.tl-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--grey-300);
  flex-shrink: 0;
  margin-top: .35rem;
}
.tl-dot.done { background: #10B981; }
.tl-dot.active { background: var(--accent); }
.tl-text { font-size: .875rem; color: var(--grey-900); }
.tl-time { font-size: .75rem; color: var(--grey-600); }
</style>

<div class="reg-wrap">
  <div id="notice-area"></div>
  <div id="reg-container">
    <!-- skeleton -->
    <div class="reg-card" id="skeleton-card">
      <div class="reg-card-header" style="background:var(--grey-300);">
        <div class="skeleton" style="width:200px;height:1.2rem;background:rgba(255,255,255,.3);"></div>
        <div class="skeleton" style="width:80px;height:1.5rem;background:rgba(255,255,255,.3);border-radius:999px;"></div>
      </div>
      <div class="qr-block">
        <div class="skeleton" style="width:200px;height:200px;border-radius:8px;"></div>
      </div>
      <div class="detail-grid">
        <div class="detail-item"><div class="skeleton" style="width:80px;margin-bottom:.4rem;"></div><div class="skeleton" style="width:140px;height:1.3rem;"></div></div>
        <div class="detail-item"><div class="skeleton" style="width:80px;margin-bottom:.4rem;"></div><div class="skeleton" style="width:120px;height:1.3rem;"></div></div>
        <div class="detail-item"><div class="skeleton" style="width:80px;margin-bottom:.4rem;"></div><div class="skeleton" style="width:160px;height:1.3rem;"></div></div>
        <div class="detail-item"><div class="skeleton" style="width:80px;margin-bottom:.4rem;"></div><div class="skeleton" style="width:100px;height:1.3rem;"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const API_URL_EVT = 'https://script.google.com/macros/s/AKfycbyOcu6vlWUnvzRb4GTjEpxz5Amre1KhTYa7wU9PPjVlBd79B8XMzeJER_h-OLrHnxBboA/exec';
const EVT_SECRET  = 'SDdMc3wNjJEevs60n2oMQeGnuI';

async function hmacSign(body){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(EVT_SECRET),
    {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(body));
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function evtGet(params){
  const qs = Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  const sig = await hmacSign(qs);
  const res = await fetch(API_URL_EVT+'?'+qs+'&sig='+sig);
  return JSON.parse(await res.text());
}

function notice(msg, type='error'){
  document.getElementById('notice-area').innerHTML =
    `<div class="notice ${type}">${msg}</div>`;
}

function statusBadge(s){
  const map = {
    pending:  ['pending',  'ລໍຖ້າການອະນຸມັດ'],
    approved: ['approved', 'ອະນຸມັດແລ້ວ'],
    rejected: ['rejected', 'ຖືກປະຕິເສດ'],
    'checked-in':['checked','ເຂົ້າຮ່ວມແລ້ວ'],
  };
  const [cls, label] = map[s] || ['pending', s];
  return `<span class="status-badge ${cls}">${label}</span>`;
}

function fmtDate(d){
  if(!d) return '-';
  const dt = new Date(d);
  return dt.toLocaleDateString('lo-LA', {year:'numeric',month:'long',day:'numeric'});
}

function renderReg(r){
  const container = document.getElementById('reg-container');

  // QR token must come from backend — never use registration ID directly
  const qrToken = r.qrToken || r.qr_token || '';

  container.innerHTML = `
    <div class="reg-card">
      <div class="reg-card-header">
        <div>
          <div style="font-size:.75rem;opacity:.8;margin-bottom:.25rem;letter-spacing:.04em">ໃບຢືນຢັນການສະໝັກ</div>
          <h2>${r.eventName || r.event_name || 'Event'}</h2>
        </div>
        ${statusBadge(r.status)}
      </div>

      ${qrToken ? `
      <div class="qr-block">
        <div id="qr-canvas"></div>
        <div class="qr-caption">
          ສະແກນ QR ທີ່ Check-in<br>
          <span style="color:var(--grey-900);font-weight:600">${r.registrationId || r.id || ''}</span>
        </div>
      </div>` : `
      <div class="qr-block" style="padding:1.5rem">
        <div style="background:var(--grey-100);border-radius:8px;padding:1.25rem 2rem;text-align:center;color:var(--grey-600);font-size:.9rem;">
          ${r.status === 'pending' ? 'QR Code ຈະສະແດງຫຼັງຈາກໄດ້ຮັບການອະນຸມັດ' :
            r.status === 'rejected' ? 'ການສະໝັກຖືກປະຕິເສດ' : 'ບໍ່ມີ QR Token'}
        </div>
      </div>`}

      <div class="detail-grid">
        <div class="detail-item"><label>ຊື່-ນາມສະກຸນ</label><span>${r.firstName||''} ${r.lastName||''}</span></div>
        <div class="detail-item"><label>ເບີໂທ</label><span>${r.phone||r.phoneNumber||'-'}</span></div>
        <div class="detail-item"><label>ປະເພດ / Category</label><span>${r.categoryName||r.category||'-'}</span></div>
        <div class="detail-item"><label>ຄ່າສະໝັກ</label><span>${r.fee!=null ? Number(r.fee).toLocaleString()+' ₭' : '-'}</span></div>
        <div class="detail-item"><label>ວັນງານ</label><span>${fmtDate(r.eventDate||r.event_date)}</span></div>
        <div class="detail-item"><label>ສະຖານທີ</label><span>${r.location||'-'}</span></div>
        <div class="detail-item"><label>ວັນທີສະໝັກ</label><span>${fmtDate(r.registeredAt||r.created_at)}</span></div>
        <div class="detail-item"><label>ລະຫັດການສະໝັກ</label><span style="font-variant-numeric:tabular-nums">${r.registrationId||r.id||'-'}</span></div>
      </div>

      ${r.note||r.adminNote ? `
      <div style="padding:.75rem 1.5rem;background:var(--grey-100);margin:0 1.5rem 1.25rem;border-radius:8px;">
        <label style="font-size:.72rem;color:var(--grey-600);text-transform:uppercase;letter-spacing:.04em;">ໝາຍເຫດ</label>
        <p style="margin:.25rem 0 0;font-size:.9rem;">${r.note||r.adminNote}</p>
      </div>` : ''}

      <div class="timeline">
        <h4>ຂັ້ນຕອນ</h4>
        ${buildTimeline(r.status)}
      </div>

      <div class="reg-actions">
        <a href="events.html" class="btn-ghost" style="text-decoration:none;">← ກັບໄປ Events</a>
        <a href="my-registrations.html" class="btn-primary" style="text-decoration:none;">ການສະໝັກຂອງຂ້ອຍ</a>
        <button class="btn-ghost" onclick="window.print()">ພິມ / Save PDF</button>
      </div>
    </div>
  `;

  // Generate QR if token available
  if(qrToken){
    try{
      new QRCode(document.getElementById('qr-canvas'), {
        text: qrToken,
        width: 200, height: 200,
        colorDark:'#2B2B2B', colorLight:'#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
    } catch(e){ console.warn('QR gen failed', e); }
  }
}

function buildTimeline(status){
  const steps = [
    {key:'registered', label:'ສົ່ງການສະໝັກ', desc:'ໄດ້ຮັບຟອມສະໝັກແລ້ວ'},
    {key:'pending',    label:'ລໍຖ້າການອະນຸມັດ', desc:'ທີມງານກໍາລັງກວດສອບ'},
    {key:'approved',   label:'ອະນຸມັດ', desc:'ການສະໝັກໄດ້ຮັບການອະນຸມັດ'},
    {key:'checked-in', label:'ເຂົ້າຮ່ວມ', desc:'Scan QR ທີ່ Check-in'},
  ];
  const order = {registered:0, pending:1, approved:2, 'checked-in':3, rejected:1};
  const cur = order[status] ?? 1;

  if(status === 'rejected'){
    return `<div class="tl-item">
      <div class="tl-dot active" style="background:#EF4444;"></div>
      <div><div class="tl-text">ຖືກປະຕິເສດ</div><div class="tl-time">ກະລຸນາຕິດຕໍ່ທີມງານ</div></div>
    </div>`;
  }

  return steps.map((s,i) => `
    <div class="tl-item">
      <div class="tl-dot ${i < cur ? 'done' : i === cur ? 'active' : ''}"></div>
      <div>
        <div class="tl-text">${s.label}</div>
        <div class="tl-time">${i <= cur ? s.desc : ''}</div>
      </div>
    </div>
  `).join('');
}

async function init(){
  const params = new URLSearchParams(location.search);
  const regId = params.get('id');

  if(!regId){
    notice('ບໍ່ພົບລະຫັດການສະໝັກ ກະລຸນາກວດສອບ URL ອີກຄັ້ງ');
    document.getElementById('skeleton-card').remove();
    return;
  }

  // Check sd_user for auth context (optional — view is semi-public via registration ID)
  const sdUser = JSON.parse(sessionStorage.getItem('sd_user')||'null');

  try{
    const data = await evtGet({ action:'evt.getRegistrationDetail', id: regId });

    document.getElementById('skeleton-card').remove();

    if(!data.success){
      notice(data.message || 'ບໍ່ພົບຂໍ້ມູນການສະໝັກ');
      return;
    }

    const reg = data.registration || data.data || data;

    // Privacy check: if sd_user exists, only show if it's their registration
    if(sdUser && reg.customerId && sdUser.id && reg.customerId !== sdUser.id){
      notice('ບໍ່ມີສິດໃນການເຂົ້າເບິ່ງຂໍ້ມູນນີ້');
      return;
    }

    renderReg(reg);

  } catch(e){
    document.getElementById('skeleton-card').remove();
    notice('ເກີດຂໍ້ຜິດພາດ: ' + e.message);
    console.error(e);
  }
}

init();
</script>
<script src="layout.js"></script>
</html>
